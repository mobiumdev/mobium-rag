 had fixed the gesture itself. A WKWebView does not synthesize `dblclick` from XCUITest-injected touches. Not from a W3C chain, and **not from WebDriverAgent's own `/wda/doubleTap`** — the platform's own primitive, delivered back to back with no gap the page can see. A React Native `Pressable` is no better from the other side: it coalesces the two taps into a single `onPress`, so the app that receives them cannot report two. Android confirms the gesture directly —…", "gold": false}, {"id": "CHALLENGES#115", "heading": "115. A tap under the app's own overlay reported success", "path": "docs/CHALLENGES.md", "excerpt": "The pass-through and the plain view are identical in both trees — attribute for attribute on iOS, and by nothing but `drawing-order` on Android — yet one lets the tap through and the other eats it. So nothing in a tree says whether a cover takes touches, and a rule that refused whatever is drawn over the point would have refused the pass-through case, which works. And iOS's `visible` is visual, not touchable: it hides the pass-through target and shows the one whose center is covered. What each tree can say is…", "gold": false}, {"id": "CHALLENGES#86", "heading": "86. On Android 16 and later, one press-tap breaks injected touch for the whole device", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the gesture check on a Pixel 8 Pro (Android 17), where press-tap failed with UiAutomator2's \"Unable to perform W3C actions\" — and then so did everything after it, plain taps included, and `adb shell input tap` too. UiAutomator2 (10.6.6, the newest release) stamps each event with the down time of the finger that produced it (`startTimestamp + event.startDelta`, the chain's own `pointerDown`). Android's contract is one down time per gesture, the first finger's. Android 17 verifies injected input: it…", "gold": false}], "missed": true, "facts": ["No, Mobium refuses press-tap on iOS as unsupported.", "XCTest gives a finger that lands after a gesture has begun an instant touch at its target at the start, which an app can take as a tap."], "concern": ""}, {"id": "q037", "kind": "fact", "question": "Why does a second connection to webinspectord take ten seconds?", "gold": [{"id": "CHALLENGES#45", "heading": "45. The second connection to webinspectord waits ten seconds", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** listing WebView contexts twice in a row and timing it. The first connection to a simulator's Remote Web Inspector receives its first byte in **0.17s**. Every connection after it — same socket, same process, same everything — waits **10.2 seconds** before webinspectord says a single word. Measured repeatedly on an iPhone 17 Pro simulator, consistent to the tenth of a second, which is what made it obviously a timeout somewhere rather than load. Opening a connection per command would therefore have put…"}], "retrieved": [{"id": "CHALLENGES#45", "heading": "45. The second connection to webinspectord waits ten seconds", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** listing WebView contexts twice in a row and timing it. The first connection to a simulator's Remote Web Inspector receives its first byte in **0.17s**. Every connection after it — same socket, same process, same everything — waits **10.2 seconds** before webinspectord says a single word. Measured repeatedly on an iPhone 17 Pro simulator, consistent to the tenth of a second, which is what made it obviously a timeout somewhere rather than load. Opening a connection per command would therefore have put…", "gold": true}, {"id": "CHALLENGES#116", "heading": "116. After an accessibility setting changed, every WebView lookup took 25 seconds", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** testing MobiumApp's Motion Demo on the iPhone 15 Plus with Reduce Motion off and then on. The web page reported its tap arriving 78 seconds after it loaded. Timed step by step, `contexts` took 25.4s and an attach 50.5s — constant to a tenth of a second, which is a timeout firing, not a slow phone — and both were back to 0.4s once the daemon restarted. It was not Reduce Motion: the stall followed any real change to an accessibility setting, in either direction, and a trip to Settings that changed…", "gold": false}, {"id": "CHALLENGES#203", "heading": "203. A tab whose renderer had gone held a context switch for minutes", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** first on the Pixel 7 AVD on 2026-10-01, switching into a long-backgrounded Chrome tab, which hung until the client gave up; not reproduced on the Pixel 8 Pro, where a tab twenty minutes in the background attached in 0.45s. Reproduced on the emulator by killing a background tab's renderer, which is what Android does to a tab it unloads: the tab stays in the DevTools listing, the debugger's connection is accepted, and nothing ever answers. `app_context` took six minutes and the client's read timed out.…", "gold": false}, {"id": "CHALLENGES#46", "heading": "46. Everything in this protocol happens once per connection", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** holding the connection open, which fixed defect 45 and broke two other things immediately. Remote Web Inspector is a conversation, not a request-and-reply protocol, and three of its messages are announcements that are never repeated: - **The application list.** `_rpc_reportConnectedApplicationList:` arrives once, just after the announce. Re-announcing on a connection that has already done it produces nothing at all, so the second listing on a held connection came back empty. The application set is…", "gold": false}, {"id": "CHALLENGES#157", "heading": "157. An iOS background of a minute or more timed out", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/otp.sh`, sending MobiumApp away for 62 seconds to let its code expire, on the iPhone 17 Pro simulator. `app_background` takes up to 180 seconds, and on iOS it failed at any length past about one minute with \"context deadline exceeded\". WebDriverAgent's `deactivateApp` answers only once the app is back, and every request to it has a sixty-second client timeout. Android backgrounds by pressing Home and waiting on this side, so the same 62 seconds passed there, and nothing ever asked iOS…", "gold": false}], "missed": false, "facts": ["Every connection to webinspectord after the first waits about 10.2 seconds before receiving its first byte.", "Mobium avoids it by holding one connection for the life of the session."], "concern": "The passage measures the delay but never explains its cause in webinspectord; the facts state what happens and the workaround."}, {"id": "q038", "kind": "fact", "question": "Why does map refuse a tap inside Safari's page when the WebView element covers the whole window?", "gold": [{"id": "CHALLENGES#47", "heading": "47. Safari's WebView element is not the page's content area", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** comparing where mobium said a link was against where the native hierarchy said it was. The page put \"Learn more\" at CSS y=254; the native tree had it at device y=948; mobium computed **762** — 186 device pixels too high. Enough to hit a different link, not enough to look wrong in a screenshot. `XCUIElementTypeWebView` in mobile Safari covers the **entire window, chrome included**: 874 CSS points tall against a 714-point viewport. The 160-point difference is the top and bottom chrome, and the split…"}], "retrieved": [{"id": "CHALLENGES#248", "heading": "248. A WebView taller than its page refused every tap — Kiwix's, and Safari's", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first tap inside Kiwix's WebView: \"the WebView element is 874 CSS pixels tall but the page's viewport is 758 … Taps are refused\". That refusal was written for mobile Safari (47), whose chrome sits over a full-screen WebView, and it said an app's own WKWebView was unaffected; Kiwix's runs the full height of the screen under iOS 26's bars, its page starting below the navigation bar, so no tap into a ZIM page was possible. The native tree knew where the page was all along: WebKit publishes each run…", "gold": false}, {"id": "CHALLENGES#118", "heading": "118. A tap inside a WebView was never checked, and went wherever the page put it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Actionability page, the Obstruction Demo's web counterpart, built once native actions had learned to wait and to refuse. In a WebView none of that applied: a tap resolved its ref to the element's rectangle and touched the center. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" nine times out of nine: | Target | What the tap reached | | --- | --- | | sliding in over two seconds | the target, 0.6s in, while it moved | | disabled | nothing | | disabled for two…", "gold": false}, {"id": "CHALLENGES#230", "heading": "230. With the iOS keyboard up, every action in a WebView was refused", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** typing into MobiumApp's cross-origin frame field on the iPhone simulator (CHALLENGES 229), and then on its Web form, which has no frames: once a tap on a web field raised the keyboard, a `type` or a `tap` in the same WebView was refused — \"the WebView element is 584 CSS pixels tall but the page's viewport is 571, so the page does not fill its host\". That check was written for mobile Safari, whose chrome sits over a full-screen WebView (CHALLENGES 47). The keyboard changes the page's viewport and not…", "gold": false}, {"id": "CHALLENGES#47", "heading": "47. Safari's WebView element is not the page's content area", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** comparing where mobium said a link was against where the native hierarchy said it was. The page put \"Learn more\" at CSS y=254; the native tree had it at device y=948; mobium computed **762** — 186 device pixels too high. Enough to hit a different link, not enough to look wrong in a screenshot. `XCUIElementTypeWebView` in mobile Safari covers the **entire window, chrome included**: 874 CSS points tall against a 714-point viewport. The 160-point difference is the top and bottom chrome, and the split…", "gold": true}, {"id": "skills/mobile-check/SKILL.md#hybrid-apps-webviews", "heading": "Hybrid apps (WebViews)", "path": "skills/mobile-check/SKILL.md", "excerpt": "Web content inside an app is a separate context: ```sh mobium contexts # NATIVE_APP, WEBVIEW_com.example mobium context WEBVIEW_com.example # map and tap now work on the page mobium context NATIVE_APP # back to the native shell ``` This works on **both platforms**. Android WebViews must be debuggable (`setWebContentsDebuggingEnabled(true)`) and iOS WKWebViews must be inspectable (`webView.isInspectable = true` on iOS 16.4+). If a WebView does not appear in `contexts`, that is a property of the app — do not keep…", "gold": false}], "missed": false, "facts": ["Safari's WebView element covers the whole window including the browser chrome, and the page cannot see its own inset.", "So the content area's rectangles are unknowable, and Mobium refuses rather than approximating coordinates.", "map and text still work, with a footnote, because refs, labels and roles are correct."], "concern": "The question says map refuses the tap; per the passage the frame check refuses actions while map itself still works."}, {"id": "q039", "kind": "fact", "question": "The emulator fails with 'Cannot find valid sdk root path' although adb works fine. What is wrong?", "gold": [{"id": "docs/SETUP.md#two-traps-neither-of-which-names-its-own-cause", "heading": "Two traps, neither of which names its own cause", "path": "docs/SETUP.md", "excerpt": "- **`platform-tools` must be installed *into the SDK root* by `sdkmanager`**, not only as the `android-platform-tools` Homebrew cask. The emulator validates the SDK root by looking for that directory and aborts with `Broken AVD system path` / `Cannot find valid sdk root path` — while `adb` sits on your `PATH` working perfectly, which sends you looking in entirely the wrong place. `mobium doctor` checks this specifically. - **`avdmanager` prints `Could not load devices from .../devices.xml`.** Harmless. The device…"}], "retrieved": [{"id": "docs/SETUP.md#two-traps-neither-of-which-names-its-own-cause", "heading": "Two traps, neither of which names its own cause", "path": "docs/SETUP.md", "excerpt": "- **`platform-tools` must be installed *into the SDK root* by `sdkmanager`**, not only as the `android-platform-tools` Homebrew cask. The emulator validates the SDK root by looking for that directory and aborts with `Broken AVD system path` / `Cannot find valid sdk root path` — while `adb` sits on your `PATH` working perfectly, which sends you looking in entirely the wrong place. `mobium doctor` checks this specifically. - **`avdmanager` prints `Could not load devices from .../devices.xml`.** Harmless. The device…", "gold": true}, {"id": "CHALLENGES#environment-traps", "heading": "Environment traps", "path": "docs/CHALLENGES.md", "excerpt": "None of these is a Mobium defect; each cost real time and no error named its cause. - **`platform-tools` must be installed into the SDK root** with `sdkmanager`, not only as the Homebrew cask. The emulator validates the SDK root by looking for that directory and dies with `Broken AVD system path` — while `adb` is on `PATH` and working perfectly, which sends you looking in entirely the wrong place. - **`avdmanager` prints `Could not load devices from .../devices.xml`** while creating an AVD. Harmless; the device…", "gold": false}, {"id": "docs/SETUP.md#setting-up-devices", "heading": "Setting up devices", "path": "docs/SETUP.md", "excerpt": "Everything Mobium needs on the machine and on the device, for all four kinds of target. Written from doing it: every trap below cost real time here, and most of them report something that names the wrong cause. **Run `mobium doctor` first.** It ators and adb?", "gold": [{"id": "docs/SHUTDOWN.md#the-order", "heading": "The order", "path": "docs/SHUTDOWN.md", "excerpt": "**Daemon → simulators → emulators → adb.** Not arbitrary."}], "retrieved": [{"id": "docs/SHUTDOWN.md#2-simulators-then-emulators", "heading": "2. Simulators, then emulators", "path": "docs/SHUTDOWN.md", "excerpt": "```sh xcrun simctl shutdown <udid> # or `all` adb -s emulator-5554 emu kill ``` `mobium shutdown <serial | avd | udid | simulator>` does this for one device in the same order — its session ended, then the device — and returns once the device is gone. It ends only its own daemon's session and does not check for other daemons on the device, so stop those first (`MOBIUM_SESSION=<name> mobium daemon stop` for each). A **headless** emulator (`-no-window`) is stopped exactly the same way, and this is where the check…", "gold": false}, {"id": "docs/SHUTDOWN.md#the-order", "heading": "The order", "path": "docs/SHUTDOWN.md", "excerpt": "**Daemon → simulators → emulators → adb.** Not arbitrary.", "gold": true}, {"id": "CHALLENGES#255", "heading": "255. `clean-stop.sh --quit` reported a daemon it had asked to stop, and went on", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** stopping everything after an evening on an iPhone: the script said the daemon had stopped, shut the simulator and the emulator down, and then reported the daemon and the iPhone's WebDriverAgent runner still running. A `daemon stop` by hand moments later stopped both. Three faults, any one enough. The script ran `./bin/mobium` — from the directory it was run in, not its own repository, so run from another checkout it used that checkout's build, whose stop gave up after 5 seconds where today's waits…", "gold": false}, {"id": "docs/SHUTDOWN.md#1-mobium-daemon-stop-always-first", "heading": "1. `mobium daemon stop`, always first", "path": "docs/SHUTDOWN.md", "excerpt": "The daemon owns the device-side sessions: a UiAutomator2 server running as instrumentation on Android, a WebDriverAgent process on an iOS simulator. Stopping it tells both to shut down. On an iOS simulator the next session starts on the home screen, whatever app was in front: WebDriverAgent's runner takes the foreground as it launches and leaves it to the home screen. The first command says so and names `app_launch` to bring the app back (CHALLENGES 250). Kill the *device* first and neither gets that message. On…", "gold": false}, {"id": "docs/SHUTDOWN.md#after-a-crash", "heading": "After a crash", "path": "docs/SHUTDOWN.md", "excerpt": "A daemon killed without tearing down — `kill -9`, a crash, a second Ctrl-C — leaves the device-side server running. The next session clears what it can find: on a simulator it stops the leftover WebDriverAgent before starting its own (defect 131), and on Android it force-stops a leftover UiAutomator2 server and removes its adb forward (defect 132), and on a real iPhone it takes over the `xcodebuild` runner a dead daemon left, so its own end stops it (defect 135). A runner started from Xcode is not taken over, and…", "gold": false}], "missed": false, "facts": ["Stop the daemon first, then simulators, then emulators, then adb."], "concern": ""}, {"id": "q041", "kind": "fact", "question": "Can Mobium drive iOS from a Windows machine?", "gold": [{"id": "docs/WINDOWS.md#android-only-ios-is-not-possible-on-windows", "heading": "Android only. iOS is not possible on Windows.", "path": "docs/WINDOWS.md", "excerpt": "Said here rather than in a footnote, because it is the first question anyone asks and the answer is structural rather than a gap in the work. Mobium drives iOS through `xcrun simctl` — 41 call sites in `internal/device` alone — and through WebDriverAgent, which it installs as the prebuilt `WebDriverAgentRunner-Build-Sim-arm64.zip`. `simctl` ships inside Xcode and Xcode is macOS-only; the artifact is a *simulator* build for Apple Silicon, and a simulator is a macOS process. There is no configuration, no port and no…"}], "retrieved": [{"id": "docs/WINDOWS.md#android-only-ios-is-not-possible-on-windows", "heading": "Android only. iOS is not possible on Windows.", "path": "docs/WINDOWS.md", "excerpt": "Said here rather than in a footnote, because it is the first question anyone asks and the answer is structural rather than a gap in the work. Mobium drives iOS through `xcrun simctl` — 41 call sites in `internal/device` alone — and through WebDriverAgent, which it installs as the prebuilt `WebDriverAgentRunner-Build-Sim-arm64.zip`. `simctl` ships inside Xcode and Xcode is macOS-only; the artifact is a *simulator* build for Apple Silicon, and a simulator is a macOS process. There is no configuration, no port and no…", "gold": true}, {"id": "examples/drivers/README.md#writing-a-mobium-driver", "heading": "Writing a Mobium driver", "path": "examples/drivers/README.md", "excerpt": "Mobium drives Android and iOS out of the box. Anything else — a Roku, a Flutter desktop app, a set-top box, a car head unit, a platform that does not exist yet — is a **driver**: a program Mobium starts and talks to over a pipe. You do not need to fork Mobium, build Mobium, or write Go. A driver is an executable in any language that reads JSON-RPC on stdin and writes it on stdout. The protocol is specified in [PROTOCOL.md](PROTOCOL.md); this page is the short version. Everything above the driver — locators,…", "gold": false}, {"id": "docs/SETUP.md#driving-another-machines-devices", "heading": "Driving another machine's devices", "path": "docs/SETUP.md", "excerpt": "**`--remote <node>`, or `MOBIUM_REMOTE=<node>`, drives the devices plugged into another machine**, over SSH. Every command takes it, and so does `mobium pipe`, which is how all five clients connect — so a client goes remote with the environment variable alone, and no change to its code. What happens: mobium asks the node, over SSH, to have a daemon running and say where it listens (`mobium daemon up`); forwards that socket to one in a private directory here o) or the command-line tools, then create a virtual device (Device Manager in Android Studio, or `avdmanager`) and boot it by name: ```sh mobium boot <avd> ``` It finds the SDK's `emulator` itself, through `ANDROID_HOME` or the SDK's usual place, and answers once Android has finished booting — not merely once `adb` can see it. Add `--window` to watch it; it runs headless otherwise. `adb` comes with the SDK's platform-tools; put it on your `PATH`. On Linux…", "gold": false}], "missed": false, "facts": ["Start the second emulator on its own port, for example with -port 5556.", "Then pass --device emulator-5556 to every command, run each under its own MOBIUM_SESSION, or give a client the device option."], "concern": ""}, {"id": "q044", "kind": "fact", "question": "Can Mobium drive a Flutter app?", "gold": [{"id": "docs/APP-TYPES.md#cross-platform-or-native-once-removed", "heading": "Cross-platform, or native-once-removed", "path": "docs/APP-TYPES.md", "excerpt": "This is where the taxonomy needs splitting for an automation tool, and the article groups together two things that behave oppositely. Its claim is that these frameworks embed web technologies inside a native app and \"trigger the creation and modification of purely native components\", so the end result is a completely native app. **That is true of React Native and Xamarin. It is not true of Flutter**, and the difference decides whether a tool like this one can see anything at all. **React Native produces real…"}], "retrieved": [{"id": "examples/drivers/README.md#writing-a-mobium-driver", "heading": "Writing a Mobium driver", "path": "examples/drivers/README.md", "excerpt": "Mobium drives Android and iOS out of the box. Anything else — a Roku, a Flutter desktop app, a set-top box, a car head unit, a platform that does not exist yet — is a **driver**: a program Mobium starts and talks to over a pipe. You do not need to fork Mobium, build Mobium, or write Go. A driver is an executable in any language that reads JSON-RPC on stdin and writes it on stdout. The protocol is specified in [PROTOCOL.md](PROTOCOL.md); this page is the short version. Everything above the driver — locators,…", "gold": false}, {"id": "docs/APP-TYPES.md#what-has-been-driven", "heading": "What has been driven", "path": "docs/APP-TYPES.md", "excerpt": "| | Flutter: MobiumApp's `flutter/` demo, on the Pixel 7 AVD, the iPhone 17 Pro simulator, the Pixel 8 Pro and the iPhone 15 Plus | checked in — `flutter.sh`: driven through the semantics tree Flutter publishes, with no driver ([below](#cross-platform-or-native-once-removed)) | | | Xamarin/.NET MAUI | **never driven** | | Hybrid frameworks | Cordova, Ionic | **never driven**; a WebView inside them is the hybrid case above | | App Clip (iOS) | MobiumApp's clip demo on the iPhone 17 Pro simulator; AdvantageScope…", "gold": false}, {"id": "docs/APP-TYPES.md#cross-platform-or-native-once-removed", "heading": "Cross-platform, or native-once-removed", "path": "docs/APP-TYPES.md", "excerpt": "This is where the taxonomy needs splitting for an automation tool, and the article groups together two things that behave oppositely. Its claim is that these frameworks embed web technologies inside a native app and \"trigger the creation and modification of purely native components\", so the end result is a completely native app. **That is true of React Native and Xamarin. It is not true of Flutter**, and the difference decides whether a tool like this one can see anything at all. **React Native produces real…", "gold": true}, {"id": "README.md#app-types", "heading": "App types", "path": "README.md", "excerpt": "What an app is built with decides where its elements are, so it decides what Mobium reaches. Each type has been driven on a device: | Type | How Mobium reaches it | Driven here | | --- | --- | --- | | **Native** — Android SDK, Jetpack Compose, UIKit, SwiftUI | the platform's accessibility tree | Settings, Calculator, Clock, Wikipedia, F-Droid, Aegis, Seal (Compose), back chevron, or ask for the swipe with `press back --gesture`, which starts in the navigation bar because a list row's swipe actions would take it anywhere else. An app with no navigation stack has no swipe back at all. - **On Android `--gesture` is refused with three-button navigation** — an edge swipe is not back there. `mobium devices` names the mode. - **Calls and messages are emulator-only.** A real phone cannot be made to ring from…", "gold": false}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "on all three Android devices (mobium-app #12). Done the same day for Mobium: `press back` says what back did, `--gesture` swipes back and is refused with button navigation, `devices` names the mode, the iOS refusal names the gesture, and `docs/checks/back.sh` holds it on both phones, both AVDs and the simulator. Predictive back measured 2026-10-02: with it turned on, React Native 0.86 keeps `BackHandler` on Android 16 and later and loses it on 15 and earlier, where every back closed MobiumApp — and Mobium's `press…", "gold": false}, {"id": "CHALLENGES#204", "heading": "204. Back said \"pressed back\" whether it went back or closed the app", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Lana, on the Pixel 8 Pro: in MobiumApp a swipe back from any demo closed the app. Measuring it on five devices (docs/BACK.md) showed the app was at fault — it handled no back — and that Mobium would never have said so: `press back` answered \"pressed back\" whether the app went to its home screen or closed, its result claimed nothing, and a test using it saw the same answer for the bug and for the fix. Back was reported as \"sent\" on the reasoning that what it does is the app's business — true, and the…", "gold": false}], "missed": true, "facts": ["No, Mobium refuses press back on iOS by design, because iOS has no system back event.", "Going back on iOS is the app's: tap the navigation bar's back button, or swipe right, for example from the navigation bar."], "concern": ""}, {"id": "q046", "kind": "multi", "question": "What do alert accept and dismiss press on Android and on iOS, and why can't they be read as positional?", "gold": [{"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…"}, {"id": "CHALLENGES#106", "heading": "106. `accept` and `dismiss` are not positional either", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Dialog Demo, which raises one-, two- and three-button alerts, an action sheet and permission prompts, and reports which button the app received. CHALLENGES 63 replaced \"accept presses the affirmative button\" with \"accept presses the last button and dismiss the first\", and the project's rules stated it as measured on both platforms. It was measured on two-button alerts, where position, role and meaning all agree, and so it could not have failed. With more buttons: | Dialog | `dismiss`…"}], "retrieved": [{"id": "CHALLENGES#106", "heading": "106. `accept` and `dismiss` are not positional either", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Dialog Demo, which raises one-, two- and three-button alerts, an action sheet and permission prompts, and reports which button the app received. CHALLENGES 63 replaced \"accept presses the affirmative button\" with \"accept presses the last button and dismiss the first\", and the project's rules stated it as measured on both platforms. It was measured on two-button alerts, where position, role and meaning all agree, and so it could not have failed. With more buttons: | Dialog | `dismiss`…", "gold": true}, {"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…", "gold": true}, {"id": "docs/checks/README.md#results", "heading": "Results", "path": "docs/checks/README.md", "excerpt": "**Two kinds of dialog are driven, and they are not the same problem.** The Interruption section raises a *system* permission prompt — another process's window, which `app_current` reports while it is up. The Dialog Demo section raises the app's **own** alerts (the App Alert Demo's, until they were merged into it on 2026-09-26), and is what measured CHALLENGES 63: on an ordinary two-button alert `accept` and `dismiss` read as confirm and cancel, and on Apple's permission prompt they invert. Which button each…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#dialogs", "heading": "Dialogs", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `mobium alert` — is a system or app dialog up, and what does it say - `mobium alert accept` / `dismiss` — answer it. **These do not choose an outcome**: which button each presses depends on the platform and the dialog (on a three-button iOS alert, `accept` pressed Cancel). To choose, tap the button by its caption: `mobium tap \"text=Allow,role=button\"` (iOS captions are labels: `label=Allow`). - `mobium dialogs --when \"Save Password\" --press \"Not Now\"` — declare an answer for a dialog that turns up on its own…", "gold": false}], "missed": false, "facts": ["Android's accept and dismiss press the dialog's positive and negative buttons, whatever their position.", "iOS presses an alert's last button for accept and first for dismiss, but an action sheet's first and last.", "So neither verb is positional across dialogs; they answer a dialog and choose nothing, and an outcome is chosen by tapping the button."], "concern": ""}, {"id": "q047", "kind": "multi", "question": "How did refusals from the native context change for a checkbox and for a read-only field inside a WebView?", "gold": [{"id": "CHALLENGES#299", "heading": "299. A web checkbox, sent between contexts by two refusals", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** an agent, the first time one was graded on it: Opus 5.5 driving MobiumApp's Web form through `mobium mcp` on the Android 15 emulator, in an evaluation harness that grades what the app says rather than what the agent claims (2026-10-11). Asked to tick the form's checkbox, it called `app_check` from the native context on `text=A checkbox`, and again on its ref `@e9` after mapping, and was told both times that it `is not a checkbox, radio or switch, so it has no checked state to set — app_tap is what…"}, {"id": "CHALLENGES#300", "heading": "300. A read-only web field, typed into from the native context, was \"disabled\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run. Asked to type into the Web form's read-only field — a refusal task: the right answer is that it cannot be done — the agent called `app_type` on its ref `@e5` from the native context, and was told `text=fixed failed check enabled: it is disabled, and stayed disabled for 2s — a disabled control ignores input; do what enables it, or wait for it with app_wait_for and condition \"enabled\"`. The field is not disabled: it has the `readonly` attribute, and nothing enables it, so both remedies…"}], "retrieved": [{"id": "CHALLENGES#300", "heading": "300. A read-only web field, typed into from the native context, was \"disabled\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run. Asked to type into the Web form's read-only field — a refusal task: the right answer is that it cannot be done — the agent called `app_type` on its ref `@e5` from the native context, and was told `text=fixed failed check enabled: it is disabled, and stayed disabled for 2s — a disabled control ignores input; do what enables it, or wait for it with app_wait_for and condition \"enabled\"`. The field is not disabled: it has the `readonly` attribute, and nothing enables it, so both remedies…", "gold": true}, {"id": "CHALLENGES#299", "heading": "299. A web checkbox, sent between contexts by two refusals", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** an agent, the first time one was graded on it: Opus 5.5 driving MobiumApp's Web form through `mobium mcp` on the Android 15 emulator, in an evaluation harness that grades what the app says rather than what the agent claims (2026-10-11). Asked to tick the form's checkbox, it called `app_check` from the native context on `text=A checkbox`, and again on its ref `@e9` after mapping, and was told both times that it `is not a checkbox, radio or switch, so it has no checked state to set — app_tap is what…", "gold": true}, {"id": "CHALLENGES#301", "heading": "301. A read-only web field took text typed from the native context", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** verifying 300 on the Android 17 emulator. The native tree there reads the Web form's read-only field as enabled, not disabled as on Android 15, and `type @e5 x` from the native context answered `typed \"x\" into @e5` — and the page agreed: the field held `fixedx`, and counted two input events. A person cannot do that: tapping a read-only field raises no keyboard. The native type presumably sets the text through accessibility, and the WebView applies it whatever the attribute says — not measured. From…", "gold": false}, {"id": "CHALLENGES#158", "heading": "158. One check, two spellings, and a different sentence for every refusal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading the code, while giving native refusals the WebView's shape — not on a device. A client that wanted to know why an action was refused had nothing stable to read. A WebView's refusal said \"X failed check receivesEvents: …\" and put the check in `details.check`; the same refusal on a native screen, a control drawn over the target, said \"X is covered by …\" and put `receives_events` in `details.check`. Of the other native refusals, two set a check and five set none, and each had its own sentence.…", "gold": false}, {"id": "CHALLENGES#119", "heading": "119. Typing into a WebView blamed the map, and a checkbox was named \"on\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Web form page, built to measure typing into a page once taps there were checked (118). `type` had no WebView path: it looked a web ref up in the native table, found it empty, and answered \"unknown ref @e1 — the last map found no elements\" for a field the page's map had just listed. Following that advice — map again — could never help. Nothing ever reached the page, on an emulator or a simulator. `type` inside a WebView is now Vibium's fill. The page is asked whether the field can take…", "gold": false}], "missed": false, "facts": ["A WebView page node with no checked state is no longer called not a checkbox; the refusal says it is part of a page and names switching to its context.", "A WebView page node that reads as disabled is refused saying a read-only field reads the same as a disabled one, naming the WebView's context, never a wait."], "concern": ""}, {"id": "q048", "kind": "multi", "question": "Why did agents that swiped and mapped stop at row 20 of a 60-row feed when scroll-to does not?", "gold": [{"id": "CHALLENGES#223", "heading": "223. A list loading its next page was taken for the end of the list", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Feed Demo, a list that loads twenty more rows 2.5 seconds after its end is reached, built for this because Ice Cubes' timeline never showed it: 60 swipes over four minutes, and its pages always arrived before the next swipe. iOS cannot slow a network from outside. On the Feed Demo, `scroll-to label=Row 55` answered \"the end of the list (3 scrolls)\" and the app then held 40 rows. The loop's one test for the end was a swipe that moved nothing, and the swipe that reaches a page's end moves…"}, {"id": "CHALLENGES#303", "heading": "303. A list still loading looked ended, and map's notes never reached the agent", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same baseline. Asked how many rows the Feed Demo holds, agents that swiped and mapped stopped at row 20 while the next page loaded, and answered 20 — two runs of three for Sonnet 5.5, one of Haiku 5.5's. `app_scroll_to` waits a list's busy indicator out (223), but `map` said nothing of one. And reading the transcripts for that showed a wider gap: Claude Code hands its model a tool's structured answer and not its text, so everything Mobium says only in the text — map's notes on a popover, a screen…"}], "retrieved": [{"id": "CHALLENGES#303", "heading": "303. A list still loading looked ended, and map's notes never reached the agent", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same baseline. Asked how many rows the Feed Demo holds, agents that swiped and mapped stopped at row 20 while the next page loaded, and answered 20 — two runs of three for Sonnet 5.5, one of Haiku 5.5's. `app_scroll_to` waits a list's busy indicator out (223), but `map` said nothing of one. And reading the transcripts for that showed a wider gap: Claude Code hands its model a tool's structured answer and not its text, so everything Mobium says only in the text — map's notes on a popover, a screen…", "gold": true}, {"id": "CHALLENGES#223", "heading": "223. A list loading its next page was taken for the end of the list", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Feed Demo, a list that loads twenty more rows 2.5 seconds after its end is reached, built for this because Ice Cubes' timeline never showed it: 60 swipes over four minutes, and its pages always arrived before the next swipe. iOS cannot slow a network from outside. On the Feed Demo, `scroll-to label=Row 55` answered \"the end of the list (3 scrolls)\" and the app then held 40 rows. The loop's one test for the end was a swipe that moved nothing, and the swipe that reaches a page's end moves…", "gold": true}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [feed.sh](feed.sh) | **A list that grows as it is scrolled**, on MobiumApp's Feed Demo: twenty rows a page, the next 2.5 seconds after the end is reached, three pages in all. `scroll-to` reaches Row 55 across two loads instead of stopping at the first page's end, says Row 70 is past the real end at once, and an unknown role is refused rather than waited on (CHALLENGES 222, 223). Passed on the simulator, the iPhone and the Pixel 8 Pro | | [slider.sh](slider.sh) | **Sliders on Android**, on MobiumApp's Slider…", "gold": false}, {"id": "CHALLENGES#258", "heading": "258. A screen with a long list could not be read at all", "path": "docs/CHALLENGES.md", "excerpt": "The first version stopped there, and a tap on \"Search episodes\", under the tab bar, swiped the episode list to its end — 34 swipes over two tries, 2007 on screen — because the scroll that brings a target into view steers by where the target is reported, and off such a screen that is nowhere it is. So on a screen read this way a locator matches only what is shown, and an action never scrolls by itself: it is refused, naming `app_swipe` and `app_scroll_to`. On the iPhone that tap was refused in five seconds with the…", "gold": false}, {"id": "CHALLENGES#261", "heading": "261. A carousel row was scrolled for the wrong way, and then a ref found another row", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring long lists on the simulator. Pocket Casts' Discover has a carousel of rows in columns inside a vertical page; Freakonomics Radio sat in the second column, a four-point sliver at the right edge, in view top to bottom. A tap on it swiped the page down and was refused as \"on the screen but never scrolled fully into view\". An action that has to scroll asks for \"down\", since nothing told it a direction, and the measured nudge that finishes a near miss (114) travelled the axis it was asked for.…", "gold": false}], "missed": false, "facts": ["While the next page loaded, the list stopped at row 20 and map said nothing about a busy indicator, so agents answered 20.", "scroll-to waits out a busy indicator inside the list before calling the end.", "map now notes a list still loading after its last row, and its notes are in the structured answer as notes."], "concern": ""}, {"id": "q049", "kind": "multi", "question": "How is a slider filled on iOS compared with an Android seek bar?", "gold": [{"id": "CHALLENGES#219", "heading": "219. A slider printed as `100% (button)`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Ice Cubes' Display Settings, looking for a slider to measure. Its Font Scaling and Line Spacing sliders mapped as `100% (button)` and `1.2 (button)`: no role named a slider, and a slider has no label of its own, so its value was taken for its text, as a switch's 0 or 1 was before CHALLENGES 65. And no tool moved one; the phone's text size was refused for that reason. A slider now maps as `Slider (slider, 100%)`, its value kept as its state and sent as `value` on every client's element, and `map…"}, {"id": "CHALLENGES#227", "heading": "227. A seek bar was missing from `map`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Slider Demo on the Pixel 8 Pro, built because nothing installed had a slider that belonged to no one. `map` listed only Back. Android marks a seek bar neither clickable nor scrollable, so it was not a target; and its text is its progress in its own units — \"5.0\" for a Volume the app held at 50 — which would have been its label. A slider is now a target on Android too, and its text is its value: `Volume (slider, 5.0)`. Moving one was measured three ways. UiAutomator2's set-value sets…"}], "retrieved": [{"id": "CHALLENGES#227", "heading": "227. A seek bar was missing from `map`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Slider Demo on the Pixel 8 Pro, built because nothing installed had a slider that belonged to no one. `map` listed only Back. Android marks a seek bar neither clickable nor scrollable, so it was not a target; and its text is its progress in its own units — \"5.0\" for a Volume the app held at 50 — which would have been its label. A slider is now a target on Android too, and its text is its value: `Volume (slider, 5.0)`. Moving one was measured three ways. UiAutomator2's set-value sets…", "gold": true}, {"id": "CHALLENGES#302", "heading": "302. A seek bar's reading, in its own steps, read as the slider's range", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the evaluation's baseline (2026-10-11): three models, 23 tasks, three repeats each, driving MobiumApp through `mobium mcp` on the Android 15 emulator. Asked to set the Slider Demo's volume to 20, Sonnet 5.5 filled the Volume slider to 0.2 — right — and was answered `\"value\":\"2.0\"`. It concluded the slider ran to 10, filled 1, read `\"10.0\"`, and reported that 20 was out of range; Haiku 5.5 did the same twice. The reading is the seek bar's progress in its own steps, which 227 found and kept —…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "client's element, `map --diff` reports a value that moved, and `app_fill` takes its position from 0 to 1 and reports what the app then reads. WebDriverAgent moves the thumb as a finger would: from either end it lands exactly, from partway it lands a step past, so landing exactly means filling 0 or 1 first, which is the caller's choice — the app sees the end it passes through. Measured on Ice Cubes' Font Scaling on the simulator and the iPhone, held by `icecubes-ios.sh`, which puts the slider back to what it read.…", "gold": false}, {"id": "CHALLENGES#232", "heading": "232. type and fill told an agent they needed Android's driver", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading the tool descriptions while writing the docs site's slider example. `app_type` and `app_fill` said \"Requires the uiautomator2 driver\", and the CLI's `type` and `fill` help \"Needs the uiautomator2 backend\". Both have worked on iOS through WebDriverAgent since the iOS backend arrived — text, and since #112 sliders — so an agent reading the schema on an iPhone was told not to use the tools that would work. What is refused is one driver: Android's `uiautomator` dump driver, which declines text…", "gold": false}, {"id": "CHALLENGES#219", "heading": "219. A slider printed as `100% (button)`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Ice Cubes' Display Settings, looking for a slider to measure. Its Font Scaling and Line Spacing sliders mapped as `100% (button)` and `1.2 (button)`: no role named a slider, and a slider has no label of its own, so its value was taken for its text, as a switch's 0 or 1 was before CHALLENGES 65. And no tool moved one; the phone's text size was refused for that reason. A slider now maps as `Slider (slider, 100%)`, its value kept as its state and sent as `value` on every client's element, and `map…", "gold": true}], "missed": false, "facts": ["On iOS, app_fill sets a 0-to-1 position through WebDriverAgent, which lands exactly from either end and a step past from partway.", "On Android, app_fill touches the seek bar's track at the position, inset 16dp from its edges, which lands exactly."], "concern": ""}, {"id": "q050", "kind": "multi", "question": "Why does iOS lose characters when typing, and what happened with a password on a real iPhone?", "gold": [{"id": "CHALLENGES#61", "heading": "61. iOS dropped a keystroke and `type` reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with two text fields and typing into both, one after the other. `lose-999` arrived as `lse-999`. Reproduced deliberately rather than shrugged at: five runs of type-then-type, **four of them dropped exactly one character**, always from the middle of the string — `keep-1` as `kep-1`, `lose-5` as `lse-5`. The same strings typed in isolation, with a pause between them, were correct five times out of five. So it is a race with the focus change and not anything about the text. Measured on…"}, {"id": "CHALLENGES#159", "heading": "159. A password typed on a real iPhone lost every letter, and was reported typed", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/autowait.sh` on the iPhone 15 Plus, iOS 26.6.2, failing to see Log In disabled — because the app had refused to sign in with a password of one character. Typing the ten-character \"wrongpass1\" into MobiumApp's password field left one character, three runs in three, and `type` reported ten; the simulator kept all ten. The phone's keyboard was Russian. On a real iPhone a password field is typed key by key on the keyboard that is up, and a letter it has no key for is dropped: the one…"}], "retrieved": [{"id": "CHALLENGES#159", "heading": "159. A password typed on a real iPhone lost every letter, and was reported typed", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/autowait.sh` on the iPhone 15 Plus, iOS 26.6.2, failing to see Log In disabled — because the app had refused to sign in with a password of one character. Typing the ten-character \"wrongpass1\" into MobiumApp's password field left one character, three runs in three, and `type` reported ten; the simulator kept all ten. The phone's keyboard was Russian. On a real iPhone a password field is typed key by key on the keyboard that is up, and a letter it has no key for is dropped: the one…", "gold": true}, {"id": "CHALLENGES#156", "heading": "156. Typing into a field that moves focus on was misread as dropped keystrokes", "path": "docs/CHALLENGES.md", "excerpt": "Since 2026-09-30 a lost character is typed again rather than only named. Typed whole, the code lost a digit at a focus change in 2 runs of 10 on the simulator, and in none of 10 on the iPhone, which types at half the speed. Typing into each box in turn cannot race the focus change, since each keystroke goes to the element it names. So on a loss the boxes are cleared, last first, each is given its character and read back, and the row must then hold the code in order. A box that still takes nothing is named as…", "gold": false}, {"id": "CHALLENGES#103", "heading": "103. Typing into a password field on iOS appended to it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the login demo, where a wrong password followed by the right one never logged in. The field held 17 characters after \"wrongpass1\" and then \"hunter2\", while `type` reported typing seven. WebDriverAgent types through the keyboard, so setting a value appends. An ordinary field was right anyway, because `SetText` reads it back, sees the mismatch, clears and retries. A password field was exempt from the read-back — it reads as bullets and could only ever disagree (defect 61's rule) — so nothing noticed;…", "gold": false}, {"id": "CHALLENGES#61", "heading": "61. iOS dropped a keystroke and `type` reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with two text fields and typing into both, one after the other. `lose-999` arrived as `lse-999`. Reproduced deliberately rather than shrugged at: five runs of type-then-type, **four of them dropped exactly one character**, always from the middle of the string — `keep-1` as `kep-1`, `lose-5` as `lse-5`. The same strings typed in isolation, with a pause between them, were correct five times out of five. So it is a race with the focus change and not anything about the text. Measured on…", "gold": true}], "missed": false, "facts": ["XCUITest types through the keyboard, and a keystroke sent while focus is still moving lands nowhere; Mobium now reads the value back and retries.", "On a real iPhone a password is typed key by key on the keyboard that is up, so a Russian keyboard dropped every Latin letter.", "Mobium now confirms a password's length and reports not_confirmed, naming the missing keys, without printing the password."], "concern": ""}, {"id": "q051", "kind": "multi", "question": "What happens when the target is under the keyboard, natively and inside an Android WebView?", "gold": [{"id": "CHALLENGES#107", "heading": "107. A tap on a button under the keyboard reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the iOS login demo, where Log In sat under the keyboard; the app's layout was fixed then, and the Dialog Demo's pinned button is the case kept on purpose. The keyboard is the dialog case one layer over, in the same two shapes. On iOS the keyboard is an `XCUIElementTypeKeyboard` in the app's tree, and what it covers stays there, marked not visible — the field being typed into included — so a locator resolved the button and the tap landed on a key. A target whose center the visible keyboard covers is…"}, {"id": "CHALLENGES#294", "heading": "294. Android's keyboard over an app's WebView refused every tap", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run: `web-type.sh` failed on the Pixel at \"a tap with the keyboard up was refused\" — \"the WebView element is 770 CSS pixels tall but the page's viewport is 401\". It is 230 on Android: the keyboard shrinks the page's viewport and not the WebView, and the height check written for Safari's chrome (47) refused. iOS's answer asked the keyboard node in the app's tree, and Android's keyboard is another window, never there; the emulator's keyboard, a floating toolbar, shrinks nothing, so every run…"}], "retrieved": [{"id": "skills/mobile-check/SKILL.md#hybrid-apps-webviews", "heading": "Hybrid apps (WebViews)", "path": "skills/mobile-check/SKILL.md", "excerpt": "Web content inside an app is a separate context: ```sh mobium contexts # NATIVE_APP, WEBVIEW_com.example mobium context WEBVIEW_com.example # map and tap now work on the page mobium context NATIVE_APP # back to the native shell ``` This works on **both platforms**. Android WebViews must be debuggable (`setWebContentsDebuggingEnabled(true)`) and iOS WKWebViews must be inspectable (`webView.isInspectable = true` on iOS 16.4+). If a WebView does not appear in `contexts`, that is a property of the app — do not keep…", "gold": false}, {"id": "CHALLENGES#118", "heading": "118. A tap inside a WebView was never checked, and went wherever the page put it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Actionability page, the Obstruction Demo's web counterpart, built once native actions had learned to wait and to refuse. In a WebView none of that applied: a tap resolved its ref to the element's rectangle and touched the center. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" nine times out of nine: | Target | What the tap reached | | --- | --- | | sliding in over two seconds | the target, 0.6s in, while it moved | | disabled | nothing | | disabled for two…", "gold": false}, {"id": "CHALLENGES#findings-that-were-not-defects", "heading": "Findings that were not defects", "path": "docs/CHALLENGES.md", "excerpt": "- **A tap on Log In above the keyboard reached the app, and the app moved the button.** On a headless Android emulator, with the soft keyboard up over MobiumApp's Login Demo, `tap testid=loginBtn` was reported as tapped and the login never ran, in some runs and not others. The layout differed between runs: when the password field's \"meets the requirements\" notice was not yet showing, it appeared on the field's blur — which the tap itself causes — and pushed Log In below the keyboard while the press was still down,…", "gold": false}, {"id": "CHALLENGES#301", "heading": "301. A read-only web field took text typed from the native context", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** verifying 300 on the Android 17 emulator. The native tree there reads the Web form's read-only field as enabled, not disabled as on Android 15, and `type @e5 x` from the native context answered `typed \"x\" into @e5` — and the page agreed: the field held `fixedx`, and counted two input events. A person cannot do that: tapping a read-only field raises no keyboard. The native type presumably sets the text through accessibility, and the WebView applies it whatever the attribute says — not measured. From…", "gold": false}, {"id": "CHALLENGES#294", "heading": "294. Android's keyboard over an app's WebView refused every tap", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run: `web-type.sh` failed on the Pixel at \"a tap with the keyboard up was refused\" — \"the WebView element is 770 CSS pixels tall but the page's viewport is 401\". It is 230 on Android: the keyboard shrinks the page's viewport and not the WebView, and the height check written for Safari's chrome (47) refused. iOS's answer asked the keyboard node in the app's tree, and Android's keyboard is another window, never there; the emulator's keyboard, a floating to ilt.", "Until then Mobium drives only devices you can reach."], "concern": ""}, {"id": "q062", "kind": "fact", "question": "On Android, what happens to the device's rotation when an app refuses a turn?", "gold": [{"id": "CHALLENGES#308", "heading": "308. A refused turn on Android left the device turned, and no session put a turn back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** asking whether rotation had gaps left, after the golden-set question about CHALLENGES 218 — the iPhone's refused turn that turned the next app. That fix was made in WebDriverAgent's driver and never carried to Android's, where a turn is a device setting: `cmd window user-rotation lock` turns auto-rotate off and asks for the quarter, whether or not the app in front turns. On the Android 15 emulator Mobiu…"}], "retrieved": [{"id": "CHALLENGES#308", "heading": "308. A refused turn on Android left the device turned, and no session put a turn back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** asking whether rotation had gaps left, after the golden-set question about CHALLENGES 218 — the iPhone's refused turn that turned the next app. That fix was made in WebDriverAgent's driver and never carried to Android's, where a turn is a device setting: `cmd window user-rotation lock` turns auto-rotate off and asks for the quarter, whether or not the app in front turns. On the Android 15 emulator Mobiu…", "gold": true}, {"id": "CHALLENGES#218", "heading": "218. A refused turn turned the next app", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** rerunning the iPhone's checks in a row after #107. `ios-device.sh` asks Settings, which is portrait only, for landscape and expects the refusal; it got one, \"still portrait\". Wikipedia's check, run next, failed with \"only 4 elements on the feed\", and NetNewsWire's after it could not find its feed list: both had opened in landscape, in their wide layouts, and the phone stayed there until turned by hand. …", "gold": false}, {"id": "CHALLENGES#289", "heading": "289. A turn was refused for an app that had just come back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run: `orientation.sh` failed to turn Safari to landscape, alone as in the sweep, while by hand it turned every time. The difference was Safari already running: brought back from the background and turned at once, it accepted the request and still read portrait, three times in three, and the request was taken back as for an app that cannot turn (218); a second later the same turn showed. The tur…", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#device-state", "heading": "Device state", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium orientation # which way, and is it pinned? mobium orientation landscape # turn it and pin it mobium orientation auto # follow the sensor again mobium locale org.wikipedia ja-JP # run one app in Japanese mobium locale org.wikipedia \"\" # back to the device language ``` Both invalidate the refs from the last `map` — a rotation re-lays out every screen and a language change re-renders it, so map again before…", "gold": false}], "missed": false, "facts": ["Mobium puts the rotation back as it was before the request, lock and all, before it refuses.", "So the next app does not open turned, and auto-rotate is left as it was."], "concern": "", "check": "CHALLENGES 308's fix: a refused turn on Android puts the request back as it was, lock and all, and refuses in iOS's words, naming the orientation the app stayed in. The facts are right. Distinct from q016, which is iOS (218). Proposed: approve."}, {"id": "q063", "kind": "fact", "question": "What happens to the screen orientation when a Mobium session ends?", "gold": [{"id": "CHALLENGES#308", "heading": "308. A refused turn on Android left the device turned, and no session put a turn back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** asking whether rotation had gaps left, after the golden-set question about CHALLENGES 218 — the iPhone's refused turn that turned the next app. That fix was made in WebDriverAgent's driver and never carried to Android's, where a turn is a device setting: `cmd window user-rotation lock` turns auto-rotate off and asks for the quarter, whether or not the app in front turns. On the Android 15 emulator Mobiu…"}], "retrieved": [{"id": "docs/SHUTDOWN.md#a-clients-sessions-end-with-it", "heading": "A client's sessions end with it", "path": "docs/SHUTDOWN.md", "excerpt": "A session a client opened with `start()` ends when the client goes, whether it called `quit()`, returned without it, crashed or was killed: `mobium pipe` ends the sessions its client started, and only those. `close()` is the way to leave one open on purpose. So a test run that dies half-way no longer leaves a device session behind for the next one to trip over (defect 130). A pipe still running after its client is re…", "gold": false}, {"id": "docs/SHUTDOWN.md#1-mobium-daemon-stop-always-first", "heading": "1. `mobium daemon stop`, always first", "path": "docs/SHUTDOWN.md", "excerpt": "The daemon owns the device-side sessions: a UiAutomator2 server running as instrumentation on Android, a WebDriverAgent process on an iOS simulator. Stopping it tells both to shut down. On an iOS simulator the next session starts on the home screen, whatever app was in front: WebDriverAgent's runner takes the foreground as it launches and leaves it to the home screen. The first command says so and names `app_launch` …", "gold": false}, {"id": "docs/quickstart/cli.md#notes", "heading": "Notes", "path": "docs/quickstart/cli.md", "excerpt": "- Every command after `session start` uses that session, so none of them needs `--driver`. With more than one device attached, pass the same `--device` to each. - `mobium session status` lists the sessions open. `mobium daemon stop` ends all of them at once. - With more than one device of the session's platform running — two Android devices, or two among the booted simulators and attached iPhones — `start` refuses to…", "gold": false}, {"id": "CHALLENGES#130", "heading": "130. A client that went away left its session open", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading what happens to a session when its client exits, then measuring it on the iPhone 17 Pro simulator. Nothing tied a session to the client that started it. A script that returned without `quit()`, or crashed, closed its pipe exactly as `close()` does, and the pipe returned with the session still open on the device until the daemon went idle for 30 minutes. Ctrl-C was worse: it reaches the whole pro…", "gold": false}, {"id": "docs/quickstart/README.md#4-start-work-quit", "heading": "4. Start, work, quit", "path": "docs/quickstart/README.md", "excerpt": "Every client does the same three things: | | Start a session | Quit it | | --- | --- | --- | | Command line | `mobium session start --platform android --app com.android.settings` | `mobium session end` | | MCP | `app_session` `{\"action\": \"start\", \"platform\": \"android\", \"app\": \"com.android.settings\"}` | `app_session` `{\"action\": \"end\"}` | | Python | `start(platform=\"android\", app=\"com.android.settings\")` | `device.qui…", "gold": false}], "missed": true, "facts": ["The session puts the orientation back as it found it.", "On Android that includes the rotation lock a turn sets."], "concern": "", "check": "308: a sessio e ref. **Prefer the `@ref` to retyping the label.** Many labels are composed from several elements — a search result's title plus its description, say — so no single element carries that text and `text=<the whole label>` will not match it. A label ending in `…` has been shortened …", "gold": false}], "missed": false, "facts": ["Put the value in double quotes, as in text=\"Internet\".", "A quoted value matches the whole text, in any case, so text=\"Internet\" is not met by \"Network & internet\"."], "concern": "", "check": "306's fix and the CLI guide: a quoted value is matched whole, in any case and with straight or curly quotes. The facts are right. It answers how; q019 asks why the unquoted wait was met. Proposed: approve."}, {"id": "q066", "kind": "fact", "question": "How do I press Allow While Using App on iOS's location permission prompt?", "gold": [{"id": "CHALLENGES#305", "heading": "305. `accept` on iOS's location prompt pressed Don't Allow, and said only \"accepted\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reviewing a golden-set question for the docs evaluation — \"which button does `alert accept` press on an iOS permission prompt?\" — whose right answer, Don't Allow, read as a defect rather than an answer. Measured on an iPhone 17 Pro simulator, iOS 26.5, on MobiumApp's Dialog Demo, and on the Android 15 emulator. CHALLENGES 63 and 106 found that accept and dismiss press a button the platform picks, and se…"}], "retrieved": [{"id": "CHALLENGES#305", "heading": "305. `accept` on iOS's location prompt pressed Don't Allow, and said only \"accepted\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reviewing a golden-set question for the docs evaluation — \"which button does `alert accept` press on an iOS permission prompt?\" — whose right answer, Don't Allow, read as a defect rather than an answer. Measured on an iPhone 17 Pro simulator, iOS 26.5, on MobiumApp's Dialog Demo, and on the Android 15 emulator. CHALLENGES 63 and 106 foun
