"heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": true}, {"id": "docs/THREAT-MODEL.md#from-the-agentic-risks", "heading": "From the agentic risks", "path": "docs/THREAT-MODEL.md", "excerpt": "| Risk | Here | Done | Open | | --- | --- | --- | --- | | **Tool misuse and privilege abuse** | Anything that can reach the automation servers can drive the device without Mobium; none of them authenticates | The daemon's socket is owner-only (`0600`, in a `0700` directory); `--remote` forwards it over SSH to an owner-only socket. The simulator's WebDriverAgent server binds `127.0.0.1` (CHALLENGES 152) | See \"Measure…", "gold": false}, {"id": "SECURITY.md#what-is-in-scope", "heading": "What is in scope", "path": "SECURITY.md", "excerpt": "Mobium acts on devices for an agent or a script, so the questions that matter most are the ones [docs/THREAT-MODEL.md](docs/THREAT-MODEL.md) maps: - text from an app or a web page that Mobium passes to an agent as anything but data, - a password, or another value an app marks secret, appearing in output, - something written to a device and left there, - `--remote` or the grid reaching a machine or a device it was not…", "gold": false}, {"id": "examples/drivers/README.md#the-five-rules", "heading": "The five rules", "path": "examples/drivers/README.md", "excerpt": "**1. stdout is the protocol. stderr is your log.** A stray `print()` on stdout is the mistake everyone makes once. Mobium skips lines that are not the reply it is waiting for, and quotes them back at you when something later fails — but do not rely on that. Put your logging on stderr, where `mobium --verbose` shows it. **2. Send what the platform told you, nothing derived.** A snapshot node carries `bounds` and whate…", "gold": false}, {"id": "docs/guides/mcp.md#2-an-agent-at-work", "heading": "2. An agent at work", "path": "docs/guides/mcp.md", "excerpt": "Claude Code, non-interactively, with Mobium's server and nothing else allowed: ```sh claude -p \"Use the mobium tools. On the Android emulator, open the app dev.mobium.mobiumapp, go to its Login Demo, sign in with username mobium and password wrongpass1, and tell me exactly what the app says. Keep it short.\" \\ --mcp-config mobium.json --strict-mcp-config --allowedTools mcp__mobium ``` The calls it made, in order, each…", "gold": false}], "missed": false, "facts": ["Not yet: an agent today writes the password into app_type's arguments.", "It is planned as a secret reference, a name Mobium resolves from the environment, so the agent never holds the value."], "concern": "", "check": "ROADMAP, 'A password the agent never sees': not yet — an agent writes the password into app_type's arguments — and planned as a secret reference, secret:NAME, resolved from the caller's environment and never in the daemon. The facts are right. (mobium-evals measured where a password goes; that is not in the corpus.) Proposed: approve."}, {"id": "q070", "kind": "fact", "question": "Why does Mobium scroll a row out from under iOS 26's toolbar before tapping it?", "gold": [{"id": "CHALLENGES#197", "heading": "197. A row behind iOS 26's toolbar was tapped through the toolbar", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the NetNewsWire check failing on its second run. The feed list grew by a row, which put \"NetNewsWire Blog\" at y 781–832 points, and iOS 26 draws the toolbar over the list from 733 down: the list runs the full height of the screen behind its bars. `tap text=NetNewsWire Blog` answered \"tapped … at (622, 2419)\", which touched the toolbar between its buttons, and nothing happened. The row was inside its scr…"}], "retrieved": [{"id": "CHALLENGES#197", "heading": "197. A row behind iOS 26's toolbar was tapped through the toolbar", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the NetNewsWire check failing on its second run. The feed list grew by a row, which put \"NetNewsWire Blog\" at y 781–832 points, and iOS 26 draws the toolbar over the list from 733 down: the list runs the full height of the screen behind its bars. `tap text=NetNewsWire Blog` answered \"tapped … at (622, 2419)\", which touched the toolbar between its buttons, and nothing happened. The row was inside its scr…", "gold": true}, {"id": "docs/BACK.md#ios", "heading": "iOS", "path": "docs/BACK.md", "excerpt": "iOS has no system back. Going back is the app's: a navigation bar's back button, and, for a `UINavigationController`, a swipe. Mobium refuses `press back` there by design (it is not an event iOS sends); `press back --gesture` sends the swipe, starting in the navigation bar, since the measurements below found a swipe over a list row taken by the row ([In Mobium](#in-mobium)). | | MobiumApp | Control | | --- | --- | --…", "gold": false}, {"id": "CHALLENGES#263", "heading": "263. A back button was covered by the list scrolled under its bar", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a sweep of the simulator checks after 262. `netnewswire-ios.sh` failed at its last step: a tap on the Feeds back button was refused as covered by an article row. iOS 26 runs the article list under its navigation bar and lists the rows after the bar; UIKit draws the bar over them. Until 257 only the outermost node over a point counted — a plain view there, which says nothing about touches — and since 257…", "gold": false}, {"id": "docs/GESTURES.md#gestures", "heading": "Gestures", "path": "docs/GESTURES.md", "excerpt": "Every touch gesture Mobium performs, the tool that performs it, the MobiumApp screen that witnesses it, and what was measured on each platform. Organized by the gesture charts designers use rather than by Mobium's own tool list, so a gap shows up as an empty row instead of as an absence nobody notices. **Measured 2026-09-23** on a Pixel 7 AVD on Android 15 and on 17, a Pixel 8 Pro on Android 17 (UiAutomator2 10.6.6),…", "gold": false}, {"id": "CHALLENGES#167", "heading": "167. A scroll indicator was reported as drawn over the last row", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** adding MobiumApp's iOS home screen to the captured hierarchies for #166 — the corpus test that holds ordinary screens free of covers failed on it. UIKit lists a scroll view's indicators after its content: \"Horizontal scroll bar, 1 page\", 30 points deep over the bottom row. They take no touch, but nothing in the tree says so, so a tap on \"Storage Demo\" would have reported a view over its point. They are …", "gold": false}], "missed": false, "facts": ["A row behind the toolbar counted as in view, so the tap touched the toolbar and did nothing.", "The part of a list in view now excludes bars drawn over its edges, and the scroll that brings a target in measures against that."], "concern": "", "check": "197: a row behind iOS 26's toolbar counted as in view, so the tap touched the toolbar; the part of a list in view now leaves out bars over its edges, and the nudge (114) measures against it. The facts are right; a harder follow-up to q014. Proposed: approve."}, {"id": "q071", "kind": "fact", "question": "On iOS, does `wait --for visible` pass for an element that is in the screen's tree but scrolled off screen?", "gold": [{"id": "CHALLENGES#311", "heading": "311. `wait --for visible` passed for an element off screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking `within` on Ice Cubes' live timeline (CHALLENGES 307), where `wait 'label=Aurora 🐌, 2h' --for visible` answered \"visible\" for a post's author at y −728, above the screen. The wait kept any match with a size, and iOS keeps a list's rows off screen in the tree with real bounds, so \"visible\" meant \"in the tree\". Actions were never fooled — they scroll to what is off screen, or refuse — but a wait …"}], "retrieved": [{"id": "CHALLENGES#311", "heading": "311. `wait --for visible` passed for an element off screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking `within` on Ice Cubes' live timeline (CHALLENGES 307), where `wait 'label=Aurora 🐌, 2h' --for visible` answered \"visible\" for a post's author at y −728, above the screen. The wait kept any match with a size, and iOS keeps a list's rows off screen in the tree with real bounds, so \"visible\" meant \"in the tree\". Actions were never fooled — they scroll to what is off screen, or refuse — but a wait …", "gold": true}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "- **Found reviewing the docs evaluation's golden set** (written down 2026-10-12, read from the code, not yet run on a device): 1. ~~**On an Apple TV, a dialog of three or more buttons named a remedy that cannot work.**~~ Done 2026-10-12, CHALLENGES 313: `app_alert` asks the driver whether the device is answered by its remote before choosing accept, dismiss or a button, and on a TV every one of them is refused naming …", "gold": false}, {"id": "CHALLENGES#307", "heading": "307. A scoped locator found the switch in the row beside it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first run on a device of `within`, which scopes a locator to a row — `label=More within text=Card 8`, the More in Card 8's row. The rule keeps, of the target's matches, the one nearest the anchor, climbing from the anchor and stopping at the list, so a row without the target finds nothing rather than its neighbor's. The tests passed on lists built for them, each marked `scrollable=\"true\"`. On the An…", "gold": false}, {"id": "CHALLENGES#190", "heading": "190. A tap on an element below the screen was reported done", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a survey, on the iPhone 15 Plus, of where a full read would act on an element iOS calls hidden — to see whether `pickOne`, which does not consult visibility, ever acted on one it should not. On seventeen real screens the hidden elements on screen were all covered ones, which the cover rule answers, and one of them, the Obstruction Demo's pass-through target, really is reached: refusing \"hidden\" outright…", "gold": false}, {"id": "CHALLENGES#115", "heading": "115. A tap under the app's own overlay reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Obstruction Demo, built for the purpose after the Dialog Demo's pinned button was seen covering the camera button while both platforms called both visible. Each case is a target with a known cover, every cover itself pressable, and one line saying which of them a tap really reached. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" eight times out of eight, and six of …", "gold": false}], "missed": false, "facts": ["No: visible and hidden count a match only with its center on the screen and inside the part of its list in view.", "A wait for an element that is there but off screen times out saying so, and names app_scroll_to.", "Other conditions — checked, text, enabled — still read a match that is off screen."], "concern": "", "check": "Drafted by Claude from CHALLENGES 311's fix, each fact from its words: visible and hidden ask the screen and the part of the list in view; an off-screen wait times out naming app_scroll_to; other conditions still read off screen. Proposed: approve."}, {"id": "q072", "kind": "fact", "question": "How do I target a button that is inside a frame of a WebView's page?", "gold": [{"id": "CHALLENGES#312", "heading": "312. `find` inside a WebView answered from the native screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving WebViews locators (ROADMAP, locators item 4) and checking them on MobiumApp's Actionability and Frames pages, each tap judged by what the page said it reached. With a WebView's context selected, every action named the page's element, but `find role=button` listed the app's own Back button first and then the page's buttons as the platform's accessibility saw them: `app_find` never asked which cont…"}], "retrieved": [{"id": "CHALLENGES#228", "heading": "228. A WebView's map stopped at the edge of every frame", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** taking ROADMAP's \"Frames and iframes inside a WebView\" to MobiumApp's Frames page, built for it: a same-origin frame, a frame nested inside it and a cross-origin one, each of whose buttons tells the page it was tapped. In the WebView's context `map` listed the page's own button and nothing in any frame, on the simulator and an emulator alike: the scripts that find elements, check them and fill them read…", "gold": false}, {"id": "CHALLENGES#312", "heading": "312. `find` inside a WebView answered from the native screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving WebViews locators (ROADMAP, locators item 4) and checking them on MobiumApp's Actionability and Frames pages, each tap judged by what the page said it reached. With a WebView's context selected, every action named the page's element, but `find role=button` listed the app's own Back button first and then the page's buttons as the platform's accessibility saw them: `app_find` never asked which cont…", "gold": true}, {"id": "docs/guides/cli.md#4-locators-and-refs", "heading": "4. Locators and refs", "path": "docs/guides/cli.md", "excerpt": "Anything that takes a target takes either: - **a ref** from the last `map` — `@e3` — short, and valid until the screen changes; or - **a locator** — `testid=username`, `label=Login Demo`, `text=Sign in`, `role=button` — which survives across screens and runs, and is what a script or a test should use. `testid=` is the one that survives a translation and a redesign. A string locator matches part of the words, in any c…", "gold": false}, {"id": "CHALLENGES#118", "heading": "118. A tap inside a WebView was never checked, and went wherever the page put it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Actionability page, the Obstruction Demo's web counterpart, built once native actions had learned to wait and to refuse. In a WebView none of that applied: a tap resolved its ref to the element's rectangle and touched the center. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" nine times out of nine: | Target | What the tap reached | | --- | --- | | sliding in over t…", "gold": false}, {"id": "CHALLENGES#229", "heading": "229. A cross-origin frame was out of the WebView context's reach", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** finishing CHALLENGES 228, which mapped every frame a page can see into and could only say a cross-origin one was there. A frame closed to the page's scripts still has an execution context of its own, and both protocols run a script in one. Measured on MobiumApp's Frames page: Chrome's DevTools protocol announces a context per frame — the `data:` frame included — as `Runtime.enable`'s events, each with i…", "gold": false}], "missed": false, "facts": ["Inside a WebView a locator can be css= with the frame's path in front: css=iframe#sameFrame >> #sameBtn.", "A selector written for the frame's own document names only the page's own elements, so the refusal, and find, give the path that reaches it."], "concern": "", "check": "Drafted from 312: css= with a frame's path, and a refusal or find that gives the path for a selector written for the frame's own document. Shares its gold with q073, which asks the other half of 312. Proposed: approve."}, {"id": "q073", "kind": "fact", "question": "Inside a WebView, does `find` answer from the page or from the native screen?", "gold": [{"id": "CHALLENGES#312", "heading": "312. `find` inside a WebView answered from the native screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving WebViews locators (ROADMAP, locators item 4) and checking them on MobiumApp's Actionability and Frames pages, each tap judged by what the page said it reached. With a WebView's context selected, every action named the page's element, but `find role=button` listed the app's own Back button first and then the page's buttons as the platform's accessibility saw them: `app_find` never asked which cont…"}], "retrieved": [{"id": "CHALLENGES#312", "heading": "312. `find` inside a WebView answered from the native screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving WebViews locators (ROADMAP, locators item 4) and checking them on MobiumApp's Actionability and Frames pages, each tap judged by what the page said it reached. With a WebView's context selected, every action named the page's element, but `find role=button` listed the app's own Back button first and then the page's buttons as the platform's accessibility saw them: `app_find` never asked which cont…", "gold": true}, {"id": "CHALLENGES#228", "heading": "228. A WebView's map stopped at the edge of every frame", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** taking ROADMAP's \"Frames and iframes inside a WebView\" to MobiumApp's Frames page, built for it: a same-origin frame, a frame nested inside it and a cross-origin one, each of whose buttons tells the page it was tapped. In the WebView's context `map` listed the page's own button and nothing in any frame, on the simulator and an emulator alike: the scripts that find elements, check them and fill them read…", "gold": false}, {"id": "CHALLENGES#301", "heading": "301. A read-only web field took text typed from the native context", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** verifying 300 on the Android 17 emulator. The native tree there reads the Web form's read-only field as enabled, not disabled as on Android 15, and `type @e5 x` from the native context answered `typed \"x\" into @e5` — and the page agreed: the field held `fixedx`, and counted two input events. A person cannot do that: tapping a read-only field raises no keyboard. The native type presumably sets the text t…", "gold": false}, {"id": "CHALLENGES#118", "heading": "118. A tap inside a WebView was never checked, and went wherever the page put it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Actionability page, the Obstruction Demo's web counterpart, built once native actions had learned to wait and to refuse. In a WebView none of that applied: a tap resolved its ref to the element's rectangle and touched the center. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" nine times out of nine: | Target | What the tap reached | | --- | --- | | sliding in over t…", "gold": false}, {"id": "docs/APP-TYPES.md#hybrid", "heading": "Hybrid", "path": "docs/APP-TYPES.md", "excerpt": "A native app with a WebView inside it. The article's point that a hybrid app is *technically a subcategory of native* — because the outermost component is native — is exactly the shape of Mobium's context model: `NATIVE_APP` is the shell, and each page is its own `WEBVIEW_<package>` context. The more useful observation is the one about **ratio**: some hybrid apps are almost entirely WebView, others expose a small one…", "gold": false}], "missed": false, "facts": ["From the page: in a WebView find matches the page's elements by the rules an action uses, and gives each the ref map gives it.", "It used to answer from the native screen."], "concern": "", "check": "Drafted from 312's fix: in a WebView find answers from the page, by the rules an action uses, with map's refs. Shares its gold with q072. Proposed: approve, or merge with q072 if one question per entry is the rule."}, {"id": "q074", "kind": "fact", "question": "What locator does `mobium inspect` record for a tap on a web page's link that has no id?", "gold": [{"id": "CHALLENGES#314", "heading": "314. A recording wrote locators that named less than `map` had, and refs", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** writing down a recording as code (ROADMAP, #202) and reading the recorder's `target` for what it would emit. Two things, both measured after: `map` derives every native locator as the whole value and checks it names one element so (`uitree.Derive`), and the inspector rebuilt it without `Exact`. So it recorded `text=Welcome`, which \"Welcome back\" meets too: the race of CHALLENGES 233, written into a test…"}], "retrieved": [{"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "README.md#refs", "heading": "Refs", "path": "README.md", "excerpt": "`mobium map` snapshots the accessibility hierarchy, keeps the nodes a person could act on, and gives each one the most durable locator that identifies it uniquely — a resource-id if there is one, then an accessibility label, then visible text, and a sibling path only as a last resort. `mobium tap @e5` **re-snapshots and re-resolves** that locator before touching anything. It never replays the coordinates from the map…", "gold": false}, {"id": "docs/guides/inspector.md#1-start-it", "heading": "1. Start it", "path": "docs/guides/inspector.md", "excerpt": "``` $ mobium inspect --device emulator-5554 mobium inspect on http://127.0.0.1:47311/819d02101356fef7563223333156107f/ — Ctrl-C to stop ``` Open that URL — `--open` does it for you. The long part of it is a token: the page answers nothing that does not carry it ([below](#who-can-reach-it)). It calls the same tools every command does, through the same daemon, so a terminal and the page drive one session: run `mobium t…", "gold": false}, {"id": "CHALLENGES#55", "heading": "55. Text entry failed on a field `map` had just handed out a ref for", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first React Native app this project has driven. Every prior Android app was Google's, Wikipedia's, F-Droid's or Aegis's, and every one of them reports a resource-id in the fully qualified form `com.example:id/name`. React Native reports a bare one. A `testID` of `password` arrives as `resource-id=\"password\"`, with no package. `map` handled it correctly — the node, the label, the `role=password` and …", "gold": false}], "missed": true, "facts": ["Its whole text, quoted — text=\"Learn more\" — narrowed by role where the text names several.", "A recording keeps each locator quoted, so it matches the whole text and never a part, and is never recorded by ref."], "concern": "", "check": "Drafted from 314's fix: the recorder keeps Exact, so a recording is quoted, and a page element with no id gets its whole text, narrowed by role. Proposed: approve."}, {"id": "q075", "kind": "fact", "question": "How do I answer the ✓ and ✕ confirmation dialog on a Wear OS watch?", "gold": [{"id": "CHALLENGES#317", "heading": "317. Wear OS's own dialog was no dialog to `app_alert`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** turning Tilt-to-wake on, which asks first: \"Tilt-to-wake reduces battery life. Turn on?\" with a ✕ and a ✓. `app_alert` said no dialog was on screen while `map` showed only Cancel and OK. UiAutomator2's alert endpoint knows the framework's ids, and a watch's dialog fills its screen, so it is no floating window either (CHALLENGES 177). **Fixed:** Wear's alert layout is known by its ids (`wear_alertdialog_…"}], "retrieved": [{"id": "CHALLENGES#317", "heading": "317. Wear OS's own dialog was no dialog to `app_alert`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** turning Tilt-to-wake on, which asks first: \"Tilt-to-wake reduces battery life. Turn on?\" with a ✕ and a ✓. `app_alert` said no dialog was on screen while `map` showed only Cancel and OK. UiAutomator2's alert endpoint knows the framework's ids, and a watch's dialog fills its screen, so it is no floating window either (CHALLENGES 177). **Fixed:** Wear's alert layout is known by its ids (`wear_alertdialog_…", "gold": true}, {"id": "CHALLENGES#315", "heading": "315. On a watch, `text=` found a control and its own title", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring Wear OS for the docs evaluation's question about it (ROADMAP), on a Wear OS 5.1 emulator (API 35, 454×454 round). `text=\"Security\"` on Settings matched two elements and was refused, and so was every row: a Wear \"chip\" is a `Button` whose own `text` repeats its title's `TextView` (`wear_chip_primary_text`). A phone's settings row carries no text of its own, so there only the title matched. The …", "gold": false}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "- **Found reviewing the docs evaluation's golden set** (written down 2026-10-12, read from the code, not yet run on a device): 1. ~~**On an Apple TV, a dialog of three or more buttons named a remedy that cannot work.**~~ Done 2026-10-12, CHALLENGES 313: `app_alert` asks the driver whether the device is answered by its remote before choosing accept, dismiss or a button, and on a TV every one of them is refused naming …", "gold": false}, {"id": "docs/SETUP.md#a-wear-os-emulator", "heading": "A Wear OS emulator", "path": "docs/SETUP.md", "excerpt": "Wear OS images are on the stable channel, Wear OS 3 to 6.1, and 7.0 at API 37. A watch is driven as any Android device, by the same backends: ```sh sdkmanager \"system-images;android-35-ext15;android-wear;arm64-v8a  `map` listed every switch three times", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run, on Settings' Gestures. A Wear toggle chip is a clickable `ToggleButton` holding two more — its switch and the switch's container — each checkable, neither clickable, each with the chip's name and state. `Actionable` takes a checkable node as a target, so `map` gave three refs per row, and `text=\"Tilt-to-wake\",role=switch` matched two. **Fixed:** a checkable node that takes no touch of its …", "gold": true}, {"id": "CHALLENGES#82", "heading": "82. A Settings switch mapped three times, and only the nameless entry flipped it", "path": "docs/CHALLENGES.md", "excerpt": "Turning on Reduce Motion by its `map` entry failed on the phone: `check @e4` tapped `Reduce Motion (switch)` and read back \"still unchecked\". iOS 26's Settings draws a switch row as a switch inside a switch, inside a cell. The outer switch carries the name, the ID and the state, and its frame is the whole row. The inner one is the toggle, with no name. `map` listed three entries: the cell (made a target by defect 78'…", "gold": false}, {"id": "CHALLENGES#317", "heading": "317. Wear OS's own dialog was no dialog to `app_alert`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** turning Tilt-to-wake on, which asks first: \"Tilt-to-wake reduces battery life. Turn on?\" with a ✕ and a ✓. `app_alert` said no dialog was on screen while `map` showed only Cancel and OK. UiAutomator2's alert endpoint knows the framework's ids, and a watch's dialog fills its screen, so it is no floating window either (CHALLENGES 177). **Fixed:** Wear's alert layout is known by its ids (`wear_alertdialog_…", "gold": false}, {"id": "CHALLENGES#120", "heading": "120. An Android settings switch was named for its resource id", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving Android's Settings > Accessibility for `app_accessibility` on a Pixel 7 AVD. Display size and text mapped \"Bold text (button)\" a h no trait and no value, and `map` lists `Volume (button)`. So `app_fill testid=volumeSlider 0.2` went down the text path, typed \"0.…"}], "retrieved": [{"id": "CHALLENGES#318", "heading": "318. `app_fill` on a slider no tool can see blamed a dropped keystroke", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** testing the claim behind a golden-set answer — \"on iOS a slider is not a slider at all\" — on MobiumApp's Slider Demo, iPhone 17 Pro simulator, iOS 26.5. The claim holds for this demo: `@react-native-community/slider` reports each slider as a plain `XCUIElementTypeOther` with no trait and no value, and `map` lists `Volume (button)`. So `app_fill testid=volumeSlider 0.2` went down the text path, typed \"0.…", "gold": true}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "CHALLENGES#341", "heading": "341. A fill of a plain view said its app had left the front", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the iOS 27 sweep's `slider-ios.sh` on the iPhone: `fill testid=volumeSlider 0.2` answered exit 7, \"typed \"0.2\" and the field read back \"\", but the field is no longer on the screen — dev.mobium.mobiumapp is in front now\", with MobiumApp's Slider Demo on the screen and nothing else in front. The check wants 318's refusal, exit 5, naming a drag: Volume is a plain view its library draws, which takes no keys…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "CHALLENGES#319", "heading": "319. A web page's range was a text field to `map` and to `fill`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving MobiumApp's Slider Demo a web page's `<input type=\"range\">` (0 to 100 in steps of 10) beside its native sliders, to measure every kind of slider on iOS (ROADMAP). `map` printed it as `50 (input)` — named by its value, the mistake CHALLENGES 65, 219 and 234 fixed natively — and `app_fill` typed into it: `fill 20` worked, while `fill 0.2`, the position every native slider takes, was clamped by the …", "gold": false}], "missed": false, "facts": ["On iOS that slider reports itself as a plain view with no trait and no value, so nothing outside the app can set it; fill is refused as unsupported.", "The refusal names app_swipe: a drag from its thumb along its track moves it, as a finger does."], "concern": "", "check": "318: MobiumApp's slider library reports each slider on iOS as a plain view with no trait and no value, so app_fill is refused as unsupported (it had blamed a dropped keystroke), and the remedy is app_swipe from the thumb along the track, using map's bounds. Since 321 that remedy is in the error's text as `next:`. The facts are right. Proposed: approve."}, {"id": "q080", "kind": "fact", "question": "How do I set an <input type=\"range\"> on a web page in a WebView?", "gold": [{"id": "CHALLENGES#319", "heading": "319. A web page's range was a text field to `map` and to `fill`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by ranges each by its label, or two ARIA sliders by theirs.", "app_fill moves one thumb to a position from 0 to 1 — a range by its value, an ARIA slider by its arrow keys — and a thumb the page stops short fails as not_confirmed, saying so."], "concern": "", "check": "320: each thumb is its own slider in map, two ranges by their aria-labels or two ARIA sliders by theirs, and app_fill takes 0 to 1 for one thumb: a range is focused first so the page holds the other, an ARIA slider is moved by its arrow keys and read back. The second fact says a thumb stopped short fails as not_confirmed: 320 says that of a range, while of an ARIA slider it says only that the fill fails, saying the page stopped it, and names no code. Proposed: edit the second fact to “… and a thumb the page stops short fails, saying so (as not_confirmed for a range)”, or approve if the code was checked to be the same."}, {"id": "q082", "kind": "fact", "question": "Why do some Mobium errors end with a line starting `next:`?", "gold": [{"id": "CHALLENGES#321", "heading": "321. A remedy in the structured half never reached an agent", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** auditing every tool error an agent met in the evaluation's stored runs — 193 errors in 417 trials, 59 kinds — against the advice to write errors that say what to do next (`mobium-evals`, `probes/error_remedies.py`). In Claude Code an agent is handed a failed call's **text** alone: the transcripts show no code and no remedy, only \"Error: \" and the message — where a successful call is handed its structure…"}], "retrieved": [{"id": "docs/SHUTDOWN.md#a-clients-sessions-end-with-it", "heading": "A client's sessions end with it", "path": "docs/SHUTDOWN.md", "excerpt": "A session a client opened with `start()` ends when the client goes, whether it called `quit()`, returned without it, crashed or was killed: `mobium pipe` ends the sessions its client started, and only those. `close()` is the way to leave one open on purpose. So a .Quit(ctx)` right after a successful `Start` is the usual shape. A second `Quit` does nothing, so an explicit one before it is fine. - The example in the repository builds against the client beside it, through a `replace` line in its `go.mod`; your own module uses `go get`. - `mobium.Connect` still exists: it opens a connection without touching the device, and `Close` leaves the session open. - With mo…", "gold": false}], "missed": true, "facts": ["An agent in Claude Code is handed a failed call's text alone, with no code and no structured remedy.", "So an error's text is its message, then next: and its remedy when the message does not already say it; the structured payload keeps the two apart."], "concern": "", "check": "321: Claude Code hands an agent a failed call's text alone, so a remedy kept only in the structured half reached nobody; an error's text is now its message, then `next:` and the remedy when the message does not already say it, and the structured payload keeps the two apart. The facts are right. Proposed: approve."}], "pins": {"q062": "4ca9a44", "q063": "4ca9a44", "q064": "4ca9a44", "q065": "4ca9a44", "q066": "4ca9a44", "q067": "4ca9a44", "q068": "4ca9a44", "q069": "4ca9a44", "q070": "4ca9a44", "q071": "4ca9a44", "q072": "4ca9a44", "q073": "4ca9a44", "q074": "4ca9a44", "q075": "4ca9a44", "q076": "4ca9a44", "q077": "4ca9a44", "q078": "4ca9a44", "q079": "7b590a4", "q080": "7b590a4", "q081": "7b590a4", "q082": "7b590a4"}};
const KIND = {fact:"Single fact", multi:"Two sections", unanswerable:"Not in the docs"};
const reviews = {};          // id -> stored decision
const drafts = {};           // id -> unsaved text while typing
let db = null, writable = false, filter = "all";   // writable once the store answers
const chains = {};           // one write at a time per question

document.getElementById("pin").textContent = DATA.pin;

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c) e.append(c);
  return e;
}

function secView(s, q, retrieved){
  const box = el("div",{class:"sec"},
    el("div",{class:"sid",text:s.id}),
    el("div",{class:"sh",text:s.heading}));
  if (retrieved && s.gold) box.append(el("span",{class:"key",text:"Answer key"}));
  const d = el("details",{}, el("summary",{text:"Read the passage"}), el("p",{text:s.excerpt}));
  box.append(d);
  if (retrieved && !s.gold){
    const r = reviews[q.id] || {};
    const cb = el("input",{type:"checkbox",id:`also-${q.id}-${s.id}`, checked:(r.also||[]).includes(s.id), disabled:!writable});
    cb.addEventListener("change", () => {
      const cur = new Set((reviews[q.id]||{}).also || []);
      cb.checked ? cur.add(s.id) : cur.delete(s.id);
      save(q.id, {also:[...cur]});
    });
    box.append(el("label",{class:"also", for:cb.id}, cb, document.createTextNode("Also answers it")));
  }
  return box;
}

function card(q){
  const r = reviews[q.id] || {};
  const li = el("li",{class:"q", id:q.id, "data-decision": r.decision || null});
  li.append(el("div",{class:"qhead"},
    el("span",{class:"id",text:q.id}),
    el("span",{class:"tag",text:KIND[q.kind]}),
    q.missed ? el("span",{class:"tag miss",text:"Missed by retrieval"}) : null,
    (DATA.pins && DATA.pins[q.id]) ? el("span",{class:"tag",text:"New · retrieved at "+DATA.pins[q.id]}) : null,
    el("span",{class:"state saved", id:`st-${q.id}`, text: r.decision ? `${r.decision === "approve" ? "Approved" : r.decision === "edit" ? "Edited" : "Rejected"}` : "Undecided"})));
  li.append(el("p",{class:"question",text: (r.decision === "edit" && r.question) ? r.question : q.question}));
  const key = el("div",{class:"col"}, el("h3",{text: q.gold.length ? "Answer key" : "Answer key: none, the docs don't say"}));
  if (q.gold.length) q.gold.forEach(s => key.append(secView(s,q,false)));
  else key.append(el("p",{class:"none",text:"A correct answer refuses. Check that nothing below answers it."}));
  const got = el("div",{class:"col"}, el("h3",{text:"Retrieved, reranked top 5"}));
  q.retrieved.forEach(s => got.append(secView(s,q,true)));
  li.append(el("div",{class:"cols"}, key, got));
  if (q.facts){
    const mine = Array.isArray(r.facts);
    const box = el("div",{class:"facts"});
    box.append(el("h3",{}, document.createTextNode("Key facts a correct answer must state"),
      el("span",{class:"src"+(mine?" mine":""), id:`fs-${q.id}`, text: mine ? "Yours" : "Drafted, not yet checked"}),
      (!mine && writable) ? el("button",{class:"ok-facts", id:`fo-${q.id}`, text:"Facts look right",
        onclick: () => save(q.id, {facts: shownFacts(q)})}) : null));
    box.append(el("p",{class:"hint",text:"One per line. Edit freely, or press Facts look right; approving or editing the question also keeps them as shown."}));
    if (q.concern) box.append(el("p",{class:"concern",text:"Drafting flagged: "+q.concern}));
    // Claude's reading of the question against the docs and code: a
    // proposal, never a decision — the buttons below are the decision.
    if (q.check) box.append(el("p",{class:"check"}, el("b",{text:"Claude checked it: "}), document.createTextNode(q.check)));
    const ft = el("textarea",{id:`fa-${q.id}`, rows:String(Math.max(2,(mine?r.facts:q.facts).length+1)), disabled:!writable, "aria-label":`Key facts for ${q.id}`});
    ft.value = drafts[`f-${q.id}`] ?? (mine ? r.facts : q.facts).join("\n");
    ft.addEventListener("input", () => { drafts[`f-${q.id}`] = ft.value;
      debounce(q.id+"f", () => save(q.id,{facts: ft.value.split("\n").map(x => x.trim()).filter(Boolean)}), 700); });
    box.append(ft);
    li.append(box);
  }

  const actions = el("div",{class:"actions"});
  for (const [v,label] of [["approve","Approve"],["edit","Edit"],["reject","Reject"]]){
    actions.append(el("button",{class:"act","data-v":v,"aria-pressed": String(r.decision === v), disabled:!writable, text:label,
      onclick: () => {
        const patch = {decision: r.decision === v ? null : v, question: v === "edit" ? (r.question || q.question) : r.question || null};
        // Deciding a question is checking its facts: keep the ones shown as the reviewer's.
        if (q.facts && patch.decision && patch.decision !== "reject" && !Array.isArray(r.facts)) patch.facts = shownFacts(q);
        save(q.id, patch);
      }}));
  }
  li.append(actions);

  const fields = el("div",{class:"fields"});
  if (r.decision === "edit"){
    const ta = el("textarea",{class:"qedit", id:`qe-${q.id}`, rows:"2", disabled:!writable});
    ta.value = drafts[`q-${q.id}`] ?? r.question ?? q.question;
    ta.addEventListener("input", () => { drafts[`q-${q.id}`] = ta.value; debounce(q.id+"q", () => save(q.id,{question:ta.value}), 700); });
    fields.append(el("label",{for:ta.id,text:"Question as it should read"}), ta);
  }
  const note = el("textarea",{id:`nt-${q.id}`, rows:"1", placeholder:"A note: another section that answers it, or why it should go", disabled:!writable});
  note.value = drafts[`n-${q.id}`] ?? r.note ?? "";
  note.addEventListener("input", () => { drafts[`n-${q.id}`] = note.value; debounce(q.id+"n", () => save(q.id,{note:note.value}), 700); });
  fields.append(el("label",{for:note.id,text:"Note"}), note);
  li.append(fields);
  return li;
}

// The facts as the box shows them now: what is typed, else the saved
// version, else the draft.
function shownFacts(q){
  const r = reviews[q.id] || {};
  const typed = drafts[`f-${q.id}`];
  if (typed !== undefined) return typed.split("\n").map(x => x.trim()).filter(Boolean);
  return Array.isArray(r.facts) ? r.facts : (q.facts || null);
}

const timers = {};
function debounce(k, fn, ms){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }

function visible(q){
  const r = reviews[q.id] || {};
  return filter === "all" || (filter === "open" && !r.decision) || (filter === "missed" && q.missed) || q.kind === filter;
}

function render(){
  const list = document.getElementById("list");
  const focused = document.activeElement && document.activeElement.id;
  list.replaceChildren(...DATA.questions.filter(visible).map(card));
  if (focused){ const f = document.getElementById(focused); if (f){ f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length,f.value.length); } }
  tally();
}

function tally(){
  const n = DATA.questions.length;
  const c = {approve:0, edit:0, reject:0};
  DATA.questions.forEach(q => { const d = (reviews[q.id]||{}).decision; if (d) c[d]++; });
  const open = n - c.approve - c.edit - c.reject;
  const t = document.getElementById("tally");
  t.replaceChildren(...[["Approved",c.approve],["Edited",c.edit],["Rejected",c.reject],["Undecided",open]].map(([l,v]) => el("span",{}, el("b",{text:String(v)}), document.createTextNode(" "+l.toLowerCase()))));
  const bar = document.getElementById("bar");
  bar.replaceChildren(...[["--ok",c.approve],["--edit",c.edit],["--no",c.reject]].map(([col,v]) => { const i = el("i"); i.style.width = (100*v/n)+"%"; i.style.background = `var(${col})`; return i; }));
}

function setState(id, text, err){
  const s = document.getElementById(`st-${id}`); if (s){ s.textContent = text; s.classList.toggle("err", !!err); }
}

function save(id, patch){
  if (!db || !writable) return;
  const body = Object.assign({decision:null, question:null, also:[], note:""}, reviews[id] || {}, patch, {at: new Date().toISOString()});
  if (body.decision !== "edit") body.question = null;
  reviews[id] = body;
  if ("decision" in patch) render(); else tally();
  if ("facts" in patch){
    const l = document.getElementById(`fs-${id}`); if (l){ l.textContent = "Yours"; l.classList.add("mine"); }
    const b = document.getElementById(`fo-${id}`); if (b) b.remove();
  }
  setState(id, "Saving…");
  chains[id] = (chains[id] || Promise.resolve()).then(() => db.collection("reviews").doc(id).set(body)).then(
    () => setState(id, "Saved"),
    e => {
      if (e && e.code === "invalid_argument"){ writable = false; showNotice("This view can read the review but not change it. Ask for edit access to record decisions."); render(); }
      else setState(id, "Not saved: " + ((e && e.message) || "try again"), true);
    });
}

function showNotice(text){ const n = document.getElementById("notice"); n.textContent = text; n.hidden = false; }

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

render();

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db){ showNotice("Decisions can't be saved in this view. Open the review from claude.ai while signed in to record them."); return; }
  writable = true; render();
  db.collection("reviews").onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(d => {
      const v = d.data();
      if (JSON.stringify(reviews[d.id]) !== JSON.stringify(v)){ reviews[d.id] = JSON.parse(JSON.stringify(v)); changed = true; }
    });
    if (changed) render();
  }, e => showNotice("Saved decisions stopped updating live (" + e.code + "). Reload to see the latest."));
})();
</script>
