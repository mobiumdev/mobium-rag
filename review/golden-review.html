<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a marking sheet. A sticky tally on top, one ruled entry per question, the answer key beside what retrieval brought back. */
:root{
  --paper:#f7f8fa; --sheet:#ffffff; --ink:#1c2230; --muted:#5d6678; --rule:#dfe3ea; --wash:#eef1f6;
  --accent:#2453a8; --accent-wash:#e6edfa;
  --ok:#1f7a4d; --ok-wash:#e3f3ea; --edit:#9a5b00; --edit-wash:#fbf0dc; --no:#b3261e; --no-wash:#fbe7e5;
  --mark:#fff1a8;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151c; --sheet:#181c25; --ink:#e4e8f1; --muted:#9aa3b5; --rule:#2b3140; --wash:#1f2430;
  --accent:#8fb0f0; --accent-wash:#1d2840; --ok:#6fcf9b; --ok-wash:#163024; --edit:#f0b65c; --edit-wash:#33270f; --no:#f08a82; --no-wash:#3a1b19;
  --mark:#4a4214; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151c; --sheet:#181c25; --ink:#e4e8f1; --muted:#9aa3b5; --rule:#2b3140; --wash:#1f2430;
  --accent:#8fb0f0; --accent-wash:#1d2840; --ok:#6fcf9b; --ok-wash:#163024; --edit:#f0b65c; --edit-wash:#33270f; --no:#f08a82; --no-wash:#3a1b19;
  --mark:#4a4214; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:980px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:14px 12px;margin-bottom:8px}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font:600 22px/1.2 var(--f-read);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.tally{display:flex;gap:14px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);flex-wrap:wrap}
.tally b{color:var(--ink);font-weight:600}
.bar{height:4px;background:var(--wash);border-radius:2px;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:500 12px/1 var(--f-ui);letter-spacing:.02em;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{border:1px solid var(--edit);background:var(--edit-wash);color:var(--ink);padding:10px 12px;border-radius:6px;font-size:13px;margin:12px 0}
ol.qs{list-style:none;margin:0;padding:0}
li.q{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:6px;padding:16px 18px;margin-top:12px}
li.q[data-decision="approve"]{border-left-color:var(--ok)}
li.q[data-decision="edit"]{border-left-color:var(--edit)}
li.q[data-decision="reject"]{border-left-color:var(--no)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.id{font:500 12px/1 var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink)}
.tag{border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.tag.miss{border-color:var(--no);color:var(--no);background:var(--no-wash)}
.state{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px}
.question{font:400 18px/1.45 var(--f-read);margin:10px 0 12px;max-width:68ch;text-wrap:pretty}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.col{min-width:0}
.col h3{font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec{border-top:1px solid var(--rule);padding:8px 0}
.sec:first-of-type{border-top:0;padding-top:0}
.sec .sid{font:12px/1.3 var(--f-mono);color:var(--muted);word-break:break-all}
.sec .sh{font-weight:600;font-size:13.5px;margin:2px 0}
.sec details summary{cursor:pointer;color:var(--accent);font-size:12.5px;list-style:none}
.sec details summary::-webkit-details-marker{display:none}
.sec details p{font:14px/1.55 var(--f-read);margin:6px 0 0;color:var(--ink)}
.key{display:inline-block;font:600 10.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:var(--mark);color:var(--ink);padding:3px 5px;border-radius:2px}
label.also{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px;cursor:pointer}
.none{color:var(--muted);font-size:13.5px;font-style:italic;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.act{font:600 13px/1 var(--f-ui);border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.act[data-v="approve"][aria-pressed="true"]{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.act[data-v="edit"][aria-pressed="true"]{background:var(--edit-wash);border-color:var(--edit);color:var(--edit)}
.act[data-v="reject"][aria-pressed="true"]{background:var(--no-wash);border-color:var(--no);color:var(--no)}
.act:disabled{opacity:.5;cursor:not-allowed}
.fields{display:grid;gap:8px;margin-top:10px}
textarea{width:100%;font:14px/1.45 var(--f-ui);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;resize:vertical}
textarea.qedit{font:16px/1.45 var(--f-read)}
.fields label{font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.saved{color:var(--muted)} .saved.err{color:var(--no)}
.facts{margin-top:14px;border:1px solid var(--rule);border-radius:6px;background:var(--wash);padding:10px 12px}
.facts h3{font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts .src{font:500 10.5px/1 var(--f-ui);letter-spacing:.04em;border:1px solid var(--rule);border-radius:3px;padding:3px 5px;background:var(--sheet)}
.facts .src.mine{border-color:var(--ok);color:var(--ok)}
.facts .hint{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.facts textarea{background:var(--sheet)}
.ok-facts{margin-left:auto;font:600 12px/1 var(--f-ui);text-transform:none;letter-spacing:0;border:1px solid var(--ok);color:var(--ok);background:var(--sheet);border-radius:6px;padding:6px 10px;cursor:pointer}
.ok-facts:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.concern{font-size:13px;border-left:3px solid var(--edit);background:var(--edit-wash);padding:6px 9px;margin:0 0 8px;border-radius:0 4px 4px 0}
.check{font-size:13px;border-left:3px solid var(--accent);background:var(--accent-wash);padding:6px 9px;margin:0 0 8px;border-radius:0 4px 4px 0}
.check b{font-weight:600}
@media (prefers-reduced-motion:no-preference){li.q{transition:border-left-color .2s}}
</style>

const DATA = {"pin": "5b27730", "questions": [{"id": "q001", "kind": "fact", "question": "Why doesn't map print what's typed in a password field?", "gold": [{"id": "CHALLENGES#43", "heading": "43. `map` printed a password in plaintext", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the second and third real third-party apps. Typing into Aegis's master-password field and running `map` again gave: ``` @e2 Sup3rSecret! (input) ``` Android marks the node `password=\"true\"` **and** puts the typed value straight into its `text` attribute. Mobium parsed that flag into `Node.Password` and consulted it nowhere — the same shape as [defect 39](#39-a-visibility-field-that-nothing-consulted), found two days earlier: a field the platform provides, parsed, and never read. It leaked in three…"}], "retrieved": [{"id": "CHALLENGES#43", "heading": "43. `map` printed a password in plaintext", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the second and third real third-party apps. Typing into Aegis's master-password field and running `map` again gave: ``` @e2 Sup3rSecret! (input) ``` Android marks the node `password=\"true\"` **and** puts the typed value straight into its `text` attribute. Mobium parsed that flag into `Node.Password` and consulted it nowhere — the same shape as [defect 39](#39-a-visibility-field-that-nothing-consulted), found two days earlier: a field the platform provides, parsed, and never read. It leaked in three…", "gold": true}, {"id": "CHALLENGES#99", "heading": "99. `app_type` echoed the password it had just typed", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the password test written for `app_keyboard`, which failed on the new tool's confirmation — `typed \"hunter2\" into password` — and then on `app_type`'s, which had said the same thing since it was written: `typed %q into <target>`. The value was the caller's own, but echoing it puts the password into every transcript and log the result reaches, which is the exact thing the rule against printing a password field exists to stop (defect 43). Both now report the length and say it is not echoed, and the…", "gold": false}, {"id": "CHALLENGES#206", "heading": "206. A Flutter app, first look: five things wrong", "path": "docs/CHALLENGES.md", "excerpt": "same name — a name `map` prints that no locator takes is a dead end. - **On iOS `testid=signIn` was refused as covered by \"Sign In\".** Flutter turns `Semantics(identifier:)` into an element of its own, followed by the button in exactly its frame; the button is the control the identifier names. A sibling in the target's very frame, over a target that is no control, is no longer a cover. - **On iOS a password was reported dropped, and printed.** Flutter's obscured field is a plain TextField until it holds something,…", "gold": false}, {"id": "examples/drivers/README.md#the-five-rules", "heading": "The five rules", "path": "examples/drivers/README.md", "excerpt": "**1. stdout is the protocol. stderr is your log.** A stray `print()` on stdout is the mistake everyone makes once. Mobium skips lines that are not the reply it is waiting for, and quotes them back at you when something later fails — but do not rely on that. Put your logging on stderr, where `mobium --verbose` shows it. **2. Send what the platform told you, nothing derived.** A snapshot node carries `bounds` and whatever of `text`, `label`, `testid`, `class`, `package` and the boolean flags you have. Depth, index,…", "gold": false}, {"id": "CHALLENGES#159", "heading": "159. A password typed on a real iPhone lost every letter, and was reported typed", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/autowait.sh` on the iPhone 15 Plus, iOS 26.6.2, failing to see Log In disabled — because the app had refused to sign in with a password of one character. Typing the ten-character \"wrongpass1\" into MobiumApp's password field left one character, three runs in three, and `type` reported ten; the simulator kept all ten. The phone's keyboard was Russian. On a real iPhone a password field is typed key by key on the keyboard that is up, and a letter it has no key for is dropped: the one…", "gold": false}], "missed": false, "facts": ["Android puts the typed value of a password field straight into the node's text, so printing it would leak the password into logs and transcripts.", "Mobium honors the platform's password marking: map labels the field by its resource id and gives it role password.", "Reads of the field show bullets and the character count, never the value."], "concern": ""}, {"id": "q002", "kind": "fact", "question": "A hierarchy read fails with 'Cannot set AccessibilityNodeInfo's field mSealed'. What does that mean, and does Mobium retry it?", "gold": [{"id": "CHALLENGES#51", "heading": "51. Reading the hierarchy during an animation fails, and nothing retried it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** opening the notification shade and mapping straight away, which is exactly what a caller does. ``` error: unknown error: Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true' ``` Accessibility nodes are being recycled underneath the read while the screen moves. It is not a state anyone can wait out deliberately — a caller has no way to know an animation is running — and it succeeds a moment later. The dump backend has retried its own transient failure (\"null root node\") since early on.…"}], "retrieved": [{"id": "CHALLENGES#31", "heading": "31. A hierarchy read fails while the screen animates, and that was fatal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** tapping the same row repeatedly while adding stable-bounds waiting, which produced toasts, which animate. UiAutomator2 intermittently answers `unknown error: Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'` while the screen is changing, and succeeds a moment later — observed failing and passing alternately on the same command. Mobium treated any snapshot error as final, on the reasoning that a device which cannot be asked will not answer later. That reasoning is wrong for this one, and…", "gold": false}, {"id": "CHALLENGES#51", "heading": "51. Reading the hierarchy during an animation fails, and nothing retried it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** opening the notification shade and mapping straight away, which is exactly what a caller does. ``` error: unknown error: Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true' ``` Accessibility nodes are being recycled underneath the read while the screen moves. It is not a state anyone can wait out deliberately — a caller has no way to know an animation is running — and it succeeds a moment later. The dump backend has retried its own transient failure (\"null root node\") since early on.…", "gold": true}, {"id": "CHALLENGES#110", "heading": "110. With the idle wait capped, a coasting screen outlasted the retries", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first run of `mobium-app.sh` on the Pixel 8 Pro after CHALLENGES 109. After the pager section's swipes the pager coasts, and the next `map` failed three times with `Cannot set AccessibilityNodeInfo's field 'mSealed'` — the error that means the screen was changing (CHALLENGES 51). Three tries 700ms apart had been enough only because UiAutomator2 used to wait up to 10s for the app to go idle before each read; capped at 500ms, a read lands in the motion, and a real phone coasts longer than the…", "gold": false}, {"id": "CHALLENGES#254", "heading": "254. No read got through while a system toast was up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** calling a hook that raises a toast five times and then reading the screen: the hooks all answered, and the read failed after six seconds with `Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'`. One toast held a read for 3.6 seconds; five, queued for about ten, outlasted the retry budget — on a Pixel 7 AVD (Android 15) and a Pixel 8 Pro (Android 17) alike. `uiautomator dump`, with UiAutomator2 stopped and the toast still up, read the screen in 1.9 seconds, the app beneath the toast…", "gold": false}, {"id": "README.md#refs", "heading": "Refs", "path": "README.md", "excerpt": "`mobium map` snapshots the accessibility hierarchy, keeps the nodes a person could act on, and gives each one the most durable locator that identifies it uniquely — a resource-id if there is one, then an accessibility label, then visible text, and a sibling path only as a last resort. `mobium tap @e5` **re-snapshots and re-resolves** that locator before touching anything. It never replays the coordinates from the map, because the screen moves between commands and a tap at a stale point fails silently. A locator…", "gold": false}], "missed": false, "facts": ["The error means the screen was moving: accessibility nodes were being recycled underneath the read during an animation.", "Mobium retries it, and only such screen-was-changing failures; a refused connection or invalid session surfaces at once.", "UiAutomator2 reads retry these failures for up to 6 seconds, 300ms apart, then report how many attempts were made."], "concern": ""}, {"id": "q003", "kind": "fact", "question": "A notification body of 'Another body' arrived on the device as just 'Another'. Why?", "gold": [{"id": "CHALLENGES#52", "heading": "52. A shell command with a space in it, truncated to one word", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** posting a notification whose body was \"Another body\" and reading back `android.text=String (Another)`. `adb shell` runs its argument through a shell **on the device**, so an unquoted value with a space becomes two arguments and everything after the first is dropped — silently, because `cmd notification post` is perfectly happy to be given extra arguments. This is the same family as the `input text` mangling that made the dump backend refuse text entry ([defect 9]), but here it is fixable rather than…"}], "retrieved": [{"id": "CHALLENGES#52", "heading": "52. A shell command with a space in it, truncated to one word", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** posting a notification whose body was \"Another body\" and reading back `android.text=String (Another)`. `adb shell` runs its argument through a shell **on the device**, so an unquoted value with a space becomes two arguments and everything after the first is dropped — silently, because `cmd notification post` is perfectly happy to be given extra arguments. This is the same family as the `input text` mangling that made the dump backend refuse text entry ([defect 9]), but here it is fixable rather than…", "gold": true}, {"id": "CHALLENGES#54", "heading": "54. A WebView attach leaked the handshake response on failure", "path": "docs/CHALLENGES.md", "excerpt": "`dialer.DialContext` in `internal/webview/cdp.go` discarded its second return value with `_`. On a *failed* websocket handshake gorilla hands back the HTTP response, whose body is the caller's to close; on success it is nil. So every failed attach leaked a body. Invisible until a long session runs out of file descriptors, which is exactly the kind of defect this project only ever finds on a device, days later. Found by `bodyclose` in seconds.", "gold": false}, {"id": "CHALLENGES#87", "heading": "87. A line logged between two reads of the device log vanished", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first run of `app_logs --source device` on the Pixel 7 AVD, before it shipped, with a probe line written between two reads. A device-log read returns what arrived since the last one, capped at `lines`, keeping the newest; the next read starts after the newest line returned. On the AVD, UiAutomator2's startup logged well over a hundred lines between two reads, one per `/status` poll, so the cap kept the last hundred, the mark moved past them, and the probe — older than all of them — was never…", "gold": false}, {"id": "CHALLENGES#findings-that-were-not-defects", "heading": "Findings that were not defects", "path": "docs/CHALLENGES.md", "excerpt": "- **A reinstall resets a phone app's permissions — an install over it does not.** A note from 2026-09-28 said the iPhone kept a notification denial through a reinstall, which would have left a phone no way to reset permissions at all. Measured on the iPhone 15 Plus, iOS 26.6.2, with MobiumApp's notification, location and camera permissions denied: an uninstall and an install brought back all three prompts and emptied the data container (65 entries to 9); an install over the app, with no uninstall, kept all three…", "gold": false}, {"id": "docs/FORMFLUX.md#what-it-does-now", "heading": "What it does now", "path": "docs/FORMFLUX.md", "excerpt": "All three pieces that were open on the first commit are built, and each was run against a device rather than reasoned about. **Assertions.** `Inspect` reports four kinds — an element past the left or right edge, a tappable target below the platform minimum, text the platform truncated, and a tappable element with nothing to announce. On Android Settings it is silent at the native screen and reports exactly one new finding at 720x1520, one at 1440x3120 and one at 1080x2400 @560. Silent when fine, specific when not.…", "gold": false}], "missed": false, "facts": ["adb shell runs its argument through a shell on the device, so an unquoted value with a space becomes two arguments.", "Everything after the first word is silently dropped, because cmd notification post accepts extra arguments.", "Mobium now single-quotes such values for the device's shell, which survives spaces, quotes, $ and %."], "concern": ""}, {"id": "q004", "kind": "fact", "question": "Why does a testid locator I wrote by hand fail on a React Native app when the ref from map works?", "gold": [{"id": "CHALLENGES#55", "heading": "55. Text entry failed on a field `map` had just handed out a ref for", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first React Native app this project has driven. Every prior Android app was Google's, Wikipedia's, F-Droid's or Aegis's, and every one of them reports a resource-id in the fully qualified form `com.example:id/name`. React Native reports a bare one. A `testID` of `password` arrives as `resource-id=\"password\"`, with no package. `map` handled it correctly — the node, the label, the `role=password` and the emitted `testid=password` locator were all right — and then `app_type` on that very ref failed…"}], "retrieved": [{"id": "CHALLENGES#55", "heading": "55. Text entry failed on a field `map` had just handed out a ref for", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first React Native app this project has driven. Every prior Android app was Google's, Wikipedia's, F-Droid's or Aegis's, and every one of them reports a resource-id in the fully qualified form `com.example:id/name`. React Native reports a bare one. A `testID` of `password` arrives as `resource-id=\"password\"`, with no package. `map` handled it correctly — the node, the label, the `role=password` and the emitted `testid=password` locator were all right — and then `app_type` on that very ref failed…", "gold": true}, {"id": "CHALLENGES#findings-that-were-not-defects", "heading": "Findings that were not defects", "path": "docs/CHALLENGES.md", "excerpt": "The measurement took three attempts to become valid, each failing the same way this project keeps documenting: the first read \"no contexts\" on a screen with no WebView, the second on a screen whose WebView had not loaded, and only the third — confirmed by screenshot that content was on screen — meant anything. The zero was correct all three times and only earned that the once. - **React Native repeats an accessibility identifier across the views it renders for one component.** `label=Webview Demo` matched **14**…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#when-things-fail", "heading": "When things fail", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `no element matches … — the screen may have changed, run map again` The screen moved. Re-map and pick a fresh ref. - `… matches N elements — narrow it by appending \",role=button\" …` Ambiguous locator. Add a role or map and use a ref. - `the uiautomator backend cannot type into an element` Drop `--driver uiautomator`; the default backend can type. - `the <name> backend cannot …` That backend never advertised the capability. Switch backends; do not retry. - `a dialog is over the app — \"…\" — and nothing on it…", "gold": false}, {"id": "docs/guides/autowait.md#6-reading-a-refusal-from-code", "heading": "6. Reading a refusal from code", "path": "docs/guides/autowait.md", "excerpt": "`--json` gives the structured half of every answer. The same covered tap: ``` $ mobium --json tap testid=fullTarget { \"error\": \"testid=fullTarget failed check receivesEvents: it is covered by \\\"full cover\\\" (button), and was for 2.2s — a touch there would press that instead; wait for it to go, dismiss it, or tap its own ref from app_map if it is what you meant\", \"code\": \"element_not_reachable\", \"message\": \"testid=fullTarget failed check receivesEvents: it is covered by \\\"full cover\\\" (button), and was for 2.2s — a…", "gold": false}, {"id": "CHALLENGES#41", "heading": "41. A locator inside a WebView was reported as an unknown ref", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. `tap 'text=Charles Babbage'` while switched into Wikipedia's article WebView answered: ``` error: unknown ref text=Charles Babbage in WEBVIEW_org.wikipedia — run app_map again ``` Locators genuinely do not work inside a WebView — the web map matches on the CSS selector behind each ref, and there is nothing for `text=` to resolve against — so the refusal was right. **The advice was impossible.** Re-running `app_map` can never help, because the problem is not a stale ref; it is that a…", "gold": false}], "missed": false, "facts": ["React Native repeats one component's accessibility identifier across the several native views it renders, so a hand-written testid can match many nodes.", "Mobium refuses an ambiguous hand-written locator rather than tapping the first match.", "The locators map derives are unique, so the ref from map is the durable way in."], "concern": ""}, {"id": "q005", "kind": "fact", "question": "I cleared the mock location but dumpsys still reports the mocked position. Is that a bug?", "gold": [{"id": "CHALLENGES#56", "heading": "56. Clearing a mock location reported success and changed nothing visible", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the tool once end to end. `location --clear` said the device would report its own position again, and the very next read still answered *\"from an injected fix\"*, with the same coordinates. Both statements were true, which is what made it a defect rather than a bug report. `cmd location providers remove-test-provider gps` does remove the provider — **and Android keeps the last known location it supplied.** `dumpsys` goes on reporting that fix, still tagged `mock`, from a provider that no…"}], "retrieved": [{"id": "CHALLENGES#56", "heading": "56. Clearing a mock location reported success and changed nothing visible", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the tool once end to end. `location --clear` said the device would report its own position again, and the very next read still answered *\"from an injected fix\"*, with the same coordinates. Both statements were true, which is what made it a defect rather than a bug report. `cmd location providers remove-test-provider gps` does remove the provider — **and Android keeps the last known location it supplied.** `dumpsys` goes on reporting that fix, still tagged `mock`, from a provider that no…", "gold": true}, {"id": "CHALLENGES#59", "heading": "59. A route looked like it ignored `clear`, and the counter was the wrong signal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** asserting that stopping a route stopped it. The app's fix counter read 24 while a route ran, then 26, then 32 after `location --clear` — still climbing at about one a second, exactly as though nothing had stopped. Nothing was wrong. `dumpsys` showed `gps provider [mock]` gone one second after the clear and still gone ten seconds later, so the route had stopped immediately. **The counter counts deliveries, not movement.** Android goes on handing a watching client the last known position after the…", "gold": false}, {"id": "CHALLENGES#48", "heading": "48. `dumpsys` reports rotation in degrees and `user-rotation` in quarters", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first rotation, which failed with `the display reported rotation \"90\"` — a message blaming the device for my own unit mismatch. `mCurrentRotation=ROTATION_90` is **degrees**. `settings get system user_rotation` and `cmd window user-rotation lock <n>` are **quarter turns**. Both are small integers, both are called \"rotation\", and reading one as the other accepts 0 and rejects everything else — so a portrait screen looks perfectly healthy and the very first rotation fails. `dumpsys window` makes it…", "gold": false}, {"id": "CHALLENGES#111", "heading": "111. The location check printed a real phone's position", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run. `mobium-app.sh` had only ever run its location section on an emulator, where clearing a simulated position leaves nothing to report. On the Pixel, clearing it handed back to the phone's GPS, the check's \"still moving after a clear\" assertion failed — correctly, since a real fix does move — and its message printed the phone's own coordinates into the log. This project already refused to open the Location screen on a real iPhone for exactly that reason; the rule had not been carried to…", "gold": false}, {"id": "CHALLENGES#50", "heading": "50. A limitation nobody had tested, written down three times", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** being asked to clarify it. The claim — \"neither `simctl location` nor `adb emu geo fix` can be read back, so nothing can confirm a set took\" — appeared in three documents, each copying the last. No test, no transcript, no measurement anywhere behind it. Half of it is wrong. **Android can be read back.** Not through `adb emu geo fix`, which is what the note was about: that pushes a fix into the emulated GPS, where it lands nowhere until an app *requests* location. The provider sits at…", "gold": false}], "missed": false, "facts": ["It is not a bug.", "Android keeps the last location a test provider supplied after the provider is removed, and that cache cannot be cleared from outside.", "Whether mocking has stopped shows in the provider label losing [mock], not in the position."], "concern": ""}, {"id": "q006", "kind": "fact", "question": "Why does Mobium read a field back after typing into it on iOS?", "gold": [{"id": "CHALLENGES#61", "heading": "61. iOS dropped a keystroke and `type` reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with two text fields and typing into both, one after the other. `lose-999` arrived as `lse-999`. Reproduced deliberately rather than shrugged at: five runs of type-then-type, **four of them dropped exactly one character**, always from the middle of the string — `keep-1` as `kep-1`, `lose-5` as `lse-5`. The same strings typed in isolation, with a pause between them, were correct five times out of five. So it is a race with the focus change and not anything about the text. Measured on…"}], "retrieved": [{"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [keyboard.sh](keyboard.sh) | **The soft keyboard** on MobiumApp's Login screen, on any of the four devices: up once a field has focus, an empty field read as empty rather than as its placeholder, two appends kept (Android replaces a field on every keystroke, so this is the check that it reads and writes back), delete, a password typed and printed nowhere, hiding confirmed — and on an iPhone, the refusal to hide naming enter, and enter working. A simulator that earlier typing left believing a hardware keyboard is…", "gold": false}, {"id": "CHALLENGES#159", "heading": "159. A password typed on a real iPhone lost every letter, and was reported typed", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/autowait.sh` on the iPhone 15 Plus, iOS 26.6.2, failing to see Log In disabled — because the app had refused to sign in with a password of one character. Typing the ten-character \"wrongpass1\" into MobiumApp's password field left one character, three runs in three, and `type` reported ten; the simulator kept all ten. The phone's keyboard was Russian. On a real iPhone a password field is typed key by key on the keyboard that is up, and a letter it has no key for is dropped: the one…", "gold": false}, {"id": "docs/guides/graybox.md#hooks-calling-into-the-app", "heading": "Hooks: calling into the app", "path": "docs/guides/graybox.md", "excerpt": "How a call travels: Mobium waits for the app to be idle, then writes `{\"i\":<id>,\"h\":\"<name>\",\"a\":[...]}` into a field the library adds only in a gray-box launch — set whole through UiAutomator2 on Android, typed through WebDriverAgent on iOS, with everything outside ASCII escaped, since a real iPhone's keyboard has dropped letters outside its layout. The library hands the call to the registered function and writes its answer to the device log, where the gray box is already listening: `MOBIUM-GRAYBOX hook id=<id>…", "gold": false}], "missed": true, "facts": ["On iOS, a keystroke sent while focus is still moving between fields lands nowhere, while the type call reports success.", "Mobium reads the value back after typing and retries once if it does not match."], "concern": ""}, {"id": "q007", "kind": "fact", "question": "On an iOS permission prompt, which button does `alert accept` press?", "gold": [{"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…"}], "retrieved": [{"id": "docs/APP-TYPES.md#try-before-you-install", "heading": "Try before you install", "path": "docs/APP-TYPES.md", "excerpt": "- **Open the clip from its card by `testid=OpenButton`.** The card is an alert to `alert`, and `alert accept` presses its last button, \"View on the App Store\", which opens the clip's store page rather than the clip; `alert dismiss` presses Close. Measured on 2026-10-05 — on iOS the choice is positional, as CHALLENGES 106 found on other alerts. - **Until the clip is up, SpringBoard is in front** — the card, the download, and any permission prompt the clip raises are all its. Still open: **a clip of our own on a…", "gold": false}, {"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…", "gold": true}, {"id": "CHALLENGES#106", "heading": "106. `accept` and `dismiss` are not positional either", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Dialog Demo, which raises one-, two- and three-button alerts, an action sheet and permission prompts, and reports which button the app received. CHALLENGES 63 replaced \"accept presses the affirmative button\" with \"accept presses the last button and dismiss the first\", and the project's rules stated it as measured on both platforms. It was measured on two-button alerts, where position, role and meaning all agree, and so it could not have failed. With more buttons: | Dialog | `dismiss`…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#dialogs", "heading": "Dialogs", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `mobium alert` — is a system or app dialog up, and what does it say - `mobium alert accept` / `dismiss` — answer it. **These do not choose an outcome**: which button each presses depends on the platform and the dialog (on a three-button iOS alert, `accept` pressed Cancel). To choose, tap the button by its caption: `mobium tap \"text=Allow,role=button\"` (iOS captions are labels: `label=Allow`). - `mobium dialogs --when \"Save Password\" --press \"Not Now\"` — declare an answer for a dialog that turns up on its own…", "gold": false}, {"id": "docs/checks/README.md#results", "heading": "Results", "path": "docs/checks/README.md", "excerpt": "**Two kinds of dialog are driven, and they are not the same problem.** The Interruption section raises a *system* permission prompt — another process's window, which `app_current` reports while it is up. The Dialog Demo section raises the app's **own** alerts (the App Alert Demo's, until they were merged into it on 2026-09-26), and is what measured CHALLENGES 63: on an ordinary two-button alert `accept` and `dismiss` read as confirm and cancel, and on Apple's permission prompt they invert. Which button each…", "gold": false}], "missed": false, "facts": ["On the iOS permission prompt, accept presses Don't Allow, so it denies the permission.", "The iOS alert presses the alert's last button for accept, and Don't Allow is last on the permission prompt."], "concern": ""}, {"id": "q008", "kind": "fact", "question": "On a three-button Android alert, which button does `alert dismiss` press?", "gold": [{"id": "CHALLENGES#106", "heading": "106. `accept` and `dismiss` are not positional either", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Dialog Demo, which raises one-, two- and three-button alerts, an action sheet and permission prompts, and reports which button the app received. CHALLENGES 63 replaced \"accept presses the affirmative button\" with \"accept presses the last button and dismiss the first\", and the project's rules stated it as measured on both platforms. It was measured on two-button alerts, where position, role and meaning all agree, and so it could not have failed. With more buttons: | Dialog | `dismiss`…"}], "retrieved": [{"id": "CHALLENGES#106", "heading": "106. `accept` and `dismiss` are not positional either", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Dialog Demo, which raises one-, two- and three-button alerts, an action sheet and permission prompts, and reports which button the app received. CHALLENGES 63 replaced \"accept presses the affirmative button\" with \"accept presses the last button and dismiss the first\", and the project's rules stated it as measured on both platforms. It was measured on two-button alerts, where position, role and meaning all agree, and so it could not have failed. With more buttons: | Dialog | `dismiss`…", "gold": true}, {"id": "skills/mobile-check/SKILL.md#dialogs", "heading": "Dialogs", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `mobium alert` — is a system or app dialog up, and what does it say - `mobium alert accept` / `dismiss` — answer it. **These do not choose an outcome**: which button each presses depends on the platform and the dialog (on a three-button iOS alert, `accept` pressed Cancel). To choose, tap the button by its caption: `mobium tap \"text=Allow,role=button\"` (iOS captions are labels: `label=Allow`). - `mobium dialogs --when \"Save Password\" --press \"Not Now\"` — declare an answer for a dialog that turns up on its own…", "gold": false}, {"id": "docs/checks/README.md#results", "heading": "Results", "path": "docs/checks/README.md", "excerpt": "**Two kinds of dialog are driven, and they are not the same problem.** The Interruption section raises a *system* permission prompt — another process's window, which `app_current` reports while it is up. The Dialog Demo section raises the app's **own** alerts (the App Alert Demo's, until they were merged into it on 2026-09-26), and is what measured CHALLENGES 63: on an ordinary two-button alert `accept` and `dismiss` read as confirm and cancel, and on Apple's permission prompt they invert. Which button each…", "gold": false}, {"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…", "gold": false}, {"id": "CHALLENGES#225", "heading": "225. Behind an Android menu, the refusal named everything but back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the Pixel 8 Pro, carrying CHALLENGES 221 over to Android. An Android popup menu — the Clock's overflow menu — is a window of its own, as a dialog is, so a tap behind it is refused as \"a dialog is over the app\", which is right. Its remedy said to tap one of the dialog's buttons or declare an answer with `app_dialogs`, and `app_alert dismiss` refused, there being no button for it to press. A menu's items are actions: tapping one is not closing the menu. Back closes it, and closes a dialog that can be…", "gold": false}], "missed": false, "facts": ["On Android, dismiss presses the dialog's negative button, whatever its position.", "On a React Native three-button alert (Cancel, Don't Save, Save), dismiss pressed Don't Save, the middle button."], "concern": ""}, {"id": "q009", "kind": "fact", "question": "Why did every iOS switch show up in map as 0?", "gold": [{"id": "CHALLENGES#65", "heading": "65. `map` knew whether a checkbox was ticked and never said", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with checkboxes and radio buttons, because nothing here had ever driven one. Three defects were sitting in it. **The state was dropped at the last layer.** Android reports `checkable=\"true\" checked=\"true\"`, the iOS parser derives the same, `Node` carries it and so does the wire format — and `Entry`, which is what `map` returns, had no field for it. So a ticked box and an empty one printed the identical line, in text *and* in JSON. Proven rather than reasoned: tapping a checkbox…"}], "retrieved": [{"id": "CHALLENGES#65", "heading": "65. `map` knew whether a checkbox was ticked and never said", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with checkboxes and radio buttons, because nothing here had ever driven one. Three defects were sitting in it. **The state was dropped at the last layer.** Android reports `checkable=\"true\" checked=\"true\"`, the iOS parser derives the same, `Node` carries it and so does the wire format — and `Entry`, which is what `map` returns, had no field for it. So a ticked box and an empty one printed the identical line, in text *and* in JSON. Proven rather than reasoned: tapping a checkbox…", "gold": true}, {"id": "CHALLENGES#82", "heading": "82. A Settings switch mapped three times, and only the nameless entry flipped it", "path": "docs/CHALLENGES.md", "excerpt": "Turning on Reduce Motion by its `map` entry failed on the phone: `check @e4` tapped `Reduce Motion (switch)` and read back \"still unchecked\". iOS 26's Settings draws a switch row as a switch inside a switch, inside a cell. The outer switch carries the name, the ID and the state, and its frame is the whole row. The inner one is the toggle, with no name. `map` listed three entries: the cell (made a target by defect 78's rule for cells with text), the outer switch, and the inner one, printed as…", "gold": false}, {"id": "CHALLENGES#77", "heading": "77. A selected button was named \"1\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Wikipedia's onboarding on the iPhone, the first App Store app driven on iOS. The last personalization page offers two choices as plain buttons, and `map` printed `@e2 1 (button)` for the chosen one next to a correctly labeled \"Personalized content\". The chosen button carries `value=\"1\"` and the Selected trait; the other has no value at all. `map` prefers an element's value to its label, which is right for a text field and was already wrong for a Switch (65). A bare 0 or 1 next to a real label, on…", "gold": false}, {"id": "CHALLENGES#76", "heading": "76. The fix for 71 hid system dialogs from `map`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp on the iPhone, the same day. The app's location prompt was on screen and `alert` reported it word for word — and `map` listed only the app underneath: Back, the two drafts, \"Ask for location\". Tapping \"Allow While Using App\" answered \"no element matches\". `current` said `dev.mobium.mobiumapp`. It was 71's hint, still in force. `defaultActiveApplication` had been set to MobiumApp by the launch and never taken off, so WebDriverAgent went on reading MobiumApp — and a system dialog is not the…", "gold": false}, {"id": "CHALLENGES#15", "heading": "15. iOS mapped zero elements", "path": "docs/CHALLENGES.md", "excerpt": "**Step 4, verified late. Found by:** the first `map` against a simulator. The iOS actionability rule whitelisted element types a user \"operates directly\". The iPhone home screen is 23 `XCUIElementTypeIcon`, and `Icon` was not on the list, so `map` returned *No actionable elements found* — the whole screen invisible. Two further things the fixture had wrong, both invented in good faith from WebDriverAgent's documentation: - **`hittable` is not emitted at all.** The parser was built around it as iOS's answer to…", "gold": false}], "missed": false, "facts": ["The iOS parser used an element's value as its text, and a switch's value is 0 or 1.", "The switch's real name was in its label attribute; value now populates text only when it is text."], "concern": ""}, {"id": "q010", "kind": "fact", "question": "A row's button is reported at 0,0 with no size. How does Mobium treat it?", "gold": [{"id": "CHALLENGES#72", "heading": "72. `scroll-to` gave up on an off-screen row before its first swipe", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** scrolling to Legal & Regulatory in Settings > General on the iPhone. `scroll-to 'label=Legal & Regulatory,role=button' --direction down` answered \"matched an element with no on-screen bounds\" and did not swipe. A real iPhone keeps rows below the fold in the hierarchy, and reports them unevenly: the **cell** keeps its real frame (y=1530, `visible=\"false\"`), while the **button inside it** is at 0,0 with zero width and height. `pickOne` treated a single match with empty bounds as a hard error. It is the…"}], "retrieved": [{"id": "CHALLENGES#if-you-are-seeing-something-odd-start-here", "heading": "If you are seeing something odd, start here", "path": "docs/CHALLENGES.md", "excerpt": "| `scroll-to` refuses to swipe for a row you know is further down | A row off screen reported with no bounds — 72, fixed; if it is back, the refusal is being raised before the scroll | | A check passes that should not | Read it again before believing it. 35 and 44 are both ours doing exactly that | | A password, token or PIN appears in output | It should not. 43 — the platform marks these fields and Mobium now honors it; if you see one, the marking is missing or a new read path skipped `uitree.Redact` | | `map`…", "gold": false}, {"id": "CHALLENGES#146", "heading": "146. A row cut off by its list was reported as a tiny touch target", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** formflux's device test on a Pixel 9 Pro Fold emulator, which reported one finding at the new `fold-open` profile and none anywhere else: a 2076×52px row in Android's own Settings, below the 48dp minimum. It was \"Sound & vibration\", 215px tall like every row beside it, sitting at the bottom edge of Settings' list with 52px of it showing. Android reports a child's bounds clipped to its scroll container (the rule the scroll code already follows), and the touch-target check measured the sliver. Any…", "gold": false}, {"id": "docs/FORMFLUX.md#foldables", "heading": "Foldables", "path": "docs/FORMFLUX.md", "excerpt": "The first run at `fold-open` reported one tiny touch target, in Android's Settings: a row cut off by the bottom of its list, measured by the sliver still showing. That was formflux's mistake, not Settings' — CHALLENGES 146 — and a dimension clipped by a scroll container is no longer judged. That run also showed the device test could only log: against Settings, nothing to find and nothing asserted. `TestDeviceCatchesThePlantedTargets` drives MobiumApp's **Layout Demo**, a positive control built for it — a 24dp…", "gold": false}, {"id": "CHALLENGES#219", "heading": "219. A slider printed as `100% (button)`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Ice Cubes' Display Settings, looking for a slider to measure. Its Font Scaling and Line Spacing sliders mapped as `100% (button)` and `1.2 (button)`: no role named a slider, and a slider has no label of its own, so its value was taken for its text, as a switch's 0 or 1 was before CHALLENGES 65. And no tool moved one; the phone's text size was refused for that reason. A slider now maps as `Slider (slider, 100%)`, its value kept as its state and sent as `value` on every client's element, and `map…", "gold": false}, {"id": "CHALLENGES#167", "heading": "167. A scroll indicator was reported as drawn over the last row", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** adding MobiumApp's iOS home screen to the captured hierarchies for #166 — the corpus test that holds ordinary screens free of covers failed on it. UIKit lists a scroll view's indicators after its content: \"Horizontal scroll bar, 1 page\", 30 points deep over the bottom row. They take no touch, but nothing in the tree says so, so a tap on \"Storage Demo\" would have reported a view over its point. They are known by their shape rather than their label, which is in the device's language — an Other that is…", "gold": false}], "missed": true, "facts": ["Mobium treats an element with zero bounds as off screen, the same as not found.", "That not-found answer is what makes scroll-to and the implicit scroll swipe for it."], "concern": ""}, {"id": "q011", "kind": "fact", "question": "What happens if I tap a button that is under an alert on iOS?", "gold": [{"id": "CHALLENGES#105", "heading": "105. A tap on a button under a dialog reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the login demo, then measured on purpose. With \"Save Password?\" over the app, `tap testid=logoutBtn` answered `tapped testid=logoutBtn` and nothing happened; with the app's own alert up, the same for the Back button. iOS puts an app's alert, and a sheet such as Save Password, into the app's own tree beside everything it covers, and WebDriverAgent reports each covered element `visible=\"false\"`. `map` honored that and listed only the dialog's buttons; a locator resolved anything. A target outside a…"}], "retrieved": [{"id": "CHALLENGES#105", "heading": "105. A tap on a button under a dialog reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the login demo, then measured on purpose. With \"Save Password?\" over the app, `tap testid=logoutBtn` answered `tapped testid=logoutBtn` and nothing happened; with the app's own alert up, the same for the Back button. iOS puts an app's alert, and a sheet such as Save Password, into the app's own tree beside everything it covers, and WebDriverAgent reports each covered element `visible=\"false\"`. `map` honored that and listed only the dialog's buttons; a locator resolved anything. A target outside a…", "gold": true}, {"id": "CHALLENGES#107", "heading": "107. A tap on a button under the keyboard reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the iOS login demo, where Log In sat under the keyboard; the app's layout was fixed then, and the Dialog Demo's pinned button is the case kept on purpose. The keyboard is the dialog case one layer over, in the same two shapes. On iOS the keyboard is an `XCUIElementTypeKeyboard` in the app's tree, and what it covers stays there, marked not visible — the field being typed into included — so a locator resolved the button and the tap landed on a key. A target whose center the visible keyboard covers is…", "gold": false}, {"id": "docs/guides/graybox.md#what-an-action-does", "heading": "What an action does", "path": "docs/guides/graybox.md", "excerpt": "Coordinate taps, long presses and swipes wait the same way as a tap on an element, and so does a tap in a WebView. A tap on a button in an alert lifts in the alert's own window, which the library does not watch; with no lift heard during an action, the grace counts from the action's end instead. An app that is never idle — one polling in the background — is not waited for forever. After 10 seconds the action is refused as a timeout that failed check `idle`, naming what the app said kept it busy, with the remedy…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#dialogs", "heading": "Dialogs", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `mobium alert` — is a system or app dialog up, and what does it say - `mobium alert accept` / `dismiss` — answer it. **These do not choose an outcome**: which button each presses depends on the platform and the dialog (on a three-button iOS alert, `accept` pressed Cancel). To choose, tap the button by its caption: `mobium tap \"text=Allow,role=button\"` (iOS captions are labels: `label=Allow`). - `mobium dialogs --when \"Save Password\" --press \"Not Now\"` — declare an answer for a dialog that turns up on its own…", "gold": false}, {"id": "CHALLENGES#217", "heading": "217. A tap behind an app's own full-screen view was reported done", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same app. With its image viewer open, `tap label=Timeline` answered \"tapped\" on the tab bar underneath, and nothing happened; with its Add Account sheet up, the same. CHALLENGES 105 refuses a target under an `XCUIElementTypeAlert` or `Sheet`, and what an app presents itself is neither. The tab was in the tree, reported `visible=\"false\"`, but that flag cannot be the rule by itself: a target under a pass-through view is reported not visible too, and a tap does reach it (CHALLENGES 115). Measured…", "gold": false}], "missed": false, "facts": ["The tap is refused as device_not_ready, quoting the dialog, instead of being reported as a success.", "iOS keeps covered elements in the app's tree marked not visible, so a target outside a visible Alert or Sheet is refused and not scrolled for."], "concern": ""}, {"id": "q012", "kind": "fact", "question": "Why is UiAutomator2's idle wait capped at 500 milliseconds?", "gold": [{"id": "CHALLENGES#109", "heading": "109. On Android, a screen in motion could only be read once it stopped", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the confetti on MobiumApp's Motion Demo, which exists to put a screen in continuous motion on purpose. The first read during a three-second burst took 3.75s and read the burst as over; a `find` during a slower one took 11s, and the piece it aimed at had fallen off the screen by then. iOS read the same burst in 0.56s, mid-fall. Mobium never set UiAutomator2's `waitForIdleTimeout`, so the server's default applied: before every read it waits up to 10s for the app to stop changing. This project had…"}], "retrieved": [{"id": "CHALLENGES#110", "heading": "110. With the idle wait capped, a coasting screen outlasted the retries", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first run of `mobium-app.sh` on the Pixel 8 Pro after CHALLENGES 109. After the pager section's swipes the pager coasts, and the next `map` failed three times with `Cannot set AccessibilityNodeInfo's field 'mSealed'` — the error that means the screen was changing (CHALLENGES 51). Three tries 700ms apart had been enough only because UiAutomator2 used to wait up to 10s for the app to go idle before each read; capped at 500ms, a read lands in the motion, and a real phone coasts longer than the…", "gold": false}, {"id": "CHALLENGES#109", "heading": "109. On Android, a screen in motion could only be read once it stopped", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the confetti on MobiumApp's Motion Demo, which exists to put a screen in continuous motion on purpose. The first read during a three-second burst took 3.75s and read the burst as over; a `find` during a slower one took 11s, and the piece it aimed at had fallen off the screen by then. iOS read the same burst in 0.56s, mid-fall. Mobium never set UiAutomator2's `waitForIdleTimeout`, so the server's default applied: before every read it waits up to 10s for the app to stop changing. This project had…", "gold": true}, {"id": "CHALLENGES#25", "heading": "25. The dump backend cannot read a screen that never goes idle", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** chasing defect 22, then checking rather than assuming. `uiautomator dump` waits for the screen to stop changing before it snapshots. The About page on a Pixel 7 shows an uptime counter, so it never does: reproduced three times out of three, with no UiAutomator2 instrumentation running, `ERROR: could not get idle state.` and no file. The `uiautomator` backend cannot read that screen at all. UiAutomator2 reads it — not because it does not wait for idle, as was written here, but because a counter that…", "gold": false}, {"id": "CHALLENGES#38", "heading": "38. `uiautomator dump`'s reason was discarded, so the failure said \"no output\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving Settings > About through the reference driver. The reference driver read only stdout. `uiautomator dump` puts \"killed\" on stdout and `ERROR: could not get idle state.` on **stderr**, exits 0, and writes no file — so the driver reported `uiautomator dump produced no file: no output`, which names the symptom and hides the cause. The screen was unreadable because the About page's uptime counter ticks every second and the dump mechanism waits for idle; that is defect 25, reproduced independently…", "gold": false}, {"id": "CHALLENGES#31", "heading": "31. A hierarchy read fails while the screen animates, and that was fatal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** tapping the same row repeatedly while adding stable-bounds waiting, which produced toasts, which animate. UiAutomator2 intermittently answers `unknown error: Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'` while the screen is changing, and succeeds a moment later — observed failing and passing alternately on the same command. Mobium treated any snapshot error as final, on the reasoning that a device which cannot be asked will not answer later. That reasoning is wrong for this one, and…", "gold": false}], "missed": false, "facts": ["At the 10-second default, every read of a screen in motion blocked until the motion stopped.", "At 0, a tap right after launch landed on a row still moving and reached its screen only 1 time in 5.", "At 500 ms, launches succeeded 5 of 5 and a moving screen could still be read mid-motion."], "concern": ""}, {"id": "q013", "kind": "fact", "question": "Right after writing the clipboard on Android 13, a tap opened Quick Share. Why?", "gold": [{"id": "CHALLENGES#113", "heading": "113. A tap after writing the clipboard opened Quick Share", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the paste step added to `docs/checks/dialogs.sh`, on the Pixel 7 AVD (API 35). After `mobium clipboard`, the next tap — on Home's Dialog Demo button at (540, 2225) — reported success, and the foreground was `com.google.android.gms/.nearby.sharing.send.SendActivity`: \"Who can share with you\", Continue. Twice, before the cause was looked for rather than cleared. Android 13 and later put up a preview of the clipboard after every write, at the bottom left, as a window of its own — `ClipboardOverlay` in…"}], "retrieved": [{"id": "CHALLENGES#113", "heading": "113. A tap after writing the clipboard opened Quick Share", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the paste step added to `docs/checks/dialogs.sh`, on the Pixel 7 AVD (API 35). After `mobium clipboard`, the next tap — on Home's Dialog Demo button at (540, 2225) — reported success, and the foreground was `com.google.android.gms/.nearby.sharing.send.SendActivity`: \"Who can share with you\", Continue. Twice, before the cause was looked for rather than cleared. Android 13 and later put up a preview of the clipboard after every write, at the bottom left, as a window of its own — `ClipboardOverlay` in…", "gold": true}, {"id": "CHALLENGES#60", "heading": "60. The Android clipboard can be written and not read, and the failure is an empty string", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** probing before building, which is the only reason this is a finding rather than a defect. `adb shell cmd clipboard set-text` reports **\"No shell command implementation\"** on Android 15, although `cmd -l` lists the service — so that route does not exist. UiAutomator2's own endpoints do: a POST to `/appium/device/set_clipboard` with base64 content succeeded, and `/appium/device/get_clipboard` answered `\"\"`. It answers `\"\"` whatever the clipboard holds. Since Android 10 only an app with focus may read…", "gold": false}, {"id": "CHALLENGES#75", "heading": "75. A refusal on an iPhone explained Android, and advised something that also fails", "path": "docs/CHALLENGES.md", "excerpt": "`clipboard` on the phone answered with the Android reason for not reading a clipboard — \"the UiAutomator2 server has no activity of its own\" — and suggested passing text to write one instead. A phone cannot write it either: both directions go through `simctl` on a simulator and `devicectl` has neither. Obeying the advice would have failed a second time. The refusal now gives the phone's own reason.", "gold": false}, {"id": "CHALLENGES#233", "heading": "233. Every quick start waited for a screen it had not reached", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the new MCP quick start on an Android 15 emulator and looking at its screenshot, which was the Settings home screen with the tapped row still pressed. Every quick start, in all six front doors, taps \"Network & internet\" and then waits for `text=Internet` — and `text=` matches part of a text, so \"Network & internet\", on the screen being left, satisfies it at once. The wait answered in 215 ms naming the row it had just tapped, and the screenshot was taken before the next screen arrived. The…", "gold": false}], "missed": false, "facts": ["Android 13 and later show a clipboard preview after every clipboard write, as its own window that no hierarchy contains.", "The tap landed on the preview's share chip instead of the app.", "Actions now wait, up to ten seconds, for the preview to leave the target, since it closes by itself in about seven seconds."], "concern": ""}, {"id": "q014", "kind": "fact", "question": "Once scroll-to has found its target, why does it swipe only part of the way?", "gold": [{"id": "CHALLENGES#114", "heading": "114. A scroll that nearly had its target swiped past it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `dialogs.sh` on the iPhone 17 Pro simulator, once the Dialog Demo had grown two buttons: a tap on Location permission failed with \"on the screen but never scrolled fully into view — scrolled down to the end of the list (3 scrolls)\". The button was at y 2190–2334 and the list ended at 2301: 33 pixels short. The scroll loop swiped half the list, a swipe coasts on iOS, and the button went from just below the fold to 81–228, above the top. Every swipe after that was against the end, so the loop reported…"}], "retrieved": [{"id": "CHALLENGES#114", "heading": "114. A scroll that nearly had its target swiped past it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `dialogs.sh` on the iPhone 17 Pro simulator, once the Dialog Demo had grown two buttons: a tap on Location permission failed with \"on the screen but never scrolled fully into view — scrolled down to the end of the list (3 scrolls)\". The button was at y 2190–2334 and the list ended at 2301: 33 pixels short. The scroll loop swiped half the list, a swipe coasts on iOS, and the button went from just below the fold to 81–228, above the top. Every swipe after that was against the end, so the loop reported…", "gold": true}, {"id": "CHALLENGES#258", "heading": "258. A screen with a long list could not be read at all", "path": "docs/CHALLENGES.md", "excerpt": "The first version stopped there, and a tap on \"Search episodes\", under the tab bar, swiped the episode list to its end — 34 swipes over two tries, 2007 on screen — because the scroll that brings a target into view steers by where the target is reported, and off such a screen that is nowhere it is. So on a screen read this way a locator matches only what is shown, and an action never scrolls by itself: it is refused, naming `app_swipe` and `app_scroll_to`. On the iPhone that tap was refused in five seconds with the…", "gold": false}, {"id": "CHALLENGES#21", "heading": "21. Nothing in the hierarchy says which way a container scrolls", "path": "docs/CHALLENGES.md", "excerpt": "The navigation guard matters more on this axis than the one it was written for: a horizontal drag starting at a screen edge is the system back gesture on both platforms, which is why the swipe starts a quarter of the way in and why the check asserts that the *wrong* axis fails rather than finding the card by luck. This is the clearest case yet of the working rule earning its place. The heuristic was reasonable, cheap to implement, and would have shipped.", "gold": false}, {"id": "CHALLENGES#169", "heading": "169. scroll-to stopped with its target a sliver at the edge", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the documentation site's picture of `mobium scroll-to \"label=Card 8\" --direction right` on MobiumApp's Pager Demo, on an Android 15 emulator — the answer said Card 8 was on screen, and the picture showed Card 7 with 101 pixels of Card 8 at the edge. `app_scroll_to` stops when its target is wholly inside its scroll container, and on Android that test can never fail once any of the target is in: a child's bounds are clipped to its container, so a card 683 pixels wide of which 101 showed reported…", "gold": false}, {"id": "CHALLENGES#241", "heading": "241. A chip taller than its row was scrolled for fifteen times", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same search. A tap on the Podcasts filter chip swiped the results down fifteen times and gave up — \"on the screen but never scrolled fully into view\" — with the chip in plain sight throughout, and the swipes left the results scrolled over it. The chips are 36 points high in a horizontal scroll view 34 points high, a point over each edge, and a target had to fit inside its container's view to count as in it. One that runs past both edges of an axis is now in view on that axis, since no swipe along…", "gold": false}], "missed": false, "facts": ["A full swipe from a near miss coasted the target past the top of the list on iOS, and the loop then reported the end.", "Once the target resolves with real bounds, the loop swipes only the distance it is out plus an eighth of the list."], "concern": ""}, {"id": "q015", "kind": "fact", "question": "Does a Mobium session on Android silence TalkBack?", "gold": [{"id": "CHALLENGES#208", "heading": "208. Every read silenced the device's screen reader", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading Prime Video on a Fire TV, which publishes nothing but one surface to `map`, to see whether it publishes more while Amazon's screen reader, VoiceView, is on. Every read of the screen — `uiautomator dump` and the UiAutomator2 server alike — unbound VoiceView for as long as it ran: `dumpsys accessibility` listed it before the read and not during it, and touch exploration went off. Android's test-automation connection suppresses every other accessibility service unless it is opened with…"}], "retrieved": [{"id": "CHALLENGES#208", "heading": "208. Every read silenced the device's screen reader", "path": "docs/CHALLENGES.md", "excerpt": "The default driver, UiAutomator2, went on silencing it for as long as a session was open, and asking it not to looked like it worked: the server accepted a `disableSuppressAccessibilityService` setting and kept unbinding. In the pinned server the flag is read only from an instrumentation argument, `DISABLE_SUPPRESS_ACCESSIBILITY_SERVICES`, when the server starts, and Mobium now starts it with that. `docs/checks/screen-reader.sh` turns TalkBack on and holds a session to it: on the Android 17 emulator and the Pixel…", "gold": true}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [screen-reader.sh](screen-reader.sh) | **A screen reader stays on**: TalkBack turned on, then a UiAutomator2 session opened on MobiumApp, and every accessibility service still bound and touch exploration still on — before and after a tap the Motion Demo reports, a scroll and a fill read back. Against a build that starts the server without `DISABLE_SUPPRESS_ACCESSIBILITY_SERVICES` nothing is bound once the session opens (CHALLENGES 208). The accessibility settings are put back exactly, an empty value included.…", "gold": false}, {"id": "docs/SETUP.md#with-a-screen-reader-on", "heading": "With a screen reader on", "path": "docs/SETUP.md", "excerpt": "Android's test-automation connection silences every other accessibility service while it is open, unless it is opened not to. So on a device with TalkBack — or VoiceView, on a Fire TV — on, a read of the screen takes the screen reader away for as long as it runs, and an app that publishes its contents only to a screen reader stops publishing them (CHALLENGES 208). Both drivers leave the screen reader running. The default, UiAutomator2, opens its connection that way; `--driver uiautomator` reads through a reader of…", "gold": false}, {"id": "docs/upstream/uiautomator2-server-binds-every-interface.md#what-mobium-does-meanwhile", "heading": "What Mobium does meanwhile", "path": "docs/upstream/uiautomator2-server-binds-every-interface.md", "excerpt": "Mobium installs the release APK, pinned by checksum, and cannot bind it. When a session opens on a real Android phone with this server, its answer says so — the server answers on the phone's network until the session ends — and names `--driver uiautomator`, which drives the phone through `uiautomator dump` over adb and listens on nothing: measured on the Pixel 8 Pro, a dump session added no listening socket where this server added two. When a release has a bind setting, Mobium passes `127.0.0.1` and the note goes.", "gold": false}, {"id": "docs/guides/cli.md#2-a-session", "heading": "2. A session", "path": "docs/guides/cli.md", "excerpt": "A session is a device made ready — its automation server started — with, optionally, an app launched fresh: ``` $ mobium session start --platform android --app dev.mobium.mobiumapp waiting for the UiAutomator2 server to start... session started on emulator-5554 (android, uiautomator2); dev.mobium.mobiumapp was launched fresh and is in the foreground $ mobium session status open: emulator-5554 (android, uiautomator2) ``` Every command after it uses that session. `session end` closes it, and puts back anything it…", "gold": false}], "missed": false, "facts": ["No, not anymore: TalkBack stays bound through a session.", "Mobium starts the UiAutomator2 server with the DISABLE_SUPPRESS_ACCESSIBILITY_SERVICES instrumentation argument; the disableSuppressAccessibilityService setting was ignored.", "The dump backend reads through Mobium's own reader opened with the don't-suppress flag when an accessibility service is enabled."], "concern": ""}, {"id": "q016", "kind": "fact", "question": "On iOS, what happens to the device's orientation when the app refuses to turn?", "gold": [{"id": "CHALLENGES#218", "heading": "218. A refused turn turned the next app", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** rerunning the iPhone's checks in a row after #107. `ios-device.sh` asks Settings, which is portrait only, for landscape and expects the refusal; it got one, \"still portrait\". Wikipedia's check, run next, failed with \"only 4 elements on the feed\", and NetNewsWire's after it could not find its feed list: both had opened in landscape, in their wide layouts, and the phone stayed there until turned by hand. WebDriverAgent's rotation sets the device's orientation whether or not the app in front turns, so…"}], "retrieved": [{"id": "CHALLENGES#218", "heading": "218. A refused turn turned the next app", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** rerunning the iPhone's checks in a row after #107. `ios-device.sh` asks Settings, which is portrait only, for landscape and expects the refusal; it got one, \"still portrait\". Wikipedia's check, run next, failed with \"only 4 elements on the feed\", and NetNewsWire's after it could not find its feed list: both had opened in landscape, in their wide layouts, and the phone stayed there until turned by hand. WebDriverAgent's rotation sets the device's orientation whether or not the app in front turns, so…", "gold": true}, {"id": "CHALLENGES#289", "heading": "289. A turn was refused for an app that had just come back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run: `orientation.sh` failed to turn Safari to landscape, alone as in the sweep, while by hand it turned every time. The difference was Safari already running: brought back from the background and turned at once, it accepted the request and still read portrait, three times in three, and the request was taken back as for an app that cannot turn (218); a second later the same turn showed. The turn is now read for up to two seconds before it is called refused, and sent again only while…", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [notifications-ios.sh](notifications-ios.sh) | **Notifications on an iOS simulator**, read back from Notification Center: a post as MobiumApp confirmed by its banner with MobiumApp still in front; the read finding it by app and body and closing Notification Center again; the shade opened so `map` reads Notification Center and finds it, then closed back to MobiumApp; and a post with the home screen in front refused. On a real iPhone, only the refusal is checked | | [timezone-ios.sh](timezone-ios.sh) | **The time…", "gold": false}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "view, and the check says it did not run when it is not). Driving Settings, the other way, would have moved a phone owner's clock. Per-app locale is done (2026-09-30): iOS stores no per-app language that can be set from outside, so `app_locale` keeps it for the session and every launch passes it as `-AppleLanguages (xx) -AppleLocale xx_YY`; a running app is launched again in it at once. Settings, pinned to ja-JP, read 一般 for General on a simulator and on the iPhone, on the pin's relaunch and on a later launch, and…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#device-state", "heading": "Device state", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium orientation # which way, and is it pinned? mobium orientation landscape # turn it and pin it mobium orientation auto # follow the sensor again mobium locale org.wikipedia ja-JP # run one app in Japanese mobium locale org.wikipedia \"\" # back to the device language ``` Both invalidate the refs from the last `map` — a rotation re-lays out every screen and a language change re-renders it, so map again before acting. Two honest limits worth knowing, because neither platform will tell you: - **An activity…", "gold": false}], "missed": false, "facts": ["WebDriverAgent sets the device's orientation even when the app in front does not turn, which left later apps opening sideways.", "Mobium now takes a refused turn back to where the app stayed before reporting the refusal."], "concern": ""}, {"id": "q017", "kind": "fact", "question": "Why is a locator with role=progressbar refused on a screen that has no progress bar?", "gold": [{"id": "CHALLENGES#222", "heading": "222. `wait role=progressbar --for hidden` waited for nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** looking for a role to tell the scroll loop a list was still loading. There was none: progressbar was in the examples — `mobium wait --help`, the .NET and Java clients' docs, the agent skill — as the way to wait for a spinner to go, and no table named it. A locator with a role nothing has matches nothing, and a wait for nothing to be hidden is over at once: \"role=progressbar is hidden after 826ms\", and the same for `role=nosuchrole`. The example could not fail, so it never said so. `progressbar` is a…"}], "retrieved": [{"id": "CHALLENGES#222", "heading": "222. `wait role=progressbar --for hidden` waited for nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** looking for a role to tell the scroll loop a list was still loading. There was none: progressbar was in the examples — `mobium wait --help`, the .NET and Java clients' docs, the agent skill — as the way to wait for a spinner to go, and no table named it. A locator with a role nothing has matches nothing, and a wait for nothing to be hidden is over at once: \"role=progressbar is hidden after 826ms\", and the same for `role=nosuchrole`. The example could not fail, so it never said so. `progressbar` is a…", "gold": true}, {"id": "CHALLENGES#258", "heading": "258. A screen with a long list could not be read at all", "path": "docs/CHALLENGES.md", "excerpt": "The first version stopped there, and a tap on \"Search episodes\", under the tab bar, swiped the episode list to its end — 34 swipes over two tries, 2007 on screen — because the scroll that brings a target into view steers by where the target is reported, and off such a screen that is nowhere it is. So on a screen read this way a locator matches only what is shown, and an action never scrolls by itself: it is refused, naming `app_swipe` and `app_scroll_to`. On the iPhone that tap was refused in five seconds with the…", "gold": false}, {"id": "docs/guides/cli.md#4-l
