ocators-and-refs", "heading": "4. Locators and refs", "path": "docs/guides/cli.md", "excerpt": "Anything that takes a target takes either: - **a ref** from the last `map` — `@e3` — short, and valid until the screen changes; or - **a locator** — `testid=username`, `label=Login Demo`, `text=Sign in`, `role=button` — which survives across screens and runs, and is what a script or a test should use. `testid=` is the one that survives a translation and a redesign. A locator that matches more than one element is refused, never guessed at; append a role — `label=Apps,role=button` — or use a ref. Every action waits…", "gold": false}, {"id": "CHALLENGES#242", "heading": "242. An ambiguous locator told to narrow by a role both matches share", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the Pocket Casts check on an iPad Air simulator. There the onboarding topic picker is a sheet over Discover, and `label=Technology` matched the topic's button and Discover's category button behind the sheet, which iOS reports hidden. Refusing was right — a strict locator counts what it cannot see — but the remedy said to append `,role=button`, and both were buttons, so following it changed nothing. The launcher's two \"Gmail\" buttons had the same advice, held by a test. A role is now offered only…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#interruptions-and-hardware-buttons", "heading": "Interruptions and hardware buttons", "path": "skills/mobile-check/SKILL.md", "excerpt": "- **iOS has no back button.** `press back` is refused; tap the app's own back chevron, or ask for the swipe with `press back --gesture`, which starts in the navigation bar because a list row's swipe actions would take it anywhere else. An app with no navigation stack has no swipe back at all. - **On Android `--gesture` is refused with three-button navigation** — an edge swipe is not back there. `mobium devices` names the mode. - **Calls and messages are emulator-only.** A real phone cannot be made to ring from…", "gold": false}], "missed": false, "facts": ["A locator with a role nothing has matches nothing, so a wait for it to be hidden finished at once and could never fail.", "Mobium now refuses a role nothing has, naming the roles that exist.", "progressbar is now a role: iOS ActivityIndicator and ProgressIndicator, and Android ProgressBar."], "concern": "The passage says progressbar is now a recognized role, so it is unclear whether a progressbar locator is still refused merely because the current screen lacks one; the question's premise may not match the fixed behavior."}, {"id": "q018", "kind": "fact", "question": "How does scroll-to tell a list that is loading its next page from a list that has ended?", "gold": [{"id": "CHALLENGES#223", "heading": "223. A list loading its next page was taken for the end of the list", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Feed Demo, a list that loads twenty more rows 2.5 seconds after its end is reached, built for this because Ice Cubes' timeline never showed it: 60 swipes over four minutes, and its pages always arrived before the next swipe. iOS cannot slow a network from outside. On the Feed Demo, `scroll-to label=Row 55` answered \"the end of the list (3 scrolls)\" and the app then held 40 rows. The loop's one test for the end was a swipe that moved nothing, and the swipe that reaches a page's end moves…"}], "retrieved": [{"id": "CHALLENGES#223", "heading": "223. A list loading its next page was taken for the end of the list", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Feed Demo, a list that loads twenty more rows 2.5 seconds after its end is reached, built for this because Ice Cubes' timeline never showed it: 60 swipes over four minutes, and its pages always arrived before the next swipe. iOS cannot slow a network from outside. On the Feed Demo, `scroll-to label=Row 55` answered \"the end of the list (3 scrolls)\" and the app then held 40 rows. The loop's one test for the end was a swipe that moved nothing, and the swipe that reaches a page's end moves…", "gold": true}, {"id": "CHALLENGES#303", "heading": "303. A list still loading looked ended, and map's notes never reached the agent", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same baseline. Asked how many rows the Feed Demo holds, agents that swiped and mapped stopped at row 20 while the next page loaded, and answered 20 — two runs of three for Sonnet 5.5, one of Haiku 5.5's. `app_scroll_to` waits a list's busy indicator out (223), but `map` said nothing of one. And reading the transcripts for that showed a wider gap: Claude Code hands its model a tool's structured answer and not its text, so everything Mobium says only in the text — map's notes on a popover, a screen…", "gold": false}, {"id": "CHALLENGES#22", "heading": "22. A ticking clock defeated end-of-list detection", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** noticing that the scrollbar was already at the bottom while mobium swiped at it fifteen times. Scrolling detects the end of a list by checking whether anything moved. The check compared everything the container was showing — text and bounds — and the About screen has an uptime counter that ticks every second. Every comparison found a difference, so the list looked like it was moving forever. Cost: 15 swipes and ~20s where the answer was available after 1. Position is now the evidence, with one…", "gold": false}, {"id": "CHALLENGES#23", "heading": "23. Resolving a locator is not the same as being able to touch it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a test, which is rare enough here to be worth noting. A row scrolled past the end of its list is still in the hierarchy with real, non-empty bounds. `pickOne` was happy with it, so a tap computed a center point below the visible area and touched nothing. The test written for scroll-then-tap failed because no scrolling happened at all: resolution had already \"succeeded\". Actions now check that the resolved node lies wholly inside its scroll container, and scroll when it does not. A related distinction…", "gold": false}, {"id": "CHALLENGES#222", "heading": "222. `wait role=progressbar --for hidden` waited for nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** looking for a role to tell the scroll loop a list was still loading. There was none: progressbar was in the examples — `mobium wait --help`, the .NET and Java clients' docs, the agent skill — as the way to wait for a spinner to go, and no table named it. A locator with a role nothing has matches nothing, and a wait for nothing to be hidden is over at once: \"role=progressbar is hidden after 826ms\", and the same for `role=nosuchrole`. The example could not fail, so it never said so. `progressbar` is a…", "gold": false}], "missed": false, "facts": ["A busy indicator inside the list means it is still loading, and scroll-to waits for it to go, up to ten seconds.", "The indicator counts whether or not it is reported visible, since it sits below the last row.", "Without such an indicator, a swipe that moves nothing is taken as the end of the list."], "concern": ""}, {"id": "q019", "kind": "fact", "question": "Why was a wait for text=Internet satisfied while the previous screen was still showing?", "gold": [{"id": "CHALLENGES#233", "heading": "233. Every quick start waited for a screen it had not reached", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the new MCP quick start on an Android 15 emulator and looking at its screenshot, which was the Settings home screen with the tapped row still pressed. Every quick start, in all six front doors, taps \"Network & internet\" and then waits for `text=Internet` — and `text=` matches part of a text, so \"Network & internet\", on the screen being left, satisfies it at once. The wait answered in 215 ms naming the row it had just tapped, and the screenshot was taken before the next screen arrived. The…"}], "retrieved": [{"id": "CHALLENGES#233", "heading": "233. Every quick start waited for a screen it had not reached", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the new MCP quick start on an Android 15 emulator and looking at its screenshot, which was the Settings home screen with the tapped row still pressed. Every quick start, in all six front doors, taps \"Network & internet\" and then waits for `text=Internet` — and `text=` matches part of a text, so \"Network & internet\", on the screen being left, satisfies it at once. The wait answered in 215 ms naming the row it had just tapped, and the screenshot was taken before the next screen arrived. The…", "gold": true}, {"id": "CHALLENGES#19", "heading": "19. A wait found the element but could not hand back a ref", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running `mobium wait \"text=Network & internet\"` on the emulator. The wait succeeded and reported no element, while the ref table it had just written did contain the row — a `tap @e3` straight afterwards worked. The wait matched the `TextView` carrying the text; `map` collapses the row and hands out a ref for the clickable parent, so an exact node match found nothing. Waits now walk up to the nearest mapped ancestor. This is what makes `wait_for` a replacement for `sleep; map` rather than a call in…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#waiting", "heading": "Waiting", "path": "skills/mobile-check/SKILL.md", "excerpt": "Never sleep. Every action already retries for two seconds while the screen settles, so a tap straight after a launch or another tap is fine. When something takes longer than that — a login, a network fetch — wait for the thing itself rather than for a duration: - `mobium wait \"text=Welcome back\"` — until it is on screen - `mobium wait role=progressbar --for hidden` — until a spinner goes - `mobium wait @e4 --for text --text \"Sent\"` — until its text says so - `mobium wait testid=submit --for enabled` — until a…", "gold": false}, {"id": "CHALLENGES#122", "heading": "122. A scroll right after going back found nothing that scrolls", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `docs/checks/clients.sh` on a Pixel 7 AVD, after the session work of 2026-09-27. Each client's flow presses back from Network & internet and scrolls Settings' main screen to About, and one client in five started failing there — a different one each run — with \"no element matches text=About and nothing on this screen scrolls\". Driven through the Python client in a loop it failed 3 times in 15, each about 60ms after back; the list was there a moment later. The same loop against the build before that…", "gold": false}, {"id": "docs/quickstart/mcp.md#3-the-code", "heading": "3. The code", "path": "docs/quickstart/mcp.md", "excerpt": "# 3. Tap a row by its ref, then wait for the screen it opens. A row's label # can carry its summary too (\"Network & internet Mobile, Wi-Fi, ...\"), # so match its start. row = next(e for e in elements if e[\"label\"].startswith(p[\"row\"])) call(\"app_tap\", {\"target\": row[\"ref\"]}) waited = call(\"app_wait_for\", {\"target\": p[\"next\"]}) print(\" \" + waited[\"content\"][0][\"text\"]) # 4. Take a screenshot. The image comes back in the answer; path also # writes it to disk. call(\"app_screenshot\", {\"path\":…", "gold": false}], "missed": false, "facts": ["The text= locator matches part of a text, so the 'Network & internet' row on the screen being left satisfied text=Internet at once.", "A wait after a tap must name something only the next screen has, such as text=Airplane mode."], "concern": ""}, {"id": "q020", "kind": "fact", "question": "Why did every screen read fail while a system toast was up?", "gold": [{"id": "CHALLENGES#254", "heading": "254. No read got through while a system toast was up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** calling a hook that raises a toast five times and then reading the screen: the hooks all answered, and the read failed after six seconds with `Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'`. One toast held a read for 3.6 seconds; five, queued for about ten, outlasted the retry budget — on a Pixel 7 AVD (Android 15) and a Pixel 8 Pro (Android 17) alike. `uiautomator dump`, with UiAutomator2 stopped and the toast still up, read the screen in 1.9 seconds, the app beneath the toast…"}], "retrieved": [{"id": "CHALLENGES#254", "heading": "254. No read got through while a system toast was up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** calling a hook that raises a toast five times and then reading the screen: the hooks all answered, and the read failed after six seconds with `Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'`. One toast held a read for 3.6 seconds; five, queued for about ten, outlasted the retry budget — on a Pixel 7 AVD (Android 15) and a Pixel 8 Pro (Android 17) alike. `uiautomator dump`, with UiAutomator2 stopped and the toast still up, read the screen in 1.9 seconds, the app beneath the toast…", "gold": true}, {"id": "CHALLENGES#31", "heading": "31. A hierarchy read fails while the screen animates, and that was fatal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** tapping the same row repeatedly while adding stable-bounds waiting, which produced toasts, which animate. UiAutomator2 intermittently answers `unknown error: Cannot set AccessibilityNodeInfo's field 'mSealed' to 'true'` while the screen is changing, and succeeds a moment later — observed failing and passing alternately on the same command. Mobium treated any snapshot error as final, on the reasoning that a device which cannot be asked will not answer later. That reasoning is wrong for this one, and…", "gold": false}, {"id": "CHALLENGES#51", "heading": "51. Reading the hierarchy during an animation fails, and nothing retried it", "path": "docs/CHALLENGES.md", "excerpt": "Worth noting what the failure did right: it said how many attempts it made and that each one failed *while the screen was changing*, which is what made it identifiable as this defect in seconds rather than as a rename regression. An error that names its own category is why the second run was a check rather than a hope. The budget should be measured against the shade before it is raised, since a bigger number chosen by feel would just move the flake.", "gold": false}, {"id": "CHALLENGES#266", "heading": "266. Bold text stayed on after the session put it back, once, under load", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a sweep of the Android checks on the Android 15 emulator. `accessibility.sh` failed at its last step: every raw setting was back as it was, and the screen was not — `font_weight_adjustment` unset again, the window's configuration still at `fontWeightAdjustment=300`, and still there minutes later. 143 met this on a phone and fixed it by writing what unset means before deleting the key, so the system hears a change; the two went out back to back, and if the system reads the key after the delete it…", "gold": false}], "missed": false, "facts": ["The UiAutomator2 server's notification listener, which records toasts, broke every read while a toast was up.", "Mobium now turns enableNotificationListener off for the session and reads it back."], "concern": ""}, {"id": "q021", "kind": "fact", "question": "How does Mobium read an iOS screen with thousands of elements, like a long episode list?", "gold": [{"id": "CHALLENGES#258", "heading": "258. A screen with a long list could not be read at all", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring 257 on the iPhone 15 Plus. On Pocket Casts' Radiolab page `map`, `text` and every action failed: WebDriverAgent did not answer a read within the 60 seconds it is given. The page's episode list is 673 rows, and iOS reports every row to accessibility whether it is on screen or not — 2,847 elements, ten times an ordinary screen, reaching fifty screens down. WebDriverAgent works `visible` out for each: 83.8 seconds for the read, and 25.5 on another try of the same page, against 6.3 and 3.3…"}], "retrieved": [{"id": "CHALLENGES#258", "heading": "258. A screen with a long list could not be read at all", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring 257 on the iPhone 15 Plus. On Pocket Casts' Radiolab page `map`, `text` and every action failed: WebDriverAgent did not answer a read within the 60 seconds it is given. The page's episode list is 673 rows, and iOS reports every row to accessibility whether it is on screen or not — 2,847 elements, ten times an ordinary screen, reaching fifty screens down. WebDriverAgent works `visible` out for each: 83.8 seconds for the read, and 25.5 on another try of the same page, against 6.3 and 3.3…", "gold": true}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "touch. The window now counts the read that came before it, which on iOS already spans it, and the second read is the one element's rectangle by its test id when that id is unique on screen, taken only on an exact match. The touch itself is about 400 ms on the phone whichever way it is sent, and WebDriverAgent's idle settings barely move it. - **Reading an iOS screen without `visible`.** On the iPhone, Settings' hierarchy took 1.81 s to read and 0.29 s without the `visible` attribute: WebDriverAgent works it out…", "gold": false}, {"id": "CHALLENGES#109", "heading": "109. On Android, a screen in motion could only be read once it stopped", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the confetti on MobiumApp's Motion Demo, which exists to put a screen in continuous motion on purpose. The first read during a three-second burst took 3.75s and read the burst as over; a `find` during a slower one took 11s, and the piece it aimed at had fallen off the screen by then. iOS read the same burst in 0.56s, mid-fall. Mobium never set UiAutomator2's `waitForIdleTimeout`, so the server's default applied: before every read it waits up to 10s for the app to stop changing. This project had…", "gold": false}], "missed": false, "facts": ["Once a screen holds 1,000 or more elements, or a full read times out, Mobium reads it without asking WebDriverAgent for visibility.", "What is shown is worked out from geometry: an element off the screen, or inside one that is, is hidden, and map says so.", "On such a screen a locator matches only what is shown, and an action never scrolls by itself."], "concern": ""}, {"id": "q022", "kind": "fact", "question": "What does map say when the device is locked?", "gold": [{"id": "CHALLENGES#260", "heading": "260. A locked device's screen read as an odd one, or as a screen changing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** two things seen once on the iPhone 15 Plus with its screen dark — a read that hung for its 60 seconds, and a `launch` reported done a moment before a screenshot showed the screen black. Measured with the phone locked through Mobium, neither was a lock defect: `launch` was refused as `device_not_ready`, behind the lock screen, in 15 seconds; `current` said SpringBoard; `map` answered in five. The hang was 258's — Radiolab's page, whose full read is slow lit or dark — and the launch was the phone…"}], "retrieved": [{"id": "CHALLENGES#260", "heading": "260. A locked device's screen read as an odd one, or as a screen changing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** two things seen once on the iPhone 15 Plus with its screen dark — a read that hung for its 60 seconds, and a `launch` reported done a moment before a screenshot showed the screen black. Measured with the phone locked through Mobium, neither was a lock defect: `launch` was refused as `device_not_ready`, behind the lock screen, in 15 seconds; `current` said SpringBoard; `map` answered in five. The hang was 258's — Radiolab's page, whose full read is slow lit or dark — and the launch was the phone…", "gold": true}, {"id": "CHALLENGES#80", "heading": "80. A locked phone meant a two-minute wait and the wrong answer", "path": "docs/CHALLENGES.md", "excerpt": "The phone locked itself during a pause. The next command started the runner, and `xcodebuild` logged \"Unlock <name>'s iPhone to Continue … because the device is locked\" — and then waited rather than exiting, so Mobium waited out its full two minutes and answered with a generic \"did not answer\". The cause was in the log the whole time. The runner's log is now read while waiting, and a locked phone is reported at once, with the fix.", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "process can be silently blocked by Local Network privacy — \"No route to host\" while ping works. `doctor` should name that, as it names the other traps that report the wrong cause. A drop under a session was reported as a failed reinstall of a server that was there, with advice to switch driver; now it is `device_not_ready` naming `adb connect` (CHALLENGES 210). - **Scenarios run on 2026-10-02**, with the default driver unless named. Working: `devices` (by model), `doctor`, `current`; `lock` reads the screensaver…", "gold": false}, {"id": "CHALLENGES#95", "heading": "95. A launch onto a locked phone reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the client flows on the Pixel 8 Pro, rerun after its screen had gone to sleep during an emulator run: Python and JavaScript failed at their first step — `launch` returned, and the foreground was not the app. Go, Java and .NET, running a minute later, passed; by then the phone was awake. Reproduced on purpose: with the screen asleep and locked, `am start` succeeded, no activity was resumed, `current()` answered `com.android.systemui`, and `launch` returned success. Its text did say \"launched …, but…", "gold": false}], "missed": false, "facts": ["With SpringBoard in front, map asks whether the device is locked and says so, with the same remedy a refused launch gives.", "A read that fails asks once whether the device is locked and answers device_not_ready if it is."], "concern": ""}, {"id": "q023", "kind": "fact", "question": "What does `mobium boot` do if the emulator is already running?", "gold": [{"id": "CHALLENGES#284", "heading": "284. Two audio remedies said to restart with a command that restarts nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** making the emulator's control port refuse, on purpose — the token in its discovery file changed. The refusal was clear, and its remedy was \"restart the emulator with `mobium boot`\"; so was the remedy for an emulator with no control port at all. `mobium boot` on an emulator that is running answers \"mobium-test was already running, as emulator-5554\" and changes nothing, so the remedy, followed, left the error where it was. Both now name the stop as well — \"`mobium shutdown emulator-5554`, then `mobium…"}], "retrieved": [{"id": "CHALLENGES#284", "heading": "284. Two audio remedies said to restart with a command that restarts nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** making the emulator's control port refuse, on purpose — the token in its discovery file changed. The refusal was clear, and its remedy was \"restart the emulator with `mobium boot`\"; so was the remedy for an emulator with no control port at all. `mobium boot` on an emulator that is running answers \"mobium-test was already running, as emulator-5554\" and changes nothing, so the remedy, followed, left the error where it was. Both now name the stop as well — \"`mobium shutdown emulator-5554`, then `mobium…", "gold": true}, {"id": "docs/quickstart/README.md#android-emulator-macos-linux", "heading": "Android emulator (macOS, Linux)", "path": "docs/quickstart/README.md", "excerpt": "Install [Android Studio](https://developer.android.com/studio) or the command-line tools, then create a virtual device (Device Manager in Android Studio, or `avdmanager`) and boot it by name: ```sh mobium boot <avd> ``` It finds the SDK's `emulator` itself, through `ANDROID_HOME` or the SDK's usual place, and answers once Android has finished booting — not merely once `adb` can see it. Add `--window` to watch it; it runs headless otherwise. `adb` comes with the SDK's platform-tools; put it on your `PATH`. On Linux…", "gold": false}, {"id": "docs/SETUP.md#running-two-at-once", "heading": "Running two at once", "path": "docs/SETUP.md", "excerpt": "```sh emulator -avd mobium-test -no-snapshot-save -no-boot-anim & # 5554 emulator -avd mobium-test-17 -no-snapshot-save -no-boot-anim -port 5556 & # 5556 ``` Then pass `--device emulator-5556` to every command, or run each one under its own `MOBIUM_SESSION`, or give a client the device option.", "gold": false}, {"id": "docs/guides/cli.md#1-which-devices", "heading": "1. Which devices", "path": "docs/guides/cli.md", "excerpt": "``` $ mobium --version mobium version 0.1.0-dev $ mobium devices emulator-5554 device (android emulator, model: sdk_gphone64_arm64, Android 15 (API 35), navigation: gestures) ``` (Trimmed: the Mac also listed its iOS simulators, shut down, and a phone.) To start one, `mobium boot <avd | simulator>` boots an Android emulator by its AVD's name, or an iOS simulator by its name or UDID, and answers once it has booted. With one device running, no command needs to be told which; with several, `--device <serial or udid>`…", "gold": false}, {"id": "docs/SETUP.md#running-headless", "heading": "Running headless", "path": "docs/SETUP.md", "excerpt": "Add `-no-window`. Everything mobium does works unchanged, screenshots included — `adb exec-out screencap` reads the framebuffer, not the window: ```sh emulator -avd mobium-test -no-window -no-snapshot-save -no-boot-anim -no-audio & ``` **Unlike an iOS simulator, the window cannot be attached afterwards.** `simctl boot` is always headless and `open -a Simulator` shows it later; the Android emulator decides at launch, and the console (`adb emu help`) has no command to raise a window. To see the screen on a…", "gold": false}], "missed": false, "facts": ["It changes nothing; it answers that the AVD was already running and names its serial.", "To restart, run mobium shutdown with the serial first, then mobium boot with the AVD."], "concern": ""}, {"id": "q024", "kind": "fact", "question": "How does `mobium shutdown` deal with an emulator that has frozen?", "gold": [{"id": "CHALLENGES#285", "heading": "285. A frozen emulator was told to try the other driver, and could not be shut down", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the lead 284 left. An emulator stopped with SIGSTOP timed out on `adb shell` as a session opened, and the error added \"To run without the UiAutomator2 server, use --driver uiautomator\" — a driver that goes through the same adb. The remedy that would help, a restart, did not work either: `mobium shutdown` on the frozen emulator ran six minutes and ended \"read response: i/o timeout\" with the emulator still running, since `adb emu kill` talks to its console and waited on it without a bound. Now an adb…"}], "retrieved": [{"id": "CHALLENGES#285", "heading": "285. A frozen emulator was told to try the other driver, and could not be shut down", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the lead 284 left. An emulator stopped with SIGSTOP timed out on `adb shell` as a session opened, and the error added \"To run without the UiAutomator2 server, use --driver uiautomator\" — a driver that goes through the same adb. The remedy that would help, a restart, did not work either: `mobium shutdown` on the frozen emulator ran six minutes and ended \"read response: i/o timeout\" with the emulator still running, since `adb emu kill` talks to its console and waited on it without a bound. Now an adb…", "gold": true}, {"id": "CHALLENGES#284", "heading": "284. Two audio remedies said to restart with a command that restarts nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** making the emulator's control port refuse, on purpose — the token in its discovery file changed. The refusal was clear, and its remedy was \"restart the emulator with `mobium boot`\"; so was the remedy for an emulator with no control port at all. `mobium boot` on an emulator that is running answers \"mobium-test was already running, as emulator-5554\" and changes nothing, so the remedy, followed, left the error where it was. Both now name the stop as well — \"`mobium shutdown emulator-5554`, then `mobium…", "gold": false}, {"id": "docs/SHUTDOWN.md#2-simulators-then-emulators", "heading": "2. Simulators, then emulators", "path": "docs/SHUTDOWN.md", "excerpt": "```sh xcrun simctl shutdown <udid> # or `all` adb -s emulator-5554 emu kill ``` `mobium shutdown <serial | avd | udid | simulator>` does this for one device in the same order — its session ended, then the device — and returns once the device is gone. It ends only its own daemon's session and does not check for other daemons on the device, so stop those first (`MOBIUM_SESSION=<name> mobium daemon stop` for each). A **headless** emulator (`-no-window`) is stopped exactly the same way, and this is where the check…", "gold": false}, {"id": "docs/SHUTDOWN.md#1-mobium-daemon-stop-always-first", "heading": "1. `mobium daemon stop`, always first", "path": "docs/SHUTDOWN.md", "excerpt": "The daemon owns the device-side sessions: a UiAutomator2 server running as instrumentation on Android, a WebDriverAgent process on an iOS simulator. Stopping it tells both to shut down. On an iOS simulator the next session starts on the home screen, whatever app was in front: WebDriverAgent's runner takes the foreground as it launches and leaves it to the home screen. The first command says so and names `app_launch` to bring the app back (CHALLENGES 250). Kill the *device* first and neither gets that message. On…", "gold": false}, {"id": "docs/SETUP.md#headed-and-headless-the-procedures-and-what-differs", "heading": "Headed and headless: the procedures, and what differs", "path": "docs/SETUP.md", "excerpt": "Measured 2026-09-26, when a headless emulator was restarted with a window mid-session and three things changed at once. The screen is the same; the **keyboard** and the **snapshot** are not. **Switching an emulator between the two.** It is decided at launch, so it is a restart, in the order `docs/SHUTDOWN.md` gives: ```sh mobium shutdown emulator-5554 && mobium boot mobium-test --window # headed mobium shutdown emulator-5554 && mobium boot mobium-test # headless ``` `mobium boot` cold-boots, passing…", "gold": false}], "missed": false, "facts": ["mobium shutdown gives the emulator's console (adb emu kill) ten seconds.", "Then it ends the emulator process named in its discovery file, but only if ps names that program qemu or an emulator."], "concern": ""}, {"id": "q025", "kind": "fact", "question": "Why did the MCP server answer a saved file's path as a relative path?", "gold": [{"id": "CHALLENGES#286", "heading": "286. MCP answered a saved file's path as it was given, relative", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving audio through every front door — the five clients and raw MCP — after a day that went through the CLI. The clients all held: each saved a relative path under its caller's directory and said so in full, raised the code's own exception for a wrong `expect` (with the capture's path in its details) and for a capture lost with its daemon (with its remedy), and JavaScript's natural `minMs` was refused, not ignored, with the capture still running. `mobium mcp` saved its files in the right place —…"}], "retrieved": [{"id": "CHALLENGES#286", "heading": "286. MCP answered a saved file's path as it was given, relative", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving audio through every front door — the five clients and raw MCP — after a day that went through the CLI. The clients all held: each saved a relative path under its caller's directory and said so in full, raised the code's own exception for a wrong `expect` (with the capture's path in its details) and for a capture lost with its daemon (with its remedy), and JavaScript's natural `minMs` was refused, not ignored, with the capture still running. `mobium mcp` saved its files in the right place —…", "gold": true}, {"id": "CHALLENGES#100", "heading": "100. A relative path was saved relative to the daemon", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading how `app_screenshot` resolves its path while building `app_record`, then measuring it: a daemon started from one directory, and `mobium screenshot -o rel.png` run from another, saved `rel.png` into the first and reported that path as a success. The daemon resolved the path against its own working directory, which is wherever it happened to start — the same for the default `screenshot-<time>.png`, for `install <apk>` and for `location --gpx`, and for every client, which reaches the daemon…", "gold": false}, {"id": "CHALLENGES#172", "heading": "172. An absolute testDir, and a --last-failed that missed and a --list that ignored it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** pointing a config outside the repository at the suite in it, to run that suite on a phone. A config's `testDir` and `outputDir` were joined to the config's own folder, so an absolute one was looked for inside it. Paths from a config are now taken as written when absolute. Then `--last-failed` ran nothing after a run that had failed two tests: the tests were remembered by their file path as it was given, relative, and found again by discovery, absolute. A test is now remembered by its file's absolute…", "gold": false}, {"id": "docs/WINDOWS.md#what-to-try-in-order", "heading": "What to try, in order", "path": "docs/WINDOWS.md", "excerpt": "If you try this, please open an issue with what happened at each step — including the exact error text where it fails. The failures are the useful part. **1. Does the suite pass?** ```powershell go test ./... ``` No device needed. Any failure here is a portability bug in code nobody suspected, which is the most valuable thing this exercise can find. **2. Does the MCP server work?** This is the path that should already be fine. ```powershell '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}' | .\\bin\\mobium.exe mcp…", "gold": false}, {"id": "docs/RELEASE-CHECKLIST.md#cross-cutting", "heading": "Cross-cutting", "path": "docs/RELEASE-CHECKLIST.md", "excerpt": "- [ ] `mobium daemon stop` followed immediately by any command works (defect 28) - [ ] One SIGTERM stops an idle daemon and removes its PID file; a stuck call can no longer hold it up past half a minute (defect 89 — the case itself is `TestShutdownIsBoundedWhenClosingHangs`, since nothing on a device can be made to hang on purpose) - [ ] Quit the emulator mid-session; the next command recovers rather than failing until the daemon is restarted (defect 9) - [ ] `--json` output carries structured fields, not wrapped…", "gold": false}], "missed": false, "facts": ["The MCP server ran the handlers in its own process and did not resolve relative paths, so it answered the path as given.", "Paths are now made absolute where the caller is, by agent.AbsolutePaths, for the CLI, pipe and the MCP server, never in the daemon."], "concern": ""}, {"id": "q026", "kind": "fact", "question": "Why did `expect silence` pass on a melody and on a beeping alarm?", "gold": [{"id": "CHALLENGES#287", "heading": "287. `expect` silence passed on a sweep, a melody, a vibrato and a beeping alarm", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** playing the analysis sounds it had never met, synthesized: chords, tones under noise, clipping, 40 Hz to 15 kHz, sweeps, melodies, vibrato, beeps, speech-like bursts, an offset. Most read right — a chord of equals as a sound with no one pitch, a tone 20 dB over another as that tone, clipped 440 as 440, 40 Hz as no pitch. But the timeline splits a sound wherever its pitch moves more than 2% between tenths of a second, and `expect` dropped every piece of 200ms or less as a tap's click: a two-second…"}], "retrieved": [{"id": "CHALLENGES#287", "heading": "287. `expect` silence passed on a sweep, a melody, a vibrato and a beeping alarm", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** playing the analysis sounds it had never met, synthesized: chords, tones under noise, clipping, 40 Hz to 15 kHz, sweeps, melodies, vibrato, beeps, speech-like bursts, an offset. Most read right — a chord of equals as a sound with no one pitch, a tone 20 dB over another as that tone, clipped 440 as 440, 40 Hz as no pitch. But the timeline splits a sound wherever its pitch moves more than 2% between tenths of a second, and `expect` dropped every piece of 200ms or less as a tap's click: a two-second…", "gold": true}, {"id": "docs/guides/test-runner.md#11-what-the-app-played-audio", "heading": "11. What the app played: `audio`", "path": "docs/guides/test-runner.md", "excerpt": "A capture starts as a step and is asserted at its stop: `expect` is the sounds to hear, in order, each a pitch with an optional length, and `[]` is silence. ```json {\"name\": \"the sequence is heard in order\", \"steps\": [ {\"audio\": {\"action\": \"start\"}}, {\"tap\": \"testid=audioSequence\"}, {\"wait_for\": {\"target\": \"text=finished:\", \"timeout_ms\": 10000}}, {\"audio\": {\"action\": \"stop\", \"path\": \"mobium-report/sequence.wav\", \"expect\": [ {\"hz\": 440, \"min_ms\": 1800, \"max_ms\": 2300}, {\"hz\": 880, \"min_ms\": 1800, \"max_ms\": 2300}…", "gold": false}, {"id": "CHALLENGES#281", "heading": "281. An emulator's audio stream that ended by itself was read as silence", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** killing the emulator mid-capture, on purpose. The stream ended with no error — the read loop took its EOF for the stop's own end — and the stop then padded every second after it with silence, the way it pads the quiet a stream does not send: a capture whose device died three seconds in would answer three seconds of sound and seven of silence, and an `expect` of silence would pass. Measured first that it can only mean the device went: a stream left open for 180s of silence never ended, and the same…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "route, so likely), whether the level follows the phone's volume, and what tells a call or an alarm cutting across the app on iOS. - **Building it**: Mobium is built with `CGO_ENABLED=0`, and both APIs are Objective-C, so the likely route is a small Swift helper compiled on the Mac, as WebDriverAgent is — a simulator or a phone means Xcode is there. - Measuring the simulator found MobiumApp's tone module crashing on play — \"player did not see an IO cycle\" — in a process left running for hours, seconds after the…", "gold": false}, {"id": "CHALLENGES#273", "heading": "273. A tone that began inside a window had no pitch", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running `audio.sh` on the Android 17 emulator, where it failed once in three: \"the pause between 440 and 880 was not about a second of silence\". The timeline had a tenth of a second of sound with no pitch, at -48 to -57 dBFS, between the two tones — five captures in eight. It was the 880's first window. A window is weighed toward its middle before its pitch is read, so a tone that fills only its last few tens of milliseconds is a short burst there, spread over every frequency, and no one pitch held…", "gold": false}], "missed": false, "facts": ["The timeline splits a sound wherever its pitch moves more than 2% between tenths of a second, so melodies and beeps became short pieces.", "expect dropped every piece of 200ms or less as a tap's click, so they passed as silence.", "Now a run of short pieces across gaps of a tenth of a second or less counts as one sound once it lasts over 200ms."], "concern": ""}, {"id": "q027", "kind": "fact", "question": "On an Apple TV, what does `alert accept` do?", "gold": [{"id": "CHALLENGES#298", "heading": "298. An Apple TV's alert was \"accepted\" and stayed up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. `alert accept` on MobiumTV's two-button alert answered \"accepted the dialog and it is still on screen after 3s\": the read-back caught it, but the error left the caller with nothing to do. A tvOS alert is answered with the remote. It opens with focus on its cancel button, the D-pad moves along its buttons, select presses the one that has focus, and Back (the remote's Menu) answers with the cancel button. `accept` and `dismiss` are now refused on an Apple TV before anything is sent,…"}], "retrieved": [{"id": "CHALLENGES#298", "heading": "298. An Apple TV's alert was \"accepted\" and stayed up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. `alert accept` on MobiumTV's two-button alert answered \"accepted the dialog and it is still on screen after 3s\": the read-back caught it, but the error left the caller with nothing to do. A tvOS alert is answered with the remote. It opens with focus on its cancel button, the D-pad moves along its buttons, select presses the one that has focus, and Back (the remote's Menu) answers with the cancel button. `accept` and `dismiss` are now refused on an Apple TV before anything is sent,…", "gold": true}, {"id": "CHALLENGES#63", "heading": "63. `accept` denied the permission and `dismiss` granted it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** checking what the new alert tool actually did, rather than what it was called. On iOS 26.5, from a fresh permission reset each time: | | outcome | | --- | --- | | `app_alert accept` | permission **denied** | | `app_alert dismiss` | permission **granted** | Backwards, and reproducibly so. **The first explanation written here was a guess, and it was wrong in a way worth keeping.** It said accept presses the *affirmative* button and Apple puts \"Don't Allow\" last — a semantic story, and it came with the…", "gold": false}, {"id": "docs/APP-TYPES.md#try-before-you-install", "heading": "Try before you install", "path": "docs/APP-TYPES.md", "excerpt": "- **Open the clip from its card by `testid=OpenButton`.** The card is an alert to `alert`, and `alert accept` presses its last button, \"View on the App Store\", which opens the clip's store page rather than the clip; `alert dismiss` presses Close. Measured on 2026-10-05 — on iOS the choice is positional, as CHALLENGES 106 found on other alerts. - **Until the clip is up, SpringBoard is in front** — the card, the download, and any permission prompt the clip raises are all its. Still open: **a clip of our own on a…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#dialogs", "heading": "Dialogs", "path": "skills/mobile-check/SKILL.md", "excerpt": "- `mobium alert` — is a system or app dialog up, and what does it say - `mobium alert accept` / `dismiss` — answer it. **These do not choose an outcome**: which button each presses depends on the platform and the dialog (on a three-button iOS alert, `accept` pressed Cancel). To choose, tap the button by its caption: `mobium tap \"text=Allow,role=button\"` (iOS captions are labels: `label=Allow`). - `mobium dialogs --when \"Save Password\" --press \"Not Now\"` — declare an answer for a dialog that turns up on its own…", "gold": false}], "missed": false, "facts": ["alert accept is refused on an Apple TV before anything is sent.", "A tvOS alert is answered with the remote: move focus with the D-pad and press select, or press Back to choose the cancel button."], "concern": ""}, {"id": "q028", "kind": "fact", "question": "On an Apple TV, how does Mobium tell where a D-pad press moved focus?", "gold": [{"id": "CHALLENGES#297", "heading": "297. An Apple TV's focus was in the tree and never read", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. WebDriverAgent marks the element with focus `focused=\"true\"` on tvOS, and the iOS parser read every attribute but that one, so every D-pad press answered \"nothing on screen reports focus, so where it went cannot be read\" while the app's own line said `Focused: Tile 1`. The parser now reads it, and a press reports where focus went, as on a Fire TV. The other readers of `Focused` ask Android's keyboard regions, which an iOS driver does not have."}], "retrieved": [{"id": "CHALLENGES#296", "heading": "296. On an Apple TV the runner kept the screen, and every press went to it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first Apple TV simulator session (tvOS 26.5), 2026-10-09. The first daemon's launch put MobiumTV in front and every press worked. After a daemon restart `current` named WebDriverAgent's own runner, `map` found nothing, and two D-pad presses reported that nothing on screen had focus: tvOS's runner answers from the foreground and stays there, as an iPad's does before it answers at all (147). Home, pressed once the session is open and only while the runner is in front, leaves HeadBoard there, and…", "gold": false}, {"id": "CHALLENGES#298", "heading": "298. An Apple TV's alert was \"accepted\" and stayed up", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. `alert accept` on MobiumTV's two-button alert answered \"accepted the dialog and it is still on screen after 3s\": the read-back caught it, but the error left the caller with nothing to do. A tvOS alert is answered with the remote. It opens with focus on its cancel button, the D-pad moves along its buttons, select presses the one that has focus, and Back (the remote's Menu) answers with the cancel button. `accept` and `dismiss` are now refused on an Apple TV before anything is sent,…", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [tv-app.sh](tv-app.sh) | **A TV app driven with a remote** — mobium-app's `tv/` app, MobiumTV — on any Android device: a D-pad press says where focus went and the app agrees; select and a tap arrive as select and as touch; a tap on a tile that opens on focus reaches it as focus, not a click; nine presses right scroll a row to Card 10; `app_alert` sees a dialog, accept is its positive button and back cancels it; play-pause, fast-forward and stop arrive as the app counts them. Passed 2026-10-08 on the Android TV…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "each say what they received — focus, select, touch or an accessibility click, a row that scrolls with focus, a dialog, media keys — so nothing on the owner's TV need be read. `docs/checks/tv-app.sh` passes on the Android TV emulator (API 34). It found that a tap on a tile that opens on focus is reported \"tapped\" while the app received focus and no click, and that the first D-pad press after a touch moves nothing. On the Fire TV it passed the same day, over Wi-Fi in 2 minutes 9 seconds, once each screen and each…", "gold": false}, {"id": "CHALLENGES#297", "heading": "297. An Apple TV's focus was in the tree and never read", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same session. WebDriverAgent marks the element with focus `focused=\"true\"` on tvOS, and the iOS parser read every attribute but that one, so every D-pad press answered \"nothing on screen reports focus, so where it went cannot be read\" while the app's own line said `Focused: Tile 1`. The parser now reads it, and a press reports where focus went, as on a Fire TV. The other readers of `Focused` ask Android's keyboard regions, which an iOS driver does not have.", "gold": true}], "missed": false, "facts": ["WebDriverAgent marks the element with focus focused=\"true\" on tvOS.", "Mobium's iOS parser reads that attribute, so a D-pad press reports where focus went."], "concern": ""}, {"id": "q029", "kind": "fact", "question": "Can app_check tick a checkbox inside a WebView?", "gold": [{"id": "CHALLENGES#299", "heading": "299. A web checkbox, sent between contexts by two refusals", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** an agent, the first time one was graded on it: Opus 5.5 driving MobiumApp's Web form through `mobium mcp` on the Android 15 emulator, in an evaluation harness that grades what the app says rather than what the agent claims (2026-10-11). Asked to tick the form's checkbox, it called `app_check` from the native context on `text=A checkbox`, and again on its ref `@e9` after mapping, and was told both times that it `is not a checkbox, radio or switch, so it has no checked state to set — app_tap is what…"}], "retrieved": [{"id": "CHALLENGES#299", "heading": "299. A web checkbox, sent between contexts by two refusals", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** an agent, the first time one was graded on it: Opus 5.5 driving MobiumApp's Web form through `mobium mcp` on the Android 15 emulator, in an evaluation harness that grades what the app says rather than what the agent claims (2026-10-11). Asked to tick the form's checkbox, it called `app_check` from the native context on `text=A checkbox`, and again on its ref `@e9` after mapping, and was told both times that it `is not a checkbox, radio or switch, so it has no checked state to set — app_tap is what…", "gold": true}, {"id": "CHALLENGES#124", "heading": "124. map said a box was ticked, and no client could read it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving every Go client method against MobiumApp's Form Demo on a Pixel 7 AVD. `map`'s text read \"Email me (checkbox, unchecked)\" and \"Free (radio, checked)\"; its structured result — what every client receives — had the role and no state. `uitree.Entry` carried `Checked`, and `elementView` never copied it onto the wire, so a test in any of the five languages could act on a checkbox and not ask whether it was ticked. The element now carries `checked`, absent for anything with no such state, and each…", "gold": false}, {"id": "CHALLENGES#65", "heading": "65. `map` knew whether a checkbox was ticked and never said", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building a screen with checkboxes and radio buttons, because nothing here had ever driven one. Three defects were sitting in it. **The state was dropped at the last layer.** Android reports `checkable=\"true\" checked=\"true\"`, the iOS parser derives the same, `Node` carries it and so does the wire format — and `Entry`, which is what `map` returns, had no field for it. So a ticked box and an empty one printed the identical line, in text *and* in JSON. Proven rather than reasoned: tapping a checkbox…", "gold": false}, {"id": "CHALLENGES#119", "heading": "119. Typing into a WebView blamed the map, and a checkbox was named \"on\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Web form page, built to measure typing into a page once taps there were checked (118). `type` had no WebView path: it looked a web ref up in the native table, found it empty, and answered \"unknown ref @e1 — the last map found no elements\" for a field the page's map had just listed. Following that advice — map again — could never help. Nothing ever reached the page, on an emulator or a simulator. `type` inside a WebView is now Vibium's fill. The page is asked whether the field can take…", "gold": false}], "missed": false, "facts": ["Yes, app_check works in the WebView's context.", "It reads the page's own state (checked or aria-checked), taps, and reads the page back; asked for the current state it does nothing."], "concern": ""}, {"id": "q030", "kind": "fact", "question": "What happens now when an agent types from the native context into a read-only field in a WebView?", "gold": [{"id": "CHALLENGES#301", "heading": "301. A read-only web field took text typed from the native context", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** verifying 300 on the Android 17 emulator. The native tree there reads the Web form's read-only field as enabled, not disabled as on Android 15, and `type @e5 x` from the native context answered `typed \"x\" into @e5` — and the page agreed: the field held `fixedx`, and counted two input events. A person cannot do that: tapping a read-only field raises no keyboard. The native type presumably sets the text through accessibility, and the WebView applies it whatever the attribute says — not measured. From…"}], "retrieved": [{"id": "CHALLENGES#300", "heading": "300. A read-only web field, typed into from the native context, was \"disabled\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same run. Asked to type into the Web form's read-only field — a refusal task: the right answer is that it cannot be done — the agent called `app_type` on its ref `@e5` from the native context, and was told `text=fixed failed check enabled: it is disabled, and stayed disabled for 2s — a disabled control ignores input; do what enables it, or wait for it with app_wait_for and condition \"enabled\"`. The field is not disabled: it has the `readonly` attribute, and nothing enables it, so both remedies…", "gold": false}, {"id": "CHALLENGES#301", "heading": "301. A read-only web field took text typed from the native context", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** verifying 300 on the Android 17 emulator. The native tree there reads the Web form's read-only field as enabled, not disabled as on Android 15, and `type @e5 x` from the native context answered `typed \"x\" into @e5` — and the page agreed: the field held `fixedx`, and counted two input events. A person cannot do that: tapping a read-only field raises no keyboard. The native type presumably sets the text through accessibility, and the WebView applies it whatever the attribute says — not measured. From…", "gold": true}, {"id": "CHALLENGES#299", "heading": "299. A web checkbox, sent between contexts by two refusals", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** an agent, the first time one was graded on it: Opus 5.5 driving MobiumApp's Web form through `mobium mcp` on the Android 15 emulator, in an evaluation harness that grades what the app says rather than what the agent claims (2026-10-11). Asked to tick the form's checkbox, it called `app_check` from the native context on `text=A checkbox`, and again on its ref `@e9` after mapping, and was told both times that it `is not a checkbox, radio or switch, so it has no checked state to set — app_tap is what…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#hybrid-apps-webviews", "heading": "Hybrid apps (WebViews)", "path": "skills/mobile-check/SKILL.md", "excerpt": "Web content inside an app is a separate context: ```sh mobium contexts # NATIVE_APP, WEBVIEW_com.example mobium context WEBVIEW_com.example # map and tap now work on the page mobium context NATIVE_APP # back to the native shell ``` This works on **both platforms**. Android WebViews must be debuggable (`setWebContentsDebuggingEnabled(true)`) and iOS WKWebViews must be inspectable (`webView.isInspectable = true` on iOS 16.4+). If a WebView does not appear in `contexts`, that is a property of the app — do not keep…", "gold": false}, {"id": "CHALLENGES#findings-that-were-not-defects", "heading": "Findings that were not defects", "path": "docs/CHALLENGES.md", "excerpt": "The measurement took three attempts to become valid, each failing the same way this project keeps documenting: the first read \"no contexts\" on a screen with no WebView, the second on a screen whose WebView had not loaded, and only the third — confirmed by screenshot that content was on screen — meant anything. The zero was correct all three times and only earned that the once. - **React Native repeats an accessibility identifier across the views it renders for one component.** `label=Webview Demo` matched **14**…", "gold": false}], "missed": false, "facts": ["app_type and app_fill from the native context go in through the WebView's page when it can be reached and the element clearly matches the node.", "The page is then asked whether a person could type there, so a read-only field is refused with readonly attribute.", "With no reachable page or no clear match, the text goes in natively as before, and a read-only field can still take it."], "concern": ""}, {"id": "q031", "kind": "fact", "question": "Why does map say an Android slider's value is 'in its own steps'?", "gold": [{"id": "CHALLENGES#302", "heading": "302. A seek bar's reading, in its own steps, read as the slider's range", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the evaluation's baseline (2026-10-11): three models, 23 tasks, three repeats each, driving MobiumApp through `mobium mcp` on the Android 15 emulator. Asked to set the Slider Demo's volume to 20, Sonnet 5.5 filled the Volume slider to 0.2 — right — and was answered `\"value\":\"2.0\"`. It concluded the slider ran to 10, filled 1, read `\"10.0\"`, and reported that 20 was out of range; Haiku 5.5 did the same twice. The reading is the seek bar's progress in its own steps, which 227 found and kept —…"}], "retrieved": [{"id": "CHALLENGES#302", "heading": "302. A seek bar's reading, in its own steps, read as the slider's range", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the evaluation's baseline (2026-10-11): three models, 23 tasks, three repeats each, driving MobiumApp through `mobium mcp` on the Android 15 emulator. Asked to set the Slider Demo's volume to 20, Sonnet 5.5 filled the Volume slider to 0.2 — right — and was answered `\"value\":\"2.0\"`. It concluded the slider ran to 10, filled 1, read `\"10.0\"`, and reported that 20 was out of range; Haiku 5.5 did the same twice. The reading is the seek bar's progress in its own steps, which 227 found and kept —…", "gold": true}, {"id": "CHALLENGES#219", "heading": "219. A slider printed as `100% (button)`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Ice Cubes' Display Settings, looking for a slider to measure. Its Font Scaling and Line Spacing sliders mapped as `100% (button)` and `1.2 (button)`: no role named a slider, and a slider has no label of its own, so its value was taken for its text, as a switch's 0 or 1 was before CHALLENGES 65. And no tool moved one; the phone's text size was refused for that reason. A slider now maps as `Slider (slider, 100%)`, its value kept as its state and sent as `value` on every client's element, and `map…", "gold": false}, {"id": "CHALLENGES#227", "heading": "227. A seek bar was missing from `map`, and nothing could move one", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's new Slider Demo on the Pixel 8 Pro, built because nothing installed had a slider that belonged to no one. `map` listed only Back. Android marks a seek bar neither clickable nor scrollable, so it was not a target; and its text is its progress in its own units — \"5.0\" for a Volume the app held at 50 — which would have been its label. A slider is now a target on Android too, and its text is its value: `Volume (slider, 5.0)`. Moving one was measured three ways. UiAutomator2's set-value sets…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "client's element, `map --diff` reports a value that moved, and `app_fill` takes its position from 0 to 1 and reports what the app then reads. WebDriverAgent moves the thumb as a finger would: from either end it lands exactly, from partway it lands a step past, so landing exactly means filling 0 or 1 first, which is the caller's choice — the app sees the end it passes through. Measured on Ice Cubes' Font Scaling on the simulator and the iPhone, held by `icecubes-ios.sh`, which puts the slider back to what it read.…", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "| [feed.sh](feed.sh) | **A list that grows as it is scrolled**, on MobiumApp's Feed Demo: twenty rows a page, the next 2.5 seconds after the end is reached, three pages in all. `scroll-to` reaches Row 55 across two loads instead of stopping at the first page's end, says Row 70 is past the real end at once, and an unknown role is refused rather than waited on (CHALLENGES 222, 223). Passed on the simulator, the iPhone and the Pixel 8 Pro | | [slider.sh](slider.sh) | **Sliders on Android**, on MobiumApp's Slider…", "gold": false}], "missed": false, "facts": ["An Android seek bar reports its progress in its own units, and UiAutomator2 gives no maximum, so Mobium cannot convert it to the app's number.", "Mobium marks the value as in its own steps so it is not read as the slider's range."], "concern": ""}, {"id": "q032", "kind": "fact", "question": "How can I find out which Android version a device is running with Mobium?", "gold": [{"id": "CHALLENGES#304", "heading": "304. No tool said which Android a device ran", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same baseline. Asked what version of Android the device runs, Haiku 5.5 answered twice that Mobium's tools have no way to read it, and once went through Settings to About; the stronger models went to Settings each time. `app_devices` gave an iOS device's runtime — `iOS 26.6.2` — and an Android one's model and navigation mode, and no version. **Fixed:** an Android device that is ready reports `Android 15 (API 35)`, from `ro.build.version.release` and `ro.build.version.sdk` in one shell call, as…"}], "retrieved": [{"id": "CHALLENGES#304", "heading": "304. No tool said which Android a device ran", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same baseline. Asked what version of Android the device runs, Haiku 5.5 answered twice that Mobium's tools have no way to read it, and once went through Settings to About; the stronger models went to Settings each time. `app_devices` gave an iOS device's runtime — `iOS 26.6.2` — and an Android one's model and navigation mode, and no version. **Fixed:** an Android device that is ready reports `Android 15 (API 35)`, from `ro.build.version.release` and `ro.build.version.sdk` in one shell call, as…", "gold": true}, {"id": "skills/mobile-check/SKILL.md#first-check-there-is-a-device", "heading": "First: check there is a device", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium devices # emulator-5554 device (android emulator, model: sdk_gphone64_arm64, Android 15 (API 35), navigation: gestures) ``` If nothing is listed, the user needs to start an emulator or simulator, or plug in a phone (Android with USB debugging on; an iPhone trusted and unlocked) — you cannot do it for them from mobium. Say so rather than retrying.", "gold": false}, {"id": "docs/guides/cli.md#1-which-devices", "heading": "1. Which devices", "path": "docs/guides/cli.md", "excerpt": "``` $ mobium --version mobium version 0.1.0-dev $ mobium devices emulator-5554 device (android emulator, model: sdk_gphone64_arm64, Android 15 (API 35), navigation: gestures) ``` (Trimmed: the Mac also listed its iOS simulators, shut down, and a phone.) To start one, `mobium boot <avd | simulator>` boots an Android emulator by its AVD's name, or an iOS simulator by its name or UDID, and answers once it has booted. With one device running, no command needs to be told which; with several, `--device <serial or udid>`…", "gold": false}, {"id": "docs/guides/inspector.md#quick-start-mobium-inspect", "heading": "Quick start: `mobium inspect`", "path": "docs/guides/inspector.md", "excerpt": "A page on your own machine with the device's screen in it: every element `map` finds outlined, the locator for the one you click, actions on it, a place to try a locator and see what it matches — and what you do, kept as a test `mobium test` runs. Everything below was run on 2026-09-29 against [MobiumApp](https://github.com/mobiumdev/mobium-app) on an Android 15 emulator; the output is what mobium printed. Before this guide: [the quick start](../quickstart/README.md), and MobiumApp installed.", "gold": false}, {"id": "docs/SETUP.md#setting-up-devices", "heading": "Setting up devices", "path": "docs/SETUP.md", "excerpt": "Everything Mobium needs on the machine and on the device, for all four kinds of target. Written from doing it: every trap below cost real time here, and most of them report something that names the wrong cause. **Run `mobium doctor` first.** It checks the whole list without needing a device, and exits non-zero if it found something: ``` ok adb Android Debug Bridge version 1.0.41 at /opt/homebrew/bin/adb note android sdk root ANDROID_SDK_ROOT is not set — only needed to start emulators, not to drive them note…", "gold": false}], "missed": false, "facts": ["app_devices reports a ready Android device's version as its runtime, such as Android 15 (API 35).", "It is read from ro.build.version.release and ro.build.version.sdk."], "concern": ""}, {"id": "q033", "kind": "fact", "question": "Why do dumpsys and user-rotation give different numbers for the same rotation?", "gold": [{"id": "CHALLENGES#48", "heading": "48. `dumpsys` reports rotation in degrees and `user-rotation` in quarters", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first rotation, which failed with `the display reported rotation \"90\"` — a message blaming the device for my own unit mismatch. `mCurrentRotation=ROTATION_90` is **degrees**. `settings get system user_rotation` and `cmd window user-rotation lock <n>` are **quarter turns**. Both are small integers, both are called \"rotation\", and reading one as the other accepts 0 and rejects everything else — so a portrait screen looks perfectly healthy and the very first rotation fails. `dumpsys window` makes it…"}], "retrieved": [{"id": "CHALLENGES#48", "heading": "48. `dumpsys` reports rotation in degrees and `user-rotation` in quarters", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first rotation, which failed with `the display reported rotation \"90\"` — a message blaming the device for my own unit mismatch. `mCurrentRotation=ROTATION_90` is **degrees**. `settings get system user_rotation` and `cmd window user-rotation lock <n>` are **quarter turns**. Both are small integers, both are called \"rotation\", and reading one as the other accepts 0 and rejects everything else — so a portrait screen looks perfectly healthy and the very first rotation fails. `dumpsys window` makes it…", "gold": true}, {"id": "CHALLENGES#59", "heading": "59. A route looked like it ignored `clear`, and the counter was the wrong signal", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** asserting that stopping a route stopped it. The app's fix counter read 24 while a route ran, then 26, then 32 after `location --clear` — still climbing at about one a second, exactly as though nothing had stopped. Nothing was wrong. `dumpsys` showed `gps provider [mock]` gone one second after the clear and still gone ten seconds later, so the route had stopped immediately. **The counter counts deliveries, not movement.** Android goes on handing a watching client the last known position after the…", "gold": false}, {"id": "CHALLENGES#56", "heading": "56. Clearing a mock location reported success and changed nothing visible", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running the tool once end to end. `location --clear` said the device would report its own position again, and the very next read still answered *\"from an injected fix\"*, with the same coordinates. Both statements were true, which is what made it a defect rather than a bug report. `cmd location providers remove-test-provider gps` does remove the provider — **and Android keeps the last known location it supplied.** `dumpsys` goes on reporting that fix, still tagged `mock`, from a provider that no…", "gold": false}, {"id": "CHALLENGES#25", "heading": "25. The dump backend cannot read a screen that never goes idle", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** chasing defect 22, then checking rather than assuming. `uiautomator dump` waits for the screen to stop changing before it snapshots. The About page on a Pixel 7 shows an uptime counter, so it never does: reproduced three times out of three, with no UiAutomator2 instrumentation running, `ERROR: could not get idle state.` and no file. The `uiautomator` backend cannot read that screen at all. UiAutomator2 reads it — not because it does not wait for idle, as was written here, but because a counter that…", "gold": false}, {"id": "CHALLENGES#38", "heading": "38. `uiautomator dump`'s reason was discarded, so the failure said \"no output\"", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** driving Settings > About through the reference driver. The reference driver read only stdout. `uiautomator dump` puts \"killed\" on stdout and `ERROR: could not get idle state.` on **stderr**, exits 0, and writes no file — so the driver reported `uiautomator dump produced no file: no output`, which names the symptom and hides the cause. The screen was unreadable because the About page's uptime counter ticks every second and the dump mechanism waits for idle; that is defect 25, reproduced independently…", "gold": false}], "missed": false, "facts": ["dumpsys's mCurrentRotation reports rotation in degrees, such as ROTATION_90.", "user_rotation and cmd window user-rotation use quarter turns, so 90 degrees is 1."], "concern": ""}, {"id": "q034", "kind": "fact", "question": "If I set an app's language to zz-ZZ and Mobium confirms it, does the app have that translation?", "gold": [{"id": "CHALLENGES#49", "heading": "49. Android stores a language the app cannot speak, and says nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** probing `cmd locale set-app-locales` before building on it. `cmd locale set-app-locales <pkg> --locales zz-ZZ` is accepted, stored, and reads back as `[zz-ZZ]`. The app then renders in its default language. Android exposes nothing that distinguishes \"pinned to a language it has\" from \"pinned to a language it does not\", so **reading the setting back confirms the device stored the tag and nothing more** — the exact shape of `pm grant` ([26](#26-pm-grant-succeeds-loudly-at-doing-nothing)) with the…"}], "retrieved": [{"id": "CHALLENGES#49", "heading": "49. Android stores a language the app cannot speak, and says nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** probing `cmd locale set-app-locales` before building on it. `cmd locale set-app-locales <pkg> --locales zz-ZZ` is accepted, stored, and reads back as `[zz-ZZ]`. The app then renders in its default language. Android exposes nothing that distinguishes \"pinned to a language it has\" from \"pinned to a language it does not\", so **reading the setting back confirms the device stored the tag and nothing more** — the exact shape of `pm grant` ([26](#26-pm-grant-succeeds-loudly-at-doing-nothing)) with the…", "gold": true}, {"id": "skills/mobile-check/SKILL.md#device-state", "heading": "Device state", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium orientation # which way, and is it pinned? mobium orientation landscape # turn it and pin it mobium orientation auto # follow the sensor again mobium locale org.wikipedia ja-JP # run one app in Japanese mobium locale org.wikipedia \"\" # back to the device language ``` Both invalidate the refs from the last `map` — a rotation re-lays out every screen and a language change re-renders it, so map again before acting. Two honest limits worth knowing, because neither platform will tell you: - **An activity…", "gold": false}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "view, and the check says it did not run when it is not). Driving Settings, the other way, would have moved a phone owner's clock. Per-app locale is done (2026-09-30): iOS stores no per-app language that can be set from outside, so `app_locale` keeps it for the session and every launch passes it as `-AppleLanguages (xx) -AppleLocale xx_YY`; a running app is launched again in it at once. Settings, pinned to ja-JP, read 一般 for General on a simulator and on the iPhone, on the pin's relaunch and on a later launch, and…", "gold": false}, {"id": "CHALLENGES#76", "heading": "76. The fix for 71 hid system dialogs from `map`", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp on the iPhone, the same day. The app's location prompt was on screen and `alert` reported it word for word — and `map` listed only the app underneath: Back, the two drafts, \"Ask for location\". Tapping \"Allow While Using App\" answered \"no element matches\". `current` said `dev.mobium.mobiumapp`. It was 71's hint, still in force. `defaultActiveApplication` had been set to MobiumApp by the launch and never taken off, so WebDriverAgent went on reading MobiumApp — and a system dialog is not the…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#verifying-your-work", "heading": "Verifying your work", "path": "skills/mobile-check/SKILL.md", "excerpt": "A command reporting success is not evidence the app did anything. After an action that should change the screen, confirm it: ```sh mobium tap @e5 && mobium map # did the screen change as expected? mobium screenshot -o after.png # look at it when the map is ambiguous ```", "gold": false}], "missed": false, "facts": ["No. Mobium's confirmation only means the device stored the language tag.", "Android accepts a tag like zz-ZZ and the app renders in its default language, and nothing reports whether the app has that translation."], "concern": ""}, {"id": "q035", "kind": "fact", "question": "Why is press-tap refused on Android 16 and later?", "gold": [{"id": "CHALLENGES#86", "heading": "86. On Android 16 and later, one press-tap breaks injected touch for the whole device", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the gesture check on a Pixel 8 Pro (Android 17), where press-tap failed with UiAutomator2's \"Unable to perform W3C actions\" — and then so did everything after it, plain taps included, and `adb shell input tap` too. UiAutomator2 (10.6.6, the newest release) stamps each event with the down time of the finger that produced it (`startTimestamp + event.startDelta`, the chain's own `pointerDown`). Android's contract is one down time per gesture, the first finger's. Android 17 verifies injected input: it…"}], "retrieved": [{"id": "CHALLENGES#86", "heading": "86. On Android 16 and later, one press-tap breaks injected touch for the whole device", "path": "docs/CHALLENGES.md", "excerpt": "The same failure on an Android 17 AVD; none on the Android 15 AVD, which does not verify. No chain shape avoids it, because a late finger's down time is its own by construction in the server. So UiAutomator2 refuses press-tap and press-drag above API 35, naming the reason; Android 16 (API 36) is refused unmeasured, because a wrong guess costs the device's touch input rather than one gesture. The check reads the API level and asserts the gesture or the refusal accordingly. Multi-finger taps land together and are…", "gold": true}, {"id": "docs/GESTURES.md#the-chart", "heading": "The chart", "path": "docs/GESTURES.md", "excerpt": "| **Two-, three-finger tap** | `tap --fingers N` | Multi-Touch — each finger's landing, lifting and travel | yes | yes | | **Press and tap** | `press-tap` | Multi-Touch | Android 15: yes. 16 and later: **refused** | **refused** — see below | | **Press and drag** | `press-drag` | Multi-Touch | Android 15: yes. 16 and later: **refused** | **refused** | | **Swipe an element** (a list row's swipe actions) | `swipe @e5 left` | none in MobiumApp: NetNewsWire's article rows, `docs/checks/netnewswire-ios.sh`, not…", "gold": false}, {"id": "docs/ROADMAP.md#next", "heading": "Next", "path": "docs/ROADMAP.md", "excerpt": "on all three Android devices (mobium-app #12). Done the same day for Mobium: `press back` says what back did, `--gesture` swipes back and is refused with button navigation, `devices` names the mode, the iOS refusal names the gesture, and `docs/checks/back.sh` holds it on both phones, both AVDs and the simulator. Predictive back measured 2026-10-02: with it turned on, React Native 0.86 keeps `BackHandler` on Android 16 and later and loses it on 15 and earlier, where every back closed MobiumApp — and Mobium's `press…", "gold": false}, {"id": "CHALLENGES#225", "heading": "225. Behind an Android menu, the refusal named everything but back", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the Pixel 8 Pro, carrying CHALLENGES 221 over to Android. An Android popup menu — the Clock's overflow menu — is a window of its own, as a dialog is, so a tap behind it is refused as \"a dialog is over the app\", which is right. Its remedy said to tap one of the dialog's buttons or declare an answer with `app_dialogs`, and `app_alert dismiss` refused, there being no button for it to press. A menu's items are actions: tapping one is not closing the menu. Back closes it, and closes a dialog that can be…", "gold": false}], "missed": false, "facts": ["UiAutomator2 gives a late finger its own down time, and Android 17 rejects the rest of the gesture, including the lifts.", "The device then rejects every injected touch until a two-finger tap clears it.", "So press-tap and press-drag are refused above API 35; Android 16 is refused unmeasured because a wrong guess costs the device's touch input."], "concern": ""}, {"id": "q036", "kind": "fact", "question": "Can I use press-tap on iOS?", "gold": [{"id": "CHALLENGES#85", "heading": "85. WebDriverAgent touches a late finger's target before the gesture", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the same pad on the iPhone 17 Pro simulator, whose event log read `down 0@0, down 1@0, up 1@0, down 1@300, up 1@384, up 0@517` for a press-tap. The real timeline is right; in front of it is a zero-length touch at the second finger's target, at time zero. WebDriverAgent turns a chain's first move into the touch itself (`initForTouchAtPoint`), and a chain that started with a move and then waited first arrived as three fingers — so the second finger now pauses until its moment. That removed the extra…"}], "retrieved": [{"id": "CHALLENGES#149", "heading": "149. `double-tap` reached a React Native control on iOS as one press", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a person, as the control ROADMAP had asked for: Lana double-tapped MobiumApp's Press target on the iPhone 15 Plus and it counted two presses 200ms apart, where `double-tap` on the same target counted one. Mobium used WebDriverAgent's own double-tap endpoint, Apple's primitive, and a React Native `Pressable` reports that as one press — which 70 had taken for the Pressable coalescing any double tap. The W3C chain Android uses could not replace it: WebDriverAgent drops a pause while the pointer is up,…", "gold": false}, {"id": "docs/GESTURES.md#the-chart", "heading": "The chart", "path": "docs/GESTURES.md", "excerpt": "| **Two-, three-finger tap** | `tap --fingers N` | Multi-Touch — each finger's landing, lifting and travel | yes | yes | | **Press and tap** | `press-tap` | Multi-Touch | Android 15: yes. 16 and later: **refused** | **refused** — see below | | **Press and drag** | `press-drag` | Multi-Touch | Android 15: yes. 16 and later: **refused** | **refused** | | **Swipe an element** (a list row's swipe actions) | `swipe @e5 left` | none in MobiumApp: NetNewsWire's article rows, `docs/checks/netnewswire-ios.sh`, not…", "gold": false}, {"id": "CHALLENGES#70", "heading": "70. iOS has no witness for a double tap at all", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** trying every one available, after 67
