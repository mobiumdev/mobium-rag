nload the test file instead. ⟦download the test file⟧"], "concern": "", "check": "Claude's reading: codegen.unsupported returns an unsupported error \"step N (...) cannot be written as code\" with the remedy \"download the recording as a test file and run it with mobium test\", matching the doc. Note the code also refuses an expect or soft step (codegen.go:52), which the doc does not mention but the inspector records waits, not expects. Verified in: internal/codegen/codegen.go:67, internal/codegen/codegen.go:77, internal/codegen/codegen.go:104."}, {"id": "g044", "kind": "fact", "question": "In a list where every row has its own More button, why does the inspector record my tap on one of them with a `within` locator instead of the path that map showed for that button?", "tags": ["rationale", "test-author", "new since 7b590a4"], "gold": [{"id": "docs/guides/inspector.md#4-record-a-test", "heading": "4. Record a test", "path": "docs/guides/inspector.md", "excerpt": "A test starts from a freshly launched app, so a recording should too: **Start from a fresh app** stops the app in front and launches it again, as `mobium test` does before each test, and starts recording. From there, every action is a step. Recorded on the Login Demo: ```json { \"app\": \"dev.mobium.mobiumapp\", \"description\": \"Recorded with mobium inspect.\", \"tests\": [ { \"name\": \"recorded\", \"steps\": [ {\"tap\": \"text=Logi…"}], "retrieved": [{"id": "docs/guides/inspector.md#4-record-a-test", "heading": "4. Record a test", "path": "docs/guides/inspector.md", "excerpt": "A test starts from a freshly launched app, so a recording should too: **Start from a fresh app** stops the app in front and launches it again, as `mobium test` does before each test, and starts recording. From there, every action is a step. Recorded on the Login Demo: ```json { \"app\": \"dev.mobium.mobiumapp\", \"description\": \"Recorded with mobium inspect.\", \"tests\": [ { \"name\": \"recorded\", \"steps\": [ {\"tap\": \"text=Logi…", "gold": true}, {"id": "CHALLENGES#356", "heading": "356. A recorded look-alike was named by its path, which the next row moves", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** building the recording as code (ROADMAP, \"A recording as code\", item 4) and recording a tap on MobiumApp's Table Demo, where every row has a More and a Delete. `map` names a look-alike by `path=` when nothing else names it alone — Item 2's More was `path=0/0/0/0/0/0/4/0/8` — and the recorder kept whatever `map` gave, so the test held the More's place in the tree. A path is the element's index under each…", "gold": false}, {"id": "CHALLENGES#307", "heading": "307. A scoped locator found the switch in the row beside it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first run on a device of `within`, which scopes a locator to a row — `label=More within text=Card 8`, the More in Card 8's row. The rule keeps, of the target's matches, the one nearest the anchor, climbing from the anchor and stopping at the list, so a row without the target finds nothing rather than its neighbor's. The tests passed on lists built for them, each marked `scrollable=\"true\"`. On the An…", "gold": false}, {"id": "CHALLENGES#236", "heading": "236. A checkmark mapped as a target of its own, under its image's name", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** Pocket Casts' onboarding, on the simulator and the iPhone. Its \"Receive Notifications\" row is a button the app labeled whole, and inside it one button iOS calls not accessible draws the checkmark. `map` listed both, the checkmark as `discover_tick (button)` — the name of the image it draws, since the app gave it none — because the rule that put Ice Cubes' Reply, Boost, Favorite and Share in `map` (214) …", "gold": false}, {"id": "docs/guides/inspector.md#2-find-the-locator-for-anything", "heading": "2. Find the locator for anything", "path": "docs/guides/inspector.md", "excerpt": "![The inspector on MobiumApp's Login Demo: the username field selected, its locator testid=username, its role, ref and bounds, and both buttons outlined in orange for role=button](images/inspector.jpg) Click an element on the screen, or in the list under it. The panel says what `map` says of it — label, role, ref, bounds, checked state — and, at the top, **the locator a test should use**: the one `map` derived as the…", "gold": false}], "missed": false, "facts": ["A path (and a ref) names the element on this screen only: a ref lasts one map, and a path moves whenever the list adds or reuses a row, so a replay would tap another row's button or none. ⟦adds or reuses a row⟧", "The recorder tries the element's name within the nearest element with a locator or within a text on the screen, then its place among the look-alikes with nth=, keeping a candidate only if find shows it names that element alone. ⟦among the look-alikes⟧"], "concern": "", "check": "Claude's reading: inspector.md section 4 explains the scoping and why; CHALLENGES 356 tells the same story as a defect but is not needed for the answer, so it is left out of gold (a retriever may bring it back, which is fine). New since the pin (#261). Verified in: internal/inspect/inspect.go:308, internal/inspect/inspect.go:347, internal/inspect/inspect.go:364."}, {"id": "g045", "kind": "fact", "question": "I want one sign-in test to run with several different bad passwords and show up as separate results. How do I write that in a .test.json file?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/guides/test-runner.md#9-one-test-over-several-cases-each", "heading": "9. One test over several cases: `each`", "path": "docs/guides/test-runner.md", "excerpt": "A test with `\"each\"` runs once per case, as a test of its own. `${key}` in any string of its steps is that case's value; a string that is nothing but `${key}` keeps the value's type, so a count stays a number. `$${` writes a literal `${`. ```json {\"name\": \"a bad sign-in is refused, and says why: ${why}\", \"each\": [ {\"why\": \"a wrong password\", \"pass\": \"wrongpass1\", \"error\": \"loginError\"}, {\"why\": \"a short password\", \"p…"}], "retrieved": [{"id": "docs/guides/test-runner.md#9-one-test-over-several-cases-each", "heading": "9. One test over several cases: `each`", "path": "docs/guides/test-runner.md", "excerpt": "A test with `\"each\"` runs once per case, as a test of its own. `${key}` in any string of its steps is that case's value; a string that is nothing but `${key}` keeps the value's type, so a count stays a number. `$${` writes a literal `${`. ```json {\"name\": \"a bad sign-in is refused, and says why: ${why}\", \"each\": [ {\"why\": \"a wrong password\", \"pass\": \"wrongpass1\", \"error\": \"loginError\"}, {\"why\": \"a short password\", \"p…", "gold": true}, {"id": "docs/guides/test-runner.md#1-a-config-and-a-test-file", "heading": "1. A config and a test file", "path": "docs/guides/test-runner.md", "excerpt": "``` login-tests/ mobium.config.json tests/ login.test.json ``` `mobium.config.json` says where the tests are and which devices they run on. A **project** is a device to run on: ```json { \"testDir\": \"tests\", \"projects\": [ {\"name\": \"android\", \"device\": \"emulator-5554\"} ] } ``` `tests/login.test.json` is two tests of MobiumApp's Login Demo. Each step is exactly what [`app_batch`](../API.md) takes — a tool and its argume…", "gold": false}, {"id": "docs/guides/test-runner.md#writing-tests", "heading": "Writing tests", "path": "docs/guides/test-runner.md", "excerpt": "- **Find targets with `map` first.** `mobium map` on the screen you are testing gives each element's locator; `testid=` is the one that survives a translation and a redesign. - **Assert with `app_wait_for`**, never a sleep. `--for` in the CLI is `condition` in a step: `visible`, `hidden`, `text` (with `exact`), `value`, `enabled`, `disabled`, `checked`, `unchecked`, `selected`, `unselected`, `focused`, `count`, and `…", "gold": false}, {"id": "docs/guides/test-runner.md#2-run-it", "heading": "2. Run it", "path": "docs/guides/test-runner.md", "excerpt": "From the directory with the config: ``` $ mobium test ok [android] login.test.json › a wrong password is refused (7.7s) ok [android] login.test.json › the demo account signs in (7.8s) 2 passed (15.5s) ``` Exit status 0. Nothing in the test sleeps: every action waits for its own target ([auto-wait](autowait.md)), and every assertion retries until it holds or its timeout — ten seconds unless the step says otherwise.", "gold": false}, {"id": "docs/guides/test-runner.md#3-a-failure-and-what-it-leaves", "heading": "3. A failure, and what it leaves", "path": "docs/guides/test-runner.md", "excerpt": "Change the first test to expect a message the app never shows — `\"text\": \"Wrong password.\"`, with `\"timeout_ms\": 3000` — and run just that test, with all three reports: ``` $ mobium test -g \"wrong password\" --reporter list,junit,html FAIL [android] login.test.json › a wrong password is refused (9.5s) step 4 (app_wait_for): [timeout] step 4 of 4 (app_wait_for) failed: timed out after 3.012s waiting for testid=loginErr…", "gold": false}], "missed": false, "facts": ["Give the test an \"each\" array of cases; ${key} in any string of its steps is that case's value, and each case runs as a test of its own. ⟦\"each\" ; ${key}⟧", "Without a ${key} in the test's name the cases are numbered [1], [2] rather than named after values that may be a password. ⟦[1]⟧", "Each case starts over: the app is stopped and launched and beforeEach runs again. ⟦starts over⟧"], "concern": "", "check": "Claude's reading: expandEach in file.go makes one test per case, names unnamed cases \"<name> [i]\", keeps a lone ${key}'s type, and refuses a missing key, all as test-runner.md section 9 says. Verified in: internal/testrun/file.go:44, internal/testrun/file.go:539, internal/testrun/file.go:560, internal/testrun/file.go:598."}, {"id": "g046", "kind": "multi", "question": "Our mobium.config.json tak : false}, {"id": "docs/guides/grid.md#4-tests-on-a-grid", "heading": "4. Tests on a grid", "path": "docs/guides/grid.md", "excerpt": "`mobium test` goes through a grid the same way. A project that names no device asks for one by `platform`, and with `MOBIUM_GRID` set each project gets a connection of its own, which leases a device before any test runs and releases it when the run ends: ```json { \"testDir\": \"tests\", \"projects\": [ {\"name\": \"android-a\", \"platform\": \"android\"}, {\"name\": \"android-b\", \"platform\": \"android\"} ] } ``` ``` $ MOBIUM_GRID=loca…", "gold": false}, {"id": "docs/guides/test-runner.md#5-retries-and-flaky", "heading": "5. Retries, and flaky", "path": "docs/guides/test-runner.md", "excerpt": "`--retries N` runs a failed test again, from a fresh app, up to N times. A test that fails and then passes is **flaky**: the run passes, and it says so. This is the runner's own control for it, from `tests/controls/` in this repository — it saves a counter, and passes only once the counter reaches 2, which the retry's relaunch makes it do. It counts from cleared app data, so clear it first — a counter left at 2 by an…", "gold": true}], "missed": false, "facts": ["Run mobium test --reporter list,junit,html; the JUnit file is mobium-report/junit.xml, for the CI's test report. ⟦mobium-report/junit.xml⟧", "With --retries, a test that fails then passes is flaky; in JUnit it is a pass with a flaky property. ⟦pass with a flaky property⟧", "The exit status is 0 when every test passed or was flaky. ⟦0 when every test passed or was flaky⟧"], "concern": "", "check": "Claude's reading: WriteJUnit writes junit.xml with a `flaky` property \"passed on attempt N\" and the command fails only when a test failed; section 7 has the command and path, section 5 the flaky-in-JUnit rule. Verified in: internal/testrun/report.go:137, internal/testrun/report.go:169, cmd/mobium/test.go:228."}, {"id": "g048", "kind": "fact", "question": "I only want step-by-step screens , "player.vibium.dev opens it. ⟦player.vibium.dev⟧"], "concern": "test-runner.md 'A trace' says \"Each attempt is also kept as a recording\", but run.go:477-487 keeps only the attempt reported (a flaky test's first failure, a failed test's last attempt, a pass) and pruneTraces deletes the other attempts' trace directories.", "check": "Claude's reading: the flag, the path and the player match the code. A reviewer should look at the concern: the doc says each attempt is kept, the code keeps one. Verified in: cmd/mobium/test.go:103, internal/testrun/run.go:477, internal/testrun/run.go:509, internal/testrun/run.go:513."}, {"id": "g049", "kind": "fact", "question": "If I attach the trace zip from a sign-in test to a bug report, will the username and password I typed be readable in it?", "tags": ["behavior", "test-author"], "gold": [{"id": "CHALLENGES#327", "heading": "327. A trace held an expect as a bare read, and said typed text was not in it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** turning a `mobium test` trace back into a test, one step per traced call, and running both on MobiumApp builds with a deliberate bug each (the round-trip probe, mobiumdev/mobium-roundtrip), on the Android 15 emulator. The generated suite caught every bug the original did but lost one (bug, test) cell: \"the app is in front throughout\" is two `expect`s, and a trace kept each as the read it made — `app_sta…"}], "retrieved": [{"id": "CHALLENGES#327", "heading": "327. A trace held an expect as a bare read, and said typed text was not in it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** turning a `mobium test` trace back into a test, one step per traced call, and running both on MobiumApp builds with a deliberate bug each (the round-trip probe, mobiumdev/mobium-roundtrip), on the Android 15 emulator. The generated suite caught every bug the original did but lost one (bug, test) cell: \"the app is in front throughout\" is two `expect`s, and a trace kept each as the read it made — `app_sta…", "gold": true}, {"id": "docs/guides/test-runner.md#a-trace", "heading": "A trace", "path": "docs/guides/test-runner.md", "excerpt": "`--trace on` keeps a screenshot and the map after every step, and the HTML report shows them as a filmstrip; `--trace retain-on-failure` keeps them only for a test that failed. `trace` in the config sets the default. Each attempt is also kept as a recording in Vibium's record format, at `mobium-report/artifacts/trace/<project>-<file>-<test>-<attempt>/trace.zip`, which the report links and [player.vibium.dev](https://…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "CHALLENGES#55", "heading": "55. Text entry failed on a field `map` had just handed out a ref for", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first React Native app this project has driven. Every prior Android app was Google's, Wikipedia's, F-Droid's or Aegis's, and every one of them reports a resource-id in the fully qualified form `com.example:id/name`. React Native reports a bare one. A `testID` of `password` arrives as `resource-id=\"password\"`, with no package. `map` handled it correctly — the node, the label, the `role=password` and …", "gold": false}, {"id": "CHALLENGES#43", "heading": "43. `map` printed a password in plaintext", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the second and third real third-party apps. Typing into Aegis's master-password field and running `map` again gave: ``` @e2 Sup3rSecret! (input) ``` Android marks the node `password=\"true\"` **and** puts the typed value straight into its `text` attribute. Mobium parsed that flag into `Node.Password` and consulted it nowhere — the same shape as [defect 39](#39-a-visibility-field-that-nothing-consulted), f…", "gold": false}], "missed": false, "facts": ["A password is not recorded, only its length. ⟦only its length⟧", "Other typed text, such as the username, is in the trace: in the call's result and the screen after it. ⟦in the call's result⟧"], "concern": "", "check": "Claude's reading: only CHALLENGES 327 (its second part) states the corrected rule in the corpus; the CLI help and app_trace schema say the same, but neither is in the corpus. checks/README's trace.sh row adds that a typed password appears nowhere in the zip but does not cover other text. Verified in: cmd/mobium/trace.go:20, internal/agent/schema.go:882."}, {"id": "g050", "kind": "fact", "question": "My app polls a server in the background forever, and I launched it with --gray-box. What happens when I tap something?", "tags": ["behavior", "test-author"], "gold": [{"id": "docs/guides/graybox.md#what-an-action-does", "heading": "What an action does", "path": "docs/guides/graybox.md", "excerpt": "Before an action finds its target, it waits until the app has nothing in flight. The result says what it waited for (the iPhone): ``` $ mobium tap testid=busyQuiet tapped testid=busyQuiet at (645, 1011) gray box: waited 35 ms for the app to go idle $ mobium tap testid=busyRowB tapped testid=busyRowB at (645, 1218) gray box: waited 1018 ms for the app to go idle (busy: quiet) $ mobium text testid=busyOutcome row B, ge…"}], "retrieved": [{"id": "docs/guides/graybox.md#what-an-action-does", "heading": "What an action does", "path": "docs/guides/graybox.md", "excerpt": "Before an action finds its target, it waits until the app has nothing in flight. The result says what it waited for (the iPhone): ``` $ mobium tap testid=busyQuie rrent); GrayBox.register('signIn', username => { setLogge…", "gold": false}, {"id": "docs/guides/graybox-tutorial.md#4-turning-the-gray-box-on", "heading": "4. Turning the gray box on", "path": "docs/guides/graybox-tutorial.md", "excerpt": "One key in the test file, beside `app`: ```json { \"app\": \"dev.mobium.mobiumapp\", \"grayBox\": true, \"beforeEach\": [ ``` Each test's launch now turns the library on, and every step waits for the app to say it is idle before finding its target: ``` $ mobium test ok [android · emulator-5554] busy.test.json › a row tapped after a quiet refresh is current (1) (7s) ok [android · emulator-5554] busy.test.json › a row tapped a…", "gold": false}], "missed": false, "facts": ["After 10 seconds the action is refused as a timeout that failed check idle, naming what the app said kept it busy. ⟦after 10 seconds ; failed check idle⟧", "The remedy is to launch the app again without the gray box, to act on the screen as it is. ⟦without --gray-box / without gray_box⟧"], "concern": "", "check": "Claude's reading: grayBoxIdleLimit is 10 s in agent/graybox.go, and the refusal text in the guide's example ends \"launch the app again without gray_box\". Verified in: internal/agent/graybox.go:28."}, {"id": "g051", "kind": "fact", "question": "My mobium test suite runs on a Fire TV over Wi-Fi whose adb link keeps dropping for a few seconds. What does the runner do with a step when the link goes?", "tags": ["behavior", "test-author"], "gold": [{"id": "docs/guides/test-runner.md#a-device-that-drops-off-and-comes-back", "heading": "A device that drops off and comes back", "path": "docs/guides/test-runner.md", "excerpt": "A retry starts the test over. A device whose link drops for a few seconds — a TV or a phone over Wi-Fi — is waited out within the test instead: a step whose call **never reached the device** is made again once it is back, for up to 90 seconds and never past the test's own time. A device reached by `adb connect` is connected again for you. Only that failure is waited out, and an error says which it was (`details.reach…"}], "retrieved": [{"id": "CHALLENGES#210", "heading": "210. A dropped link was reported as a failed install, with advice that could not work", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** running scenarios on a Fire TV over Wi-Fi, whose link drops every few minutes. A `map` called while it was down answered \"installing UiAutomator2 server\", then failed with `install server.apk: … adb: device offline` and advised `--driver uiautomator` — on a TV that had the pinned server installed, version 10.6.6, the whole time. Asking whether the server is installed treated a failed `dumpsys` or `pm li…", "gold": false}, {"id": "docs/SETUP.md#over-wi-fi", "heading": "Over Wi-Fi", "path": "docs/SETUP.md", "excerpt": "Android 11+. The phone and the Mac must be on the same network. 1. **Developer options → Wireless debugging → on.** 2. **\"Pair device with pairing code\"** — it shows an address and a six-digit code. Both expire in about a minute. 3. Find the address without reading it off the screen: ```sh adb mdns services # adb-3C19...-FIOvFv _adb-tls-pairing._tcp 10.0.0.96:33169 # adb-3C19...-FIOvFv _adb-tls-connect._tcp 10.0.0.96…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "docs/guides/test-runner.md#a-device-that-drops-off-and-comes-back", "heading": "A device that drops off and comes back", "path": "docs/guides/test-runner.md", "excerpt": "A retry starts the test over. A device whose link drops for a few seconds — a TV or a phone over Wi-Fi — is waited out within the test instead: a step whose call **never reached the device** is made again once it is back, for up to 90 seconds and never past the test's own time. A device reached by `adb connect` is connected again for you. Only that failure is waited out, and an error says which it was (`details.reach…", "gold": true}, {"id": "docs/SHUTDOWN.md#a-tv-or-anything-reached-by-adb-connect", "heading": "A TV, or anything reached by `adb connect`", "path": "docs/SHUTDOWN.md", "excerpt": "A Fire TV is reached over Wi-Fi with `adb connect <tv>:5555`, after ADB debugging is turned on in its Developer Options. It is somebody's living-room TV, so the device checks above run on it as on a phone, and four more run on every device: - **A screen mirror's server.** scrcpy was how the TV was watched while it was measured, and its server streams the screen off the device for as long as it runs. On the device it …", "gold": false}], "missed": false, "facts": ["A step whose call never reached the device is made again once the device is back, for up to 90 seconds and never past the test's own time; a device reached by adb connect is connected again. ⟦90 seconds ; connected again⟧", "A failure from a call that may have reached the device fails the step as before, because making it again could press twice. ⟦press twice⟧"], "concern": "", "check": "Claude's reading: callReaching retries only device.Unreached errors, every 2 s, until linkWait (90 s) or the test's deadline, as the section says. Verified in: internal/testrun/run.go:800, internal/testrun/run.go:807."}, {"id": "g052", "kind": "fact", "question": "I changed some Go code in Mobium and ran make build, but the CLI still behaves exactly as before my change. What am I missing?", "tags": ["troubleshooting", "contributor"], "gold": [{"id": "docs/DEVELOPMENT.md#3-run-what-ci-runs", "heading": "3. Run what CI runs", "path": "docs/DEV  "208. Every read silenced the device's screen reader", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading Prime Video on a Fire TV, which publishes nothing but one surface to `map`, to see whether it publishes more while Amazon's screen reader, VoiceView, is on. Every read of the screen — `uiautomator dump` and the UiAutomator2 server alike — unbound VoiceView for as long as it ran: `dumpsys accessibility` listed it before the read and not during it, and touch exploration went off. Android's test-au…", "gold": false}], "missed": false, "facts": ["No for the network: a test run ends each project's session, and the end of a session puts the network back as the session found it (airplane mode off, no shaping). ⟦as the session found it⟧", "No for TalkBack: the screen_reader setting is put back when the session ends, both keys restored exactly, and accessibility_enabled put back again once TalkBack has gone. ⟦put back when the session ends ; accessibility_enabled⟧"], "concern": "", "check": "Claude's reading: network.md section 4 covers the network restore and ACCESSIBILITY.md step 5 the TalkBack undo; code restores both at session end (restoreNetwork, restoreAccessibility). network.md still recommends a beforeEach reset to keep one test's network from reaching the next within a run. Verified in: internal/agent/network.go:295, internal/agent/accessibility.go:134, internal/device/axsettings.go:716, internal/device/axsettings.go:736."}, {"id": "g078", "kind": "multi", "question": "On Android I want every run to see my app's notification permission prompt again — even after someone tapped Don't allow twice — and have the test answer it with Allow. Which Mobium commands do that?", "tags": ["how-to", "test-author"], "gold": [{"id": "skills/mobile-check/SKILL.md#permissions", "heading": "Permissions", "path": "skills/mobile-check/SKILL.md", "excerpt": "A first-launch permission dialog will stop a flow dead. Grant before you start rather than trying to tap through question": "How do I install Mobium's agent skill into my coding agent?", "tags": ["how-to", "agent-builder"], "gold": [{"id": "README.md#front-doors", "heading": "Front doors", "path": "README.md", "excerpt": "The CLI does not implement behavior. It calls the same tools an MCP client calls, so the surfaces cannot drift: ```mermaid flowchart LR cli[\"CLI\"] --> daemon clients[\"Python · JS · Go · Java · .NET\"] --> pipe[\"mobium pipe\"] --> daemon mcp[\"MCP client\"] --> mcpcmd[\"mobium mcp\"] daemon[\"daemon<br/>sessions, @refs\"] --> agent mcpcmd --> agent[\"internal/agent<br/>every tool, written once\"] agent --> driver[\"internal/mobi…"}], "retrieved": [{"id": "docs/quickstart/mcp.md#2-connect-an-agent", "heading": "2. Connect an agent", "path": "docs/quickstart/mcp.md", "excerpt": "`mobium mcp` is an MCP server on stdio, so there is nothing to install beyond `mobium` itself. Register it with your agent — in Claude Code: ```sh claude mcp add mobium -- mobium mcp ``` Other clients take the same command in their `mcpServers` configuration; [the MCP guide](../guides/mcp.md#1-connect-it) has the JSON. From then on, ask the agent for what you want done on the device, and it calls the tools below itse…", "gold": false}, {"id": "README.md#front-doors", "heading": "Front doors", "path": "README.md", "excerpt": "The CLI does not implement behavior. It calls the same tools an MCP client calls, so the surfaces cannot drift: ```mermaid flowchart LR cli[\"CLI\"] --> daemon clients[\"Python · JS · Go · Java · .NET\"] --> pipe[\"mobium pipe\"] --> daemon mcp[\"MCP client\"] --> mcpcmd[\"mobium mcp\"] daemon[\"daemon<br/>sessions, @refs\"] --> agent mcpcmd --> agent[\"internal/agent<br/>every tool, written once\"] agent --> driver[\"internal/mobi…", "gold": true}, {"id": "docs/guides/mcp.md#2-an-agent-at-work", "heading": "2. An agent at work", "path": "docs/guides/mcp.md", "excerpt": "Claude Code, non-interactively, with Mobium's server and nothing else allowed: ```sh claude - ow do I make sure the device session is ended even when my script raises an exception partway?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/quickstart/python.md#notes", "heading": "Notes", "path": "docs/quickstart/python.md", "excerpt": "- `with start(...) as device:` quits when the block ends, even on an exception. Without `with`, call `device.quit()` yourself — in a `finally`. - `connect()` still exists: it opens a connection without touching the device, and its `close()` leaves the session open for whoever started it. - With more than one device of the session's platform running — two Android devices, or two among the booted simulators and attache…"}], "retrieved": [{"id": "docs/quickstart/python.md#notes", "heading": "Notes", "path": "docs/quickstart/python.md", "excerpt": "- `with start(...) as device:` quits when the block ends, even on an exception. Without `with`, call `device.quit()` yourself — in a `finally`. - `connect()` still exists: it opens a connection without touching the device, and its `close()` leaves the session open for whoever started it. - With more than one device of the session's platform running — two Android devices, or two among the booted simulators and attache…", "gold": true}, {"id": "docs/SHUTDOWN.md#a-clients-sessions-end-with-it", "heading": "A client's sessions end with it", "path": "docs/SHUTDOWN.md", "excerpt": "A session a client opened with `start()` ends when the client goes, whether it called `quit()`, returned without it, crashed or was killed: `mobium pipe` ends the sessions its client started, and only those. `close()` is the way to leave one open on purpose. So a test run that dies half-way no longer leaves a device session behind for the next one to trip over (defect 130). A pipe still running after its client is re…", "gold": false}, {"id": "CHALLENGES#130", "heading": "130. A client that went away left its session open", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** reading what happens to a se evice.py:211."}, {"id": "g092", "kind": "fact", "question": "The .NET client is not on NuGet yet. How do I add it to my project?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/quickstart/dotnet.md#2-install-the-client", "heading": "2. Install the client", "path": "docs/quickstart/dotnet.md", "excerpt": "Not on NuGet yet. Until the first release it installs from a local package built from a clone; after it, `dotnet add package Mobium` needs nothing else. ```sh git clone https://github.com/mobiumdev/mobium.git ~/mobium dotnet pack ~/mobium/clients/dotnet/Mobium -o ~/mobium-packages dotnet new console -o quickstart && cd quickstart dotnet add package Mobium --version 0.1.0 --source ~/mobium-packages ```"}], "retrieved": [{"id": "docs/quickstart/dotnet.md#2-install-the-client", "heading": "2. Install the client", "path": "docs/quickstart/dotnet.md", "excerpt": "Not on NuGet yet. Until the first release it installs from a local package built from a clone; after it, `dotnet add package Mobium` needs nothing else. ```sh git clone https://github.com/mobiumdev/mobium.git ~/mobium dotnet pack ~/mobium/clients/dotnet/Mobium -o ~/mobium-packages dotnet new console -o quickstart && cd quickstart dotnet add package Mobium --version 0.1.0 --source ~/mobium-packages ```", "gold": true}, {"id": "CHALLENGES#150", "heading": "150. The .NET package could not be built from a clone", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** following the quick start on a fresh Linux machine, which clones the repository as the .NET page says to: `dotnet pack` failed with `NU5019: File not found: .../Mobium/icon.png`. The package's icon was added with the package metadata (#11), and `.gitignore` ignores every `*.png`, because screenshots land in the tree constantly during device work — so the icon was never committed. Every check that packed…", "gold": false}, {"id": "docs/quickstart/javascript.md#2-install-the-client", "heading": "2. Install the client", "path": "docs/quickstart Why would a pull request that adds a separate implementation of some behavior just for the MCP server be pushed back on in Mobium?", "tags": ["rationale", "contributor"], "gold": [{"id": "CONTRIBUTING.md#the-design-rule", "heading": "The design rule", "path": "CONTRIBUTING.md", "excerpt": "***Mutatis mutandis*** — the same argument carried into a new domain, changing only what must change. When something needs to work on a second platform, through a second front door or via a third-party backend, the answer is the existing thing with the necessary changes, not a parallel implementation. A change that duplicates a layer is almost always the wrong one. [docs/PHILOSOPHY.md](docs/PHILOSOPHY.md) has where t…"}], "retrieved": [{"id": "README.md#front-doors", "heading": "Front doors", "path": "README.md", "excerpt": "The CLI does not implement behavior. It calls the same tools an MCP client calls, so the surfaces cannot drift: ```mermaid flowchart LR cli[\"CLI\"] --> daemon clients[\"Python · JS · Go · Java · .NET\"] --> pipe[\"mobium pipe\"] --> daemon mcp[\"MCP client\"] --> mcpcmd[\"mobium mcp\"] daemon[\"daemon<br/>sessions, @refs\"] --> agent mcpcmd --> agent[\"internal/agent<br/>every tool, written once\"] agent --> driver[\"internal/mobi…", "gold": false}, {"id": "packaging/mcp/README.md#mcp-packaging", "heading": "MCP packaging", "path": "packaging/mcp/README.md", "excerpt": "What puts Mobium's MCP server — `mobium mcp` — into the [MCP Registry](https://registry.modelcontextprotocol.io) and into clients that install MCP bundles, such as Claude Desktop. | File | What it is | | --- | --- | | [manifest.json](manifest.json) | The MCPB manifest, a template: the version and the tool list are filled in at build time | | [launcher.sh](launcher.sh) | The bundle's entry point, `server/mobium`: a bu…", "gold": false}, {"id": "docs/DEVELOPMENT.md#7-send-a-pull-request", "heading": "7. Send a pull request", "path": "docs/DEVELOPMENT.md", "excerpt": "`main` is protected. A chang ability in the initialize reply; it unlocks scrolling, scroll-to and long press.", "Implement `swipe` taking x1, y1, x2, y2 and durationMs (and `longPress` taking x, y, durationMs), in device pixels. ⟦durationMs⟧"], "concern": "", "check": "Claude's reading: README's capabilities table maps gestures to swipe and longPress and what they unlock; PROTOCOL's methods table has the parameters, which External.Swipe and LongPress send exactly. Verified in: internal/mobiumdriver/external.go:318, internal/mobiumdriver/external.go:324."}, {"id": "g097", "kind": "multi", "question": "I want two agents, each driving its own Android emulator through Mobium's MCP server at the same time. How do I set them up so they don't get in each other's way?", "tags": ["how-to", "agent-builder"], "gold": [{"id": "docs/guides/mcp.md#1-connect-it", "heading": "1. Connect it", "path": "docs/guides/mcp.md", "excerpt": "In Claude Code: ```sh claude mcp add mobium -- mobium mcp ``` With more than one device, pin one — `mobium mcp --device emulator-5554` — or let the agent pass `device` to each call. `--driver wda` makes iOS the default. Other MCP clients take the same server in their JSON configuration, under `mcpServers`: ```json { \"mcpServers\": { \"mobium\": { \"command\": \"mobium\", \"args\": [\"mcp\", \"--device\", \"emulator-5554\"] } } } ``…"}, {"id": "docs/guides/mcp.md#6-sessions-and-sharing-a-device", "heading": "6. Sessions, and sharing a device", "path": "docs/guides/mcp.md", "excerpt": "`mobium mcp` runs the tools in its own process: the editor's MCP connection is the long-lived thing, and it holds its own device sessions, with the agent's refs. The command line and the language clients share a daemon instead. A device's automation server holds one session at a time, so an agent's MCP server and a `mobium` command driving **the same device at the same time** take it from each other — each recovers, …"}], "retrieved": [{"id": "docs/guides/mcp.md#6-sessions-and-sharing-a-device", "heading": "6. Sessions, and sharing a device", "path": "docs/guides/mcp.md", "excerpt": "`mobium mcp` runs the tools in its own process: the editor's MCP connection is the long-lived thing, and it holds its own device sessions, with the agent's refs. The command line and the language clients share a daemon instead. A device's automation server holds one session at a time, so an agent's MCP server and a `mobium` command driving **the same device at the same time** take it from each other — each recovers, …", "gold": true}, {"id": "docs/guides/mcp.md#1-connect-it", "heading": "1. Connect it", "path": "docs/guides/mcp.md", "excerpt": "In Claude Code: ```sh claude mcp add mobium -- mobium mcp ``` With more than one device, pin one — `mobium mcp --device emulator-5554` — or let the agent pass `device` to each call. `--driver wda` makes iOS the default. Other MCP clients take the same server in their JSON configuration, under `mcpServers`: ```json { \"mcpServers\": { \"mobium\": { \"command\": \"mobium\", \"args\": [\"mcp\", \"--device\", \"emulator-5554\"] } } } ``…", "gold": true}, {"id": "docs/SETUP.md#parallel-runs", "heading": "Parallel runs", "path": "docs/SETUP.md", "excerpt": "**Give each run that drives a device at the same time as another its own daemon.** One daemon serves one call at a time, across every device it holds, so two runs sharing one go at the pace of the slower device. Measured on 2026-09-27, 15 `map` calls on each of an Android 15 emulator and an iPhone 17 Pro simulator at once: | | the emulator's 15 calls | | --- | --- | | alone | 0.3s | | sharing a daemon with the simula…", "gold": false}, {"id": "docs/guides/mcp.md#mcp-mobium-as-an-agents-tools", "heading": "MCP: Mobium as an agent's tools", "path": "docs/guides/mcp.md", "excerpt": "`mobium mcp` serves every one of Mobium's tools over the Model Context Protocol, on stdio, so an agent — Claude Code, or any MCP client — drives devices with the same tools the command line and the language clients use. at most 180 s, which a retriever will bring back. Nearest sections: docs/THREAT-MODEL.md#the-llm-top-10, docs/guides/mcp.md#6-sessions-and-sharing-a-device. Verified in: internal/agent/server.go:43."}, {"id": "g100", "kind": "unanswerable", "question": "When will Mobium's Python client be published on PyPI so I can just run pip install mobium?", "tags": ["test-author"], "gold": [], "retrieved": [{"id": "docs/quickstart/python.md#2-install-the-client", "heading": "2. Install the client", "path": "docs/quickstart/python.md", "excerpt": "Not on PyPI yet — pip installs it straight from GitHub, which needs `git` on your `PATH`. After the first release this becomes `pip install mobium`. ```sh mkdir quickstart && cd quickstart python3 -m venv .venv .venv/bin/pip install \"mobium @ git+https://github.com/mobiumdev/mobium.git#subdirectory=clients/python\" ```", "gold": false}, {"id": "docs/DEVELOPMENT.md#5-work-on-a-client", "heading": "5. Work on a client", "path": "docs/DEVELOPMENT.md", "excerpt": "Each client's tests start a fake `mobium` and need no device: | Client | Its tests | Run a program against it from this clone | | --- | --- | --- | | Python | `make clients` | `pip install ./clients/python` in a virtualenv | | JavaScript | `make clients` | `npm install ./clients/javascript` | | Go | `make test` | `go mod edit -replace=github.com/mobiumdev/mobium/clients/go=<path to this clone>/clients/go` in your mod…", "gold": false}, {"id": "docs/quickstart/README.md#1-install-mobium", "heading": "1. Install mobium", "path": "docs/quickstart/README.md", "excerpt": "Until the first release there are no prebuilt binaries: mobium installs with **Go 1.24 or later** ([go.dev/dl](https://go.dev/dl/)), and needs nothing else. ```sh go install github.com/mobiumdev/mobium/cmd/mobium@latest mobium --version ``` It lands in `$(go env GOPATH)/bin`; make sure that is on your `PATH`. Each client page says how to install that client. Python (with `git`) and Go install straight from GitHub to const KIND = {fact:"Single fact", multi:"Two sections", unanswerable:"Not in the docs"};
const reviews = {};          // id -> stored decision
const drafts = {};           // id -> unsaved text while typing
let db = null, writable = false, filter = "all";   // writable once the store answers
const chains = {};           // one write at a time per question

document.getElementById("pin").textContent = DATA.pin;

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids) if (c) e.append(c);
  return e;
}

function secView(s, q, retrieved){
  const box = el("div",{class:"sec"},
    el("div",{class:"sid",text:s.id}),
    el("div",{class:"sh",text:s.heading}));
  if (retrieved && s.gold) box.append(el("span",{class:"key",text:"Answer key"}));
  const d = el("details",{}, el("summary",{text:"Read the passage"}), el("p",{text:s.excerpt}));
  box.append(d);
  if (retrieved && !s.gold){
    const r = reviews[q.id] || {};
    const cb = el("input",{type:"checkbox",id:`also-${q.id}-${s.id}`, checked:(r.also||[]).includes(s.id), disabled:!writable});
    cb.addEventListener("change", () => {
      const cur = new Set((reviews[q.id]||{}).also || []);
      cb.checked ? cur.add(s.id) : cur.delete(s.id);
      save(q.id, {also:[...cur]});
    });
    box.append(el("label",{class:"also", for:cb.id}, cb, document.createTextNode("Also answers it")));
  }
  return box;
}

function card(q){
  const r = reviews[q.id] || {};
  const li = el("li",{class:"q", id:q.id, "data-decision": r.decision || null});
  li.append(el("div",{class:"qhead"},
    el("span",{class:"id",text:q.id}),
    el("span",{class:"tag",text:KIND[q.kind]}),
    ...(q.tags || []).map(t => el("span",{class:"tag",text:t})),
    q.missed ? el("span",{class:"tag miss",text:"Missed by retrieval"}) : null,
    (DATA.pins && DATA.pins[q.id]) ? el("span",{class:"tag",text:"New · retrieved at "+DATA.pins[q.id]}) : null,
    el("span",{class:"state saved", id:`st-${q.id}`, text: r.decision ? `${r.decision === "approve" ? "Approved" : r.decision === "edit" ? "Edited" : "Rejected"}` : "Undecided"})));
  li.append(el("p",{class:"question",text: (r.decision === "edit" && r.question) ? r.question : q.question}));
  const key = el("div",{class:"col"}, el("h3",{text: q.gold.length ? "Answer key" : "Answer key: none, the docs don't say"}));
  if (q.gold.length) q.gold.forEach(s => key.append(secView(s,q,false)));
  else key.append(el("p",{class:"none",text:"A correct answer refuses. Check that nothing below answers it."}));
  const got = el("div",{class:"col"}, el("h3",{text:"Retrieved, reranked top 5"}));
  q.retrieved.forEach(s => got.append(secView(s,q,true)));
  li.append(el("div",{class:"cols"}, key, got));
  if (q.facts){
    const mine = Array.isArray(r.facts);
    const box = el("div",{class:"facts"});
    box.append(el("h3",{}, document.createTextNode("Key facts a correct answer must state"),
      el("span",{class:"src"+(mine?" mine":""), id:`fs-${q.id}`, text: mine ? "Yours" : "Drafted, not yet checked"}),
      (!mine && writable) ? el("button",{class:"ok-facts", id:`fo-${q.id}`, text:"Facts look right",
        onclick: () => save(q.id, {facts: shownFacts(q)})}) : null));
    box.append(el("p",{class:"hint",text:"One per line. Edit freely, or press Facts look right; approving or editing the question also keeps them as shown."}));
    if (q.concern) box.append(el("p",{class:"concern",text:"Drafting flagged: "+q.concern}));
    // Claude's reading of the question against the docs and code: a
    // proposal, never a decision — the buttons below are the decision.
    if (q.check) box.append(el("p",{class:"check"}, el("b",{text:"Claude checked it: "}), document.createTextNode(q.check)));
    const ft = el("textarea",{id:`fa-${q.id}`, rows:String(Math.max(2,(mine?r.facts:q.facts).length+1)), disabled:!writable, "aria-label":`Key facts for ${q.id}`});
    ft.value = drafts[`f-${q.id}`] ?? (mine ? r.facts : q.facts).join("\n");
    ft.addEventListener("input", () => { drafts[`f-${q.id}`] = ft.value;
      debounce(q.id+"f", () => save(q.id,{facts: ft.value.split("\n").map(x => x.trim()).filter(Boolean)}), 700); });
    box.append(ft);
    li.append(box);
  }

  const actions = el("div",{class:"actions"});
  for (const [v,label] of [["approve","Approve"],["edit","Edit"],["reject","Reject"]]){
    actions.append(el("button",{class:"act","data-v":v,"aria-pressed": String(r.decision === v), disabled:!writable, text:label,
      onclick: () => {
        const patch = {decision: r.decision === v ? null : v, question: v === "edit" ? (r.question || q.question) : r.question || null};
        // Deciding a question is checking its facts: keep the ones shown as the reviewer's.
        if (q.facts && patch.decision && patch.decision !== "reject" && !Array.isArray(r.facts)) patch.facts = shownFacts(q);
        save(q.id, patch);
      }}));
  }
  li.append(actions);

  const fields = el("div",{class:"fields"});
  if (r.decision === "edit"){
    const ta = el("textarea",{class:"qedit", id:`qe-${q.id}`, rows:"2", disabled:!writable});
    ta.value = drafts[`q-${q.id}`] ?? r.question ?? q.question;
    ta.addEventListener("input", () => { drafts[`q-${q.id}`] = ta.value; debounce(q.id+"q", () => save(q.id,{question:ta.value}), 700); });
    fields.append(el("label",{for:ta.id,text:"Question as it should read"}), ta);
  }
  const note = el("textarea",{id:`nt-${q.id}`, rows:"1", placeholder:"A note: another section that answers it, or why it should go", disabled:!writable});
  note.value = drafts[`n-${q.id}`] ?? r.note ?? "";
  note.addEventListener("input", () => { drafts[`n-${q.id}`] = note.value; debounce(q.id+"n", () => save(q.id,{note:note.value}), 700); });
  fields.append(el("label",{for:note.id,text:"Note"}), note);
  li.append(fields);
  return li;
}

// The facts as the box shows them now: what is typed, else the saved
// version, else the draft.
function shownFacts(q){
  const r = reviews[q.id] || {};
  const typed = drafts[`f-${q.id}`];
  if (typed !== undefined) return typed.split("\n").map(x => x.trim()).filter(Boolean);
  return Array.isArray(r.facts) ? r.facts : (q.facts || null);
}

const timers = {};
function debounce(k, fn, ms){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }

function visible(q){
  const r = reviews[q.id] || {};
  return filter === "all" || (filter === "open" && !r.decision) || (filter === "missed" && q.missed) || q.kind === filter;
}

function render(){
  const list = document.getElementById("list");
  const focused = document.activeElement && document.activeElement.id;
  list.replaceChildren(...DATA.questions.filter(visible).map(card));
  if (focused){ const f = document.getElementById(focused); if (f){ f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length,f.value.length); } }
  tally();
}

function tally(){
  const n = DATA.questions.length;
  const c = {approve:0, edit:0, reject:0};
  DATA.questions.forEach(q => { const d = (reviews[q.id]||{}).decision; if (d) c[d]++; });
  const open = n - c.approve - c.edit - c.reject;
  const t = document.getElementById("tally");
  t.replaceChildren(...[["Approved",c.approve],["Edited",c.edit],["Rejected",c.reject],["Undecided",open]].map(([l,v]) => el("span",{}, el("b",{text:String(v)}), document.createTextNode(" "+l.toLowerCase()))));
  const bar = document.getElementById("bar");
  bar.replaceChildren(...[["--ok",c.approve],["--edit",c.edit],["--no",c.reject]].map(([col,v]) => { const i = el("i"); i.style.width = (100*v/n)+"%"; i.style.background = `var(${col})`; return i; }));
}

function setState(id, text, err){
  const s = document.getElementById(`st-${id}`); if (s){ s.textContent = text; s.classList.toggle("err", !!err); }
}

function save(id, patch){
  if (!db || !writable) return;
  const body = Object.assign({decision:null, question:null, also:[], note:""}, reviews[id] || {}, patch, {at: new Date().toISOString()});
  if (body.decision !== "edit") body.question = null;
  reviews[id] = body;
  if ("decision" in patch) render(); else tally();
  if ("facts" in patch){
    const l = document.getElementById(`fs-${id}`); if (l){ l.textContent = "Yours"; l.classList.add("mine"); }
    const b = document.getElementById(`fo-${id}`); if (b) b.remove();
  }
  setState(id, "Saving…");
  chains[id] = (chains[id] || Promise.resolve()).then(() => db.collection("reviews").doc(id).set(body)).then(
    () => setState(id, "Saved"),
    e => {
      if (e && e.code === "invalid_argument"){ writable = false; showNotice("This view can read the review but not change it. Ask for edit access to record decisions."); render(); }
      else setState(id, "Not saved: " + ((e && e.message) || "try again"), true);
    });
}

function showNotice(text){ const n = document.getElementById("notice"); n.textContent = text; n.hidden = false; }

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

render();

(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db){ showNotice("Decisions can't be saved in this view. Open the review from claude.ai while signed in to record them."); return; }
  writable = true; render();
  db.collection("reviews").onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(d => {
      const v = d.data();
      if (JSON.stringify(reviews[d.id]) !== JSON.stringify(v)){ reviews[d.id] = JSON.parse(JSON.stringify(v)); changed = true; }
    });
    if (changed) render();
  }, e => showNotice("Saved decisions stopped updating live (" + e.code + "). Reload to see the latest."));
})();
</script>
