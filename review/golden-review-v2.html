*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-ui);padding-inline:16px;padding-block:0 64px}

ps", "heading": "Environment traps", "path": "docs/CHALLENGES.md", "excerpt": "None of these is a Mobium defect; each cost real time and no error named its cause. - **`platform-tools` must be installed into the SDK root** with `sdkmanager`, not only as the Homebrew cask. The emulator validates the SDK root by looking for that directory and dies with `Broken AVD system path` — while `adb` is on `PATH` and working perfectly, which sends you looking in entirely the wrong place. - **`avdmanager` pr…", "gold": false}, {"id": "docs/quickstart/README.md#android-emulator-macos-linux", "heading": "Android emulator (macOS, Linux)", "path": "docs/quickstart/README.md", "excerpt": "Install [Android Studio](https://developer.android.com/studio) or the command-line tools, then create a virtual device (Device Manager in Android Studio, or `avdmanager`) and boot it by name: ```sh mobium boot <avd> ``` It finds the SDK's `emulator` itself, through `ANDROID_HOME` or the SDK's usual place, and answers once Android has finished booting — not merely once `adb` can see it. Add `--window` to watch it; it …", "gold": false}, {"id": "docs/SETUP.md#setting-up-devices", "heading": "Setting up devices", "path": "docs/SETUP.md", "excerpt": "Everything Mobium needs on the machine and on the device, for all four kinds of target. Written from doing it: every trap below cost real time here, and most of them report something that names the wrong cause. **Run `mobium doctor` first.** It checks the whole list without needing a device, and exits non-zero if it found something: ``` ok adb Android Debug Bridge version 1.0.41 at /opt/homebrew/bin/adb note android …", "gold": false}, {"id": "docs/SETUP.md#on-linux", "heading": "On Linux", "path": "docs/SETUP.md", "excerpt": "Google ships the command-line tools as a zip, and the emulator and `platform-tools` for Linux **only for x86_64** — the SDK repository has no Linux arm64 build of either (checked 2026-09-28) — so an arm64 Linux machine cannot run the e s changed at once. The screen is the same; the **keyboard** and the **snapshot** are not. **Switching an emulator between the two.** It is decided at launch, so it is a restart, in the order `docs/SHUTDOWN.md` gives: ```sh mobium shutdown emulator-5554 && mobium boot mobium-test --window # headed mobium shutdown emula…", "gold": true}, {"id": "docs/SHUTDOWN.md#on-the-device", "heading": "On the device", "path": "docs/SHUTDOWN.md", "excerpt": "Stopping processes on your machine is not the whole job. **`clean-stop.sh --quit` now runs these**, so they are no longer a checklist nobody gets to. They were manual until a hierarchy dump turned up in `/data/local/tmp` six days after the session that wrote it, on an emulator stopped and rebooted twice in between — it was a hand-run `uiautomator dump` rather than mobium's own file, which is deleted after every read,…", "gold": false}, {"id": "docs/guides/graybox.md#when-the-app-is-not-waited-for", "heading": "When the app is not waited for", "path": "docs/guides/graybox.md", "excerpt": "Three things end a wait early, and the result says which, so a check that did not run never reads as one that passed: - **The app went to the background.** The library says `away` and `back`; while the app is away, an action elsewhere is not held up by it. - **The app stopped saying it is busy.** Busy is a lease: while work is in flight the library restates the count every half second, from a native timer that a busy…", "gold": false}, {"id": "docs/BACK.md#in-mobiumapp", "heading": "In MobiumApp", "path": "docs/BACK.md", "excerpt": "1. **Android back closed the app.** Fixed in mobium-app #12, measured above. Rebuild MobiumApp for any device that still has the old build, and keep `docs/checks/mobium-app.sh` passing. 2. **No swipe back on iOS.** Needs native-stack navigation; unmeasured. 3. **WebView screens.** Android back should go back in the page's history before leaving the screen, as a browser does. Unmeasured. 4. **Predictive back.** Measur…", "gold": false}, {"id": "CHALLENGES#186", "heading": "186. The emulator console answered nothing, and the error said nothing", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `app_shake` on the Pixel 7 AVD, which had passed its check two days before, failing with \"the emulator did not say where its accelerometer rests:\" — and nothing after the colon. Every `adb emu` command printed nothing and exited 0, while the same commands typed into the console's own port answered at once. Another automation tool had rewritten `~/.emulator_console_auth_token` empty, a documented step of…", "gold": false}], "missed": false, "facts": ["-no-snapshot-save still loads the quick-boot snapshot on the next start, so everything installed since the snapshot is gone. ⟦-no-snapshot-save⟧", "Cold-boot with -no-snapshot-load, which mobium boot passes, or reinstall what you need and confirm its version. ⟦-no-snapshot-load⟧"], "concern": "", "check": "Claude's reading: BootEmulator always passes -no-snapshot-load and its comment cites the old-app snapshot problem (boot.go:116-118, 139). The fact is in part ~1 of the section. Verified in: internal/device/boot.go:115-139."}, {"id": "g005", "kind": "fact", "question": "What do I have to switch on, on the iPhone itself, before Mobium can drive it?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/SETUP.md#on-the-phone-once", "heading": "On the phone, once", "path": "docs/SETUP.md", "excerpt": "1. **Connect it with a cable, unlock it, tap Trust This Computer** and enter the passcode. 2. **Open Xcode → Window → Devices and Simulators** with the phone connected, and wait while Xcode prepares it. The next step's switch does not exist until this has happened. 3. **Settings → Privacy & Security → Developer Mode → on.** The phone restarts and asks you to confirm. 4. **Settings → Developer → Enable UI Automation →…"}], "retrieved": [{"id": "docs/RELEASE-CHECKLIST.md#ios-a-booted-iphone-simulator", "heading": "iOS — a booted iPhone simulator", "path": "docs/RELEASE-CHECKLIST.md", "excerpt": "- [ ] `mobium --driver wda map` on the home screen returns icons - [ ] Wait for something already on screen, and across a cold app launch - [ ] `mobium scroll-to` reaches a Settings row below the fold, and tapping it opens that screen - [ ] `mobium grant com.apple.Preferences photos` succeeds and says it could not be verified - [ ] `mobium grant <anything> camera` is refused, naming the missing service - [ ] Coordina…", "gold": false}, {"id": "CHALLENGES#153", "heading": "153. A real iPhone's WebDriverAgent answered anyone on its Wi-Fi", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the threat model's open item, measured on the iPhone 15 Plus: the runner's `/status`, which reports the phone's Wi-Fi address, was asked again at that address from the Mac, over the network rather than the cable.", "gold": false}, {"id": "docs/SETUP.md#what-mobium-installs-and-removing-it", "heading": "What Mobium installs, and removing it", "path": "docs/SETUP.md", "excerpt": "On the machine, under `~/.mobium`: | | | | --- | --- | | `uiautomator2/`, `webdriveragent/` | pinned, checksummed device agents, ~40MB, downloaded on first use | | `webdriveragent-device/` | WebDriverAgent's pinned source and one signed build per team and phone, ~150MB — only once a real iPhone has been driven | | `daemon/` | socket and PID file, removed on shutdown | On an **Android** device, the default backend ins…", "gold": false}, {"id": "docs/THREAT-MODEL.md#the-mobile-side", "heading": "The mobile side", "path": "docs/THREAT-MODEL.md", "excerpt": "The OWASP Mobile Top 10 and MASVS are about the apps under test, not about Mobium, but two points apply to Mobium itself: - It installs a server APK on the device with its permissions granted, and builds and signs WebDriverAgent for a person's iPhone. Both are removable, and [SETUP](SETUP.md#what-mobium-installs-and-removing-it) says how. - It must leave nothing on the device: a hierarchy dump in `/data/local/tmp` is…", "gold": false}], "missed": true, "facts": ["Trust the computer over a cable and let Xcode's Devices and Simulators window prepare the phone, then turn on Developer Mode. ⟦Developer Mode⟧", "Turn on Settings > Developer > Enable UI Automation; without it WebDriverAgent fails with \"Timed out while enabling automation mode\". ⟦Enable UI Automation⟧", "Set Auto-Lock to Never (or long enough) so the phone does not lock mid-run. ⟦Auto-Lock⟧"], "concern": "", "check": "Claude's reading: wdaphone.go recognizes WebDriverAgent's \"Timed out while enabling automation mode\" log and names the switch (lines 653-660). README.md#platforms~1 lists Developer Mode and Enable UI Automation too and is a plausible near miss, but lacks the trust/Xcode/Auto-Lock steps. Verified in: internal/device/wdaphone.go:653-660."}, {"id": "g006", "kind": "fact", "question": "Which simulator features does Mobium refuse on a real iPhone, and how do I reset an app's data on a phone instead?", "tags": ["support", "test-author"], "gold": [{"id": "docs/SETUP.md#what-a-phone-cannot-do", "heading": "What a phone cannot do", "path": "docs/SETUP.md", "excerpt": "These are done by `simctl` on a simulator and `devicectl` has no equivalent, so on a phone they are refused, each with the reason, rather than approximated: **permissions, appearance, the clipboard, simulated location and routes, and notifications** — reading or posting them. **Clearing an app's data takes its bundle on a phone.** Nothing can delete from an app's container there, so `mobium clear-data <app> --bundle …"}], "retrieved": [{"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "docs/SETUP.md#what-a-phone-cannot-do", "heading": "What a phone cannot do", "path": "docs/SETUP.md", "excerpt": "These are done by `simctl` on a simulator and `devicectl` has no equivalent, so on a phone they are refused, each with the reason, rather than approximated: **permissions, appearance, the clipboard, simulated location and routes, and notifications** — reading or posting them. **Clearing an app's data takes its bundle on a phone.** Nothing can delete from an app's container there, so `mobium clear-data <app> --bundle …", "gold": true}, {"id": "docs/checks/README.md#results", "heading": "Results", "path": "docs/checks/README.md", "excerpt": "Run 2026-09-13. Both emulators are the same Pixel 7 profile — 1080x2400 at 420dpi — so the only difference between them is the OS. | Device | OS | calculator.sh | clock-timer.sh | external-driver.sh | third-party-app.sh | device-state.sh | | --- | --- | --- | --- | --- | --- | --- | | Pixel 7 AVD | Android 15 (API 35) | PASS 6.4s | PASS 5.5s | PASS | PASS | PASS | | Pixel 7 AVD | Android 17 (API 37) | PASS 6.9s | PAS…", "gold": false}], "missed": false, "facts": ["On a phone Mobium refuses permissions, appearance, the clipboard, simulated location and routes, and notifications, each with the reason, because simctl does them and devicectl has no equivalent. ⟦devicectl⟧", "Clearing an app's data on a phone takes its bundle: mobium clear-data <app> --bundle uninstalls and reinstalls the app. ⟦--bundle⟧"], "concern": "", "check": "Claude's reading: simulatorOnly in wdaphone.go lists exactly permissions, appearance, clipboard read/write, geolocation, routes, clear-data and notifications, and phoneRemedies gives the --bundle reinstall route for clear-data. The code also lists clipboard read separately; the doc says 'the clipboard'. Verified in: internal/mobiumdriver/wdaphone.go:196-230, internal/mobiumdriver/wdaphone.go:263-265."}, {"id": "g007", "kind": "multi", "question": "Can I use Mobium on a Windows PC for my Android and iOS app testing today, and how far does that go?", "tags": ["support", "new-user", "new since 7b590a4"], "gold": [{"id": "docs/WINDOWS.md#windows-support", "heading": "Windows support", "path": "docs/WINDOWS.md", "excerpt": "**Status: devices driven from Windows since 2026-10-22; not yet declared supported.** On a Windows 11 laptop (24H2, i7-8565U, 8 GB), an Android 15 emulator and a Pixel 8 Pro over USB were driven through `mobium mcp`, the CLI over the named pipe, and all five clients, which passed every step on both. A sweep of the checks on the emulator found six things, all fixed: the daemon dying with the SSH session that started i…"}, {"id": "docs/WINDOWS.md#android-only-ios-is-not-possible-on-windows", "heading": "Android only. iOS is not possible on Windows.", "path": "docs/WINDOWS.md", "excerpt": "Said here rather than in a footnote, because it is the first question anyone asks and the answer is structural rather than a gap in the work. Mobium drives iOS through `xcrun simctl` — 41 call sites in `internal/device` alone — and through WebDriverAgent, which it installs as the prebuilt `WebDriverAgentRunner-Build-Sim-arm64.zip`. `simctl` ships inside Xcode and Xcode is macOS-only; the artifact is a *simulator* bui…"}], "retrieved": [{"id": "docs/WINDOWS.md#android-only-ios-is-not-possible-on-windows", "heading": "Android only. iOS is not possible on Windows.", "path": "docs/WINDOWS.md", "excerpt": "Said here rather than in a footnote, because it is the first question anyone asks and the answer is structural rather than a gap in the work. Mobium drives iOS through `xcrun simctl` — 41 call sites in `internal/device` alone — and through WebDriverAgent, which it installs as the prebuilt `WebDriverAgentRunner-Build-Sim-arm64.zip`. `simctl` ships inside Xcode and Xcode is macOS-only; the artifact is a *simulator* bui…", "gold": true}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "tests/README.md#tests", "heading": "Tests", "path": "tests/README.md", "excerpt": "Mobium's own tests of MobiumApp, run by `mobium test` — and the suite that holds the runner to its word. The format is in the [test runner guide](../docs/guides/test-runner.md). ```sh cd tests mobium test --project android # emulator-5554 MOBIUM_IOS_DEVICE=<simulator-udid> mobium test # and an iOS simulator mobium test --reporter list,junit,html && mobium show-report mobium test --ui --open # pick, run and watch on a…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#mobium-mobile-automation-cli-reference", "heading": "Mobium Mobile Automation — CLI Reference", "path": "skills/mobile-check/SKILL.md", "excerpt": "The `mobium` CLI automates **mobile apps** on Android emulators and phones, and iOS simulators and iPhones. A background daemon keeps the device session alive between commands, so each command is fast after the first. ``` mobium launch com.example.shop && mobium map && mobium tap @e5 && mobium map ``` What the app is built with decides how to reach it: | App type | How | | --- | --- | | Native (Android SDK, Jetpack C…", "gold": false}], "missed": false, "facts": ["Since 2026-10-22 an Android emulator and a phone have been driven from a Windows laptop through mobium mcp, the CLI and all five clients, but Windows is not yet declared supported. ⟦2026-10-22⟧", "iOS is not possible on Windows: Mobium drives iOS through xcrun simctl and WebDriverAgent built with Xcode, which is macOS-only. ⟦macOS-only⟧", "What is left before support is the checks a person at the machine runs and seven checks whose failures are not yet explained. ⟦not yet explained⟧"], "concern": "docs/quickstart/README.md#where-it-runs still says no emulator or phone has been driven from Windows, which README.md and WINDOWS.md contradict since #270/#271; the quick-start table is stale.", "check": "Claude's reading: Windows-specific code (named-pipe daemon, Detach, process path) is in internal/device/*_windows.go and builds for windows/amd64; iOS paths call xcrun throughout internal/device. README.md#platforms~2 restates the status in brief and will likely be retrieved; the stale quick-start table is a hard negative. Verified in: internal/device/detach_windows.go:21-27, internal/device/procpath_windows.go:8, internal/device/simctl.go:282."}, {"id": "g008", "kind": "fact", "question": "In Git Bash on Windows, pushing a file to /data/local/tmp on my Android device fails because Mobium sees the path as 'C:/Program Files/Git/data/local/tmp/x'. How do I fix it?", "tags": ["troubleshooting", "test-author", "new since 7b590a4"], "gold": [{"id": "docs/WINDOWS.md#also-expected-unverified", "heading": "Also expected, unverified", "path": "docs/WINDOWS.md", "excerpt": "- **iOS is macOS-only.** `simctl` does not exist on Windows. `mobium devices` should report that as a note rather than an error — the code path already does this for a missing toolchain, but it has never been exercised with Xcode genuinely absent on a non-Mac. - Paths in `app_install` and `screenshot -o` take Windows separators; nothing obviously assumes `/`, but nothing has tested it either. - **Git Bash rewrites a …"}], "retrieved": [{"id": "CHALLENGES#361", "heading": "361. In Git Bash, a device path was rewritten into a Windows one, and refused as not absolute", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `device-paths.sh` and `network.sh` on the Windows laptop, run under Git Bash. `mobium shell --upload x /data/local/tmp/x` answered `\"C:/Program Files/Git/data/local/tmp/x\" is not an absolute path`, and its remedy — give an absolute path — was the one the caller had given. Git Bash rewrites any argument that starts with `/` into a path under its own install folder before a Windows program sees it, measur…", "gold": false}, {"id": "docs/SETUP.md#what-mobium-installs-and-removing-it", "heading": "What Mobium installs, and removing it", "path": "docs/SETUP.md", "excerpt": "On the machine, under `~/.mobium`: | | | | --- | --- | | `uiautomator2/`, `webdriveragent/` | pinned, checksummed device agents, ~40MB, downloaded on first use | | `webdriveragent-device/` | WebDriverAgent's pinned source and one signed build per team and phone, ~150MB — only once a real iPhone has been driven | | `daemon/` | socket and PID file, removed on shutdown | On an **Android** device, the default backend ins…", "gold": false}, {"id": "docs/WINDOWS.md#also-expected-unverified", "heading": "Also expected, unverified", "path": "docs/WINDOWS.md", "excerpt": "- **iOS is macOS-only.** `simctl` does not exist on Windows. `mobium devices` should report that as a note rather than an error — the code path already does this for a missing toolchain, but it has never been exercised with Xcode genuinely absent on a non-Mac. - Paths in `app_install` and `screenshot -o` take Windows separators; nothing obviously assumes `/`, but nothing has tested it either. - **Git Bash rewrites a …", "gold": true}, {"id": "docs/RELEASE-CHECKLIST.md#android-a-booted-pixel-7-avd", "heading": "Android — a booted Pixel 7 AVD", "path": "docs/RELEASE-CHECKLIST.md", "excerpt": "Setup is in [SETUP.md](SETUP.md), or [WINDOWS.md](WINDOWS.md) for Windows. Start the emulator, then `mobium daemon stop` so nothing serves a stale build. - [ ] `mobium devices` lists the emulator - [ ] `mobium map` on the launcher returns app icons as `button`, not `link` - [ ] `mobium launch com.android.settings && mobium tap \"text=Network & internet\"` with **no sleep between them** — the implicit wait is what makes…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#files", "heading": "Files", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium upload invoice.pdf # where a file picker looks mobium download report.csv # what the app saved there mobium upload ./seed --device-path /data/local/tmp/seed # Android, any shell path mobium download --app com.example.shop --device-path databases/shop.db # its private data mobium download --app com.example.Shop --device-path Library/Caches -o caches # iOS container ``` - Without `--device-path` a file goe…", "gold": false}], "missed": false, "facts": ["Git Bash rewrites any argument that starts with / into a path under Git's own folder before mobium sees it, and Mobium refuses such a path naming the rewrite. ⟦Git Bash⟧", "Set MSYS2_ARG_CONV_EXCL=\"/data/;/sdcard/\" to leave device paths alone (MSYS_NO_PATHCONV=1 stops every conversion), or run from PowerShell or cmd, which never rewrite. ⟦MSYS2_ARG_CONV_EXCL ; PowerShell⟧"], "concern": "", "check": "Claude's reading: CheckDevicePath refuses a path starting with a drive letter as a Git Bash rewrite and its remedy names MSYS2_ARG_CONV_EXCL, MSYS_NO_PATHCONV=1 and PowerShell or cmd (paths.go:126-135). CHALLENGES#361 tells the same story and is a near-equal answer. Verified in: internal/device/paths.go:126-135."}, {"id": "g009", "kind": "fact", "question": "On Windows, does a Mobium daemon that started inside an SSH session keep running after I disconnect, and what makes that work?", "tags": ["behavior", "ci-engineer", "new since 7b590a4"], "gold": [{"id": "docs/WINDOWS.md#4-devicedetach-internaldevicedetachwindowsgo-and-detachunixgo", "heading": "4. `device.Detach` — `internal/device/detach_windows.go` (and `detach_unix.go`)", "path": "docs/WINDOWS.md", "excerpt": "`CREATE_NEW_PROCESS_GROUP | DETACHED_PROCESS`: a Ctrl-C does not reach the daemon, and with no console it does not die when the terminal window closes. Neither leaves a job object, and Windows' OpenSSH server kills every process of a session's job when the session ends, so `Detach` also adds `CREATE_BREAKAWAY_FROM_JOB` when the job allows it — measured over SSH on a Windows 11 laptop, where the daemon otherwise died …"}], "retrieved": [{"id": "CHALLENGES#359", "heading": "359. On Windows, the daemon died with the SSH session that started it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the first device run from Windows, a Windows 11 laptop driven from a Mac over OpenSSH. Every command in one session reused the daemon; the next session found \"Daemon is not running\" and no `mobium` process. The SSH server runs each session in a job object with `KILL_ON_JOB_CLOSE` (limit flags `0x2800`), and `DETACHED_PROCESS` leaves the console, not the job, so ending the session ended the daemon — and …", "gold": false}, {"id": "docs/guides/cli.md#8-the-daemon-and-running-several-at-once", "heading": "8. The daemon, and running several at once", "path": "docs/guides/cli.md", "excerpt": "The first command starts a daemon in the background, which holds the device sessions and the refs between commands, and exits after 30 idle minutes: ``` $ mobium daemon status Daemon running (pid 4156, up 8s) version 0.1.0-dev socket ~/.mobium/daemon/mobium.sock ``` (The home directory is shortened to `~` here and below.) One daemon serves one call at a time. Two runs at once — two terminals, two CI jobs, two devices…", "gold": false}, {"id": "docs/SHUTDOWN.md#1-mobium-daemon-stop-always-first", "heading": "1. `mobium daemon stop`, always first", "path": "docs/SHUTDOWN.md", "excerpt": "The daemon owns the device-side sessions: a UiAutomator2 server running as instrumentation on Android, a WebDriverAgent process on an iOS simulator. Stopping it tells both to shut down. On an iOS simulator the next session starts on the home screen, whatever app was in front: WebDriverAgent's runner takes the foreground as it launches and leaves it to the home screen. The first command says so and names `app_launch` …", "gold": false}, {"id": "CHALLENGES#28", "heading": "28. `mobium daemon stop` returned before the daemon stopped", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** hitting it three times while doing other work, then reproducing it deliberately instead of retrying past it. `daemon stop` sent the shutdown request and returned as soon as it was acknowledged, while the daemon was still tearing down — closing a UiAutomator2 session takes about a second. The next command's auto-start then found the socket still held, failed to bind, and sat waiting ten seconds for a dae…", "gold": false}], "missed": true, "facts": ["Windows' OpenSSH server kills every process in a session's job when the session ends, which used to take the daemon with it. ⟦OpenSSH⟧", "Detach now adds CREATE_BREAKAWAY_FROM_JOB when the job allows breakaway, so the daemon outlives the session. ⟦CREATE_BREAKAWAY_FROM_JOB⟧"], "concern": "", "check": "Claude's reading: Detach sets CREATE_NEW_PROCESS_GROUP|DETACHED_PROCESS and adds CREATE_BREAKAWAY_FROM_JOB only when JOB_OBJECT_LIMIT_BREAKAWAY_OK is set (detach_windows.go:21-40); the auto-started daemon goes through it (daemon_client.go:119). CHALLENGES#359 is the defect behind it and an equally good source. Verified in: internal/device/detach_windows.go:13-40, cmd/mobium/daemon_client.go:114-119."}, {"id": "g010", "kind": "multi", "question": "My Android emulator on a Windows host has frozen: adb still lists it but every shell call times out. Will mobium shutdown end it, and how?", "tags": ["behavior", "test-author", "new since 7b590a4"], "gold": [{"id": "docs/SHUTDOWN.md#2-simulators-then-emulators", "heading": "2. Simulators, then emulators", "path": "docs/SHUTDOWN.md", "excerpt": "```sh xcrun simctl shutdown <udid> # or `all` adb -s emulator-5554 emu kill ``` `mobium shutdown <serial | avd | udid | simulator>` does this for one device in the same order — its session ended, then the device — and returns once the device is gone. It ends only its own daemon's session and does not check for other daemons on the device, so stop those first (`MOBIUM_SESSION=<name> mobium daemon stop` for each). A **…"}, {"id": "CHALLENGES#360", "heading": "360. On Windows, a frozen emulator could not be shut down, and the error said to shut it down", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a sweep of the checks on the Windows laptop's emulator, which froze under `network.sh` twice — adb listed it as `device` and every shell call timed out. Every check after it was refused as \"not answering adb\", and the refusal's remedy was 285's: `mobium shutdown emulator-5554`. On Windows that answered \"ending an emulator by its process is not done on Windows\", and `boot.sh`, which shuts its AVD down fi…"}], "retrieved": [{"id": "CHALLENGES#360", "heading": "360. On Windows, a frozen emulator could not be shut down, and the error said to shut it down", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a sweep of the checks on the Windows laptop's emulator, which froze under `network.sh` twice — adb listed it as `device` and every shell call timed out. Every check after it was refused as \"not answering adb\", and the refusal's remedy was 285's: `mobium shutdown emulator-5554`. On Windows that answered \"ending an emulator by its process is not done on Windows\", and `boot.sh`, which shuts its AVD down fi…", "gold": true}, {"id": "CHALLENGES#285", "heading": "285. A frozen emulator was told to try the other driver, and could not be shut down", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the lead 284 left. An emulator stopped with SIGSTOP timed out on `adb shell` as a session opened, and the error added \"To run without the UiAutomator2 server, use --driver uiautomator\" — a driver that goes through the same adb. The remedy that would help, a restart, did not work either: `mobium shutdown` on the frozen emulator ran six minutes and ended \"read response: i/o timeout\" with the emulator stil…", "gold": false}, {"id": "docs/SHUTDOWN.md#2-simulators-then-emulators", "heading": "2. Simulators, then emulators", "path": "docs/SHUTDOWN.md", "excerpt": "```sh xcrun simctl shutdown <udid> # or `all` adb -s emulator-5554 emu kill ``` `mobium shutdown <serial | avd | udid | simulator>` does this for one device in the same order — its session ended, then the device — and returns once the device is gone. It ends only its own daemon's session and does not check for other daemons on the device, so stop those first (`MOBIUM_SESSION=<name> mobium daemon stop` for each). A **…", "gold": true}, {"id": "docs/WINDOWS.md#windows-support", "heading": "Windows support", "path": "docs/WINDOWS.md", "excerpt": "**Status: devices driven from Windows since 2026-10-22; not yet declared supported.** On a Windows 11 laptop (24H2, i7-8565U, 8 GB), an Android 15 emulator and a Pixel 8 Pro over USB were driven through `mobium mcp`, the CLI over the named pipe, and all five clients, which passed every step on both. A sweep of the checks on the emulator found six things, all fixed: the daemon dying with the SSH session that started i…", "gold": false}, {"id": "CHALLENGES#93", "heading": "93. Every Android session ended by leaving a crash report on the device", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `app_crashes` itself, run on a Pixel 8 Pro (Android 17) while hardening it: of the phone's recorded crashes, most were `io.appium.uiautomator2.server` — `RuntimeException: Error while disconnecting UiAutomation`, caused by `DeadObjectException` — each one at the moment a Mobium session had ended. Teardown cancelled the host of `adb shell am instrument`, which takes the UiAutomation connection down with …", "gold": false}], "missed": false, "facts": ["mobium shutdown gives adb emu kill ten seconds, then ends ed on 2026-09-28…", "gold": false}, {"id": "docs/guides/grid.md#4-tests-on-a-grid", "heading": "4. Tests on a grid", "path": "docs/guides/grid.md", "excerpt": "`mobium test` goes through a grid the same way. A project that names no device asks for one by `platform`, and with `MOBIUM_GRID` set each project gets a connection of its own, which leases a device before any test runs and releases it when the run ends: ```json { \"testDir\": \"tests\", \"projects\": [ {\"name\": \"android-a\", \"platform\": \"android\"}, {\"name\": \"android-b\", \"platform\": \"android\"} ] } ``` ``` $ MOBIUM_GRID=loca…", "gold": false}, {"id": "docs/guides/grid.md#what-stays-local", "heading": "What stays local", "path": "docs/guides/grid.md", "excerpt": "`daemon`, `doctor` and `mcp` are about this machine and ignore `--remote`. One device still belongs to one run at a time, on a node as anywhere: a test run holds each project's device for the whole run, so a grid with two free devices serves two projects at once, not more.", "gold": false}], "missed": false, "facts": ["The grid lends a physical device only when the node's own environment sets MOBIUM_GRID_PHONES=1, the node's choice, never the caller's; until then it is listed as not offered. ⟦MOBIUM_GRID_PHONES=1⟧", "A grid shows a phone's model, never its name."], "concern": "", "check": "Claude's reading: grid.go marks a device Offered only if it is an emulator/simulator or the node's MOBIUM_GRID_PHONES is 1 (line 96) and tells a run asking for one so (line 211). SETUP.md#a-grid~1 also covers phones but not the model-not-name point. Verified in: cmd/mobium/grid.go:60-96, cmd/mobium/grid.go:211."}, {"id": "g015", "kind": "fact", "question": "How do I connect my Fire TV so Mobium can drive it over Wi-Fi from my Mac, and what do I do when adb connect says \"No route to host\" although the TV answers ping?", "tags": ["how-to", "new-user"], "gold": [{"id": "docs/SETUP.md#over-wi-fi", "heading": "Over Wi-Fi", "path": "docs/SETUP.md", "excerp ement or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}], "missed": false, "facts": ["Turn on ADB Debugging in the Fire TV's Developer Options (shown under Settings > Device & Software after selecting the device name seven times in About), then run adb connect <tv>:5555 with the TV's IPv4 address and accept the prompt on the TV; a Fire TV has no pairing step. ⟦ADB Debugging ; 5555⟧", "\"No route to host\" while ping works is macOS Local Network privacy silently blocking an adb server that a background process started; run adb kill-server && adb connect <tv>:5555 from a Terminal window so macOS asks, and allow it. ⟦Local Network ; adb kill-server⟧"], "concern": "", "check": "Claude's reading: replaces a draft that duplicated g074 (simulator audio setup). Both facts are in SETUP.md#over-wi-fi; the Local Network trap is macOS behavior, measured on the Fire TV and recorded in the doc, not something the code can show, and the code's own part is the disconnect-then-connect before it reports a network device missing (internal/device/adb.go:358). SHUTDOWN.md's TV section repeats the trap and could also count. Verified in: internal/device/adb.go:358."}, {"id": "g016", "kind": "fact", "question": "How do I set up an Apple TV simulator for Mobium, and how do I move around in it given that it has no touch screen?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/SETUP.md#an-apple-tv-simulator", "heading": "An Apple TV simulator", "path": "docs/SETUP.md", "excerpt": "Verified on a tvOS 26.5 simulator (Apple TV 4K, 3rd generation, at 1080p) with Xcode 26.6, on 2026-10-09. The tvOS platform is a separate download: ```sh xcodebuild -downloadPlatform tvOS # or Xcode > Settings > Components xcrun simctl create \"Apple TV\" \\ com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p \\ com.apple.CoreSimulator.SimRuntime.tvOS-26-5 xcrun simctl boot <udid> && open -a Simul d 17, an iPhone 17 Pro simulator on iOS 26.5, and an iPhone 15 Plus on iOS 26.6.2. The end-to-end flows in [docs/checks/](docs/checks/) each drive a real device and assert on what happened rather than on an exit code. | | `uiautomator2` | `uiautomator` | `wda` | | --- | --- | --- | --- | | platform | Androi…"}], "retrieved": [{"id": "docs/SETUP.md#a-wear-os-emulator", "heading": "A Wear OS emulator", "path": "docs/SETUP.md", "excerpt": "Wear OS images are on the stable channel, Wear OS 3 to 6.1, and 7.0 at API 37. A watch is driven as any Android device, by the same backends: ```sh sdkmanager \"system-images;android-35-ext15;android-wear;arm64-v8a\" # Wear OS 5.1 avdmanager create avd -n mobium-wear -d wearos_large_round \\ -k \"system-images;android-35-ext15;android-wear;arm64-v8a\" emulator -avd mobium-wear -port 5558 -no-snapshot-load -no-boot-anim & …", "gold": false}, {"id": "docs/THREAT-MODEL.md#what-it-is-for-this-purpose", "heading": "What it is, for this purpose", "path": "docs/THREAT-MODEL.md", "excerpt": "- **Mobium does not run a model.** It is the hands of one: an agent, or a script, calls tools; Mobium acts on a device and reports what it saw. - **Everything it reports comes from apps it does not control.** `map` labels, `text`, `source`, WebView `eval` results, notifications, device logs, crash reports, the clipboard. Any app or page can put text there, including text written to be read by an agent as an instructi…", "gold": false}, {"id": "docs/ACCESSIBILITY.md#assistive-technology", "heading": "Assistive technology", "path": "docs/ACCESSIBILITY.md", "excerpt": "What Mobium can do with the tools disabled people use to operate a phone or a TV: screen readers, speech that drives the screen, and voice assistants that do a task without it. What was measured, what it found, and the plan to build on it, in the order it should be built. Each step names the control that shows it can fail before its result counts. **Status on 2026-10-20.** TalkBack stays on t cs/CHALLENGES.md", "excerpt": "**Found by:** Morpho Market's Apple TV app, on a tvOS 26.5 simulator. Its tests start from `mobiumshop://reset`, and tvOS asks \"Open in “Morpho Market”?\" before a link opens the app, until Open is pressed once — as iOS does, where the phone suite answers it with a dialog rule. On the Apple TV the same rule failed every action it met: the rule tapped the button, and a TV refuses every tap (`an Apple TV has no touch sc…", "gold": false}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "docs/RELEASE-CHECKLIST.md#ios-a-booted-iphone-simulator", "heading": "iOS — a booted iPhone simulator", "path": "docs/RELEASE-CHECKLIST.md", "excerpt": "- [ ] `mobium --driver wda map` on the home screen returns icons - [ ] Wait for something already on screen, and across a cold app launch - [ ] `mobium scroll-to` reaches a Settings row below the fold, and tapping it opens that screen - [ ] `mobium grant com.apple.Preferences photos` succeeds and says it could not be verified - [ ] `mobium grant <anything> camera` is refused, naming the missing service - [ ] Coordina…", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "docs/SETUP.md#an-apple-tv-simulator", "heading": "An Apple TV simulator", "path": "docs/SETUP.md", "excerpt": "Verified on a tvOS 26.5 simulator (Apple TV 4K, 3rd generation, at 1080p) with Xcode 26.6, on 2026-10-09. The tvOS platform is a separate download: ```sh xcodebuild -downloadPlatform tvOS # or Xcode > Settings > Components xcrun simctl create \"Apple TV\" \\ com.apple.CoreSimulator.SimDeviceType.Apple-TV-4K-3rd-generation-1080p \\ com.apple.CoreSimulator.SimRuntime.tvOS-26-5 xcrun simctl boot <udid> && open -a Simulator …", "gold": true}], "missed": false, "facts": ["An Apple TV has no touch screen, so tap and other gestures are refused; it is driven with the remote: press dpad-up/down/left/right to move focus, and press select to press what has focus. ⟦dpad-down / dpad-right / dpad-up / dpad-left ; no touch screen⟧", "map marks the element with focus as (button, focused), and map --diff reports focus moving, so the focused tile is the one select will press. ⟦(button, focused)⟧"], "concern": "", "check": "Claude's reading: SETUP's Apple TV section gives the remote buttons and the refusal of tap; CHALLENGES 355 (#259, after the pin) adds focused to map and map --diff, which snapshot.go and mapdiff.go implement. ROADMAP 'Under consideration' also mentions 355 for the Fire TV. Verified in: internal/agent/remote.go:11, cmd/mobium/buttons.go:8, internal/uitree/snapshot.go:80, internal/agent/mapdiff.go:99."}, {"id": "g026", "kind": "fact", "question": "My Compose screen has a Material 3 RangeSlider for a price range, with a minimum and a maximum thumb. How do I set each thumb with Mobium, and how does Mobium move it?", "tags": ["how-to", "test-author", "new since 7b590a4"], "gold": [{"id": "CHALLENGES#357", "heading": "357. A two-thumb slider: a `MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "CHALLENGES#320", "heading": "320. A two-thumb slider built from ARIA was not in `map`, and one built from ranges moved the wrong thumb", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring two-thumb sliders, as pages build them, on MobiumApp's Slider Demo: Price, two `<input type=\"range\">` laid over one track, the minimum kept at or below the maximum by the page; and Hours, two `role=\"slider\"` thumbs on a drawn track, moved by a finger or the arrow keys, the way component libraries build one. Hours was not in `map` at all: the list of a page's elements had no `[role=slider]`. Pr…", "gold": false}], "missed": false, "facts": ["Each thumb is its own slider element (Material reports them as seek bars such as \"Range start\" and \"Range end\"), filled one at a time with fill and a position. ⟦Range start / Range end⟧", "A thumb of a two-thumb range is filled by dragging the thumb itself (a touch on the track would move the nearer thumb), and the result is read back from the thumb's own bounds, a short drag corrected. ⟦dragging the thumb itself⟧", "On Android the drag takes hold 32dp in from the screen's sides (20 points on iOS), so it is not taken as the system back gesture. ⟦32dp⟧"], "concern": "", "check": "Claude's reading: CHALLENGES 357 (#262, after the pin) is the only place the native two-thumb fill is described; RangeThumb recognizes two slider/adjustable children of one parent and dragThumb drags and reads back with up to three attempts. The 0-to-1 position rule itself is in CHALLENGES 219 and the fill help, not in 357; I did not make it a fact. Verified in: internal/uitree/rangethumb.go:13, internal/mobiumdriver/range.go:33, internal/agent/slider.go:37."}, {"id": "g027", "kind": "fact", "question": "After tapping Log In, my test needs to wait until the error label says exactly \"Incorrect username or password.\" How do I write that wait with Mobium, and how long does it wait before failing?", "tags": ["how-to", "test-author"], "gold": [{"id": "docs/guides/autowait.md#5-waiting-on-purpose-mobium-wait", "heading": "5. Waiting on purpose: `mobium wait`", "path": "docs/guides/autowait.md", "excerpt": "The checks above make each action wait for its own target. For everything else — a result to arrive, a spinner to go, a state to change — say what you are waiting for, instead of sleeping: ``` $ mobium wait testid=loginError --for text --text \"Incorrect username or password.\" --exact testid=loginError says exactly \"Incorrect username or password.\" after 1.631s — @e1 ScrollView (list) ``` It returned as soon as the te…"}], "retrieved": [{"id": "docs/guides/autowait.md#5-waiting-on-purpose-mobium-wait", "heading": "5. Waiting on purpose: `mobium wait`", "path": "docs/guides/autowait.md", "excerpt": "The checks above make each action wait for its own target. For everything else — a result to arrive, a spinner to go, a state to change — say what you are waiting for, instead of sleeping: ``` $ mobium wait testid=loginError --for text --text \"Incorrect username or password.\" --exact testid=loginError says exactly \"Incorrect username or password.\" after 1.631s — @e1 ScrollView (list) ``` It returned as soon as the te…", "gold": true}, {"id": "docs/guides/test-runner.md#4-run-only-what-failed", "heading": "4. Run only what failed", "path": "docs/guides/test-runner.md", "excerpt": "``` $ mobium test --last-failed FAIL [android] login.test.json › a wrong password is refused (8.7s) step 4 (app_wait_for): [timeout] step 4 of 4 (app_wait_for) failed: timed out after 3.018s waiting for testid=loginError to say exactly \"Wrong password.\" — its text is \"Incorrect username or password cator> --for text --text \"...\" --exact waits until the element's text is exactly that (without --exact it waits for the text to contain it). ⟦--exact ; --for text⟧", "The default timeout is 10 seconds; --timeout changes it, up to two minutes."], "concern": "", "check": "Claude's reading: autowait.md section 5 has the exact command and the timeout table; wait.go sets defaultWaitTimeout 10s and maxWaitTimeout 120s, and the CLI's --exact matches the whole text. The 10-second and two-minute numbers are too common in the corpus to anchor, so fact 2 is left to the judge. Verified in: cmd/mobium/wait.go:59, cmd/mobium/wait.go:61, internal/agent/wait.go:54."}, {"id": "g028", "kind": "fact", "question": "What does Mobium do when I tap a button that another view is drawn over, both when the cover hides the whole button and when it hides only the middle of it?", "tags": ["behavior", "test-author"], "gold": [{"id": "docs/guides/autowait.md#3-refusing-what-is-covered", "heading": "3. Refusing what is covered", "path": "docs/guides/autowait.md", "excerpt": "The Obstruction Demo draws controls over its targets — a full cover, a half cover over the center, an edge cover that leaves the center clear, views that take no touches, an overlay hidden from accessibility, a scrim: ![The Obstruction Demo: a column of buttons, each with something drawn over it](images/autowait-5-covers.jpg) One is covered entirely by another button: ``` $ mobium tap testid=fullTarget error: testid=…"}], "retrieved": [{"id": "docs/guides/autowait.md#3-refusing-what-is-covered", "heading": "3. Refusing what is covered", "path": "docs/guides/autowait.md", "excerpt": "The Obstruction Demo draws controls over its targets — a full cover, a half cover over the center, an edge cover that leaves the center clear, views that take no touches, an overlay hidden from accessibility, a scrim: ![The Obstruction Demo: a column of buttons, each with something drawn over it](images/autowait-5-covers.jpg) One is covered entirely by another button: ``` $ mobium tap testid=fullTarget error: testid=…", "gold": true}, {"id": "CHALLENGES#115", "heading": "115. A tap under the app's own overlay reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Obstruction Demo, built for the purpose after the Dialog Demo's pinned button was seen covering the camera button while both platforms called both visible. Each case is a target with a known cover, every cover itself pressable, and one line saying which of them a tap really reached. On a Pixel 7 AVD and an iPhone 17 Pro simulator, `tap` answered \"tapped\" eight times out of eight, and six of …", "gold": false}, {"id": "CHALLENGES#107", "heading": "107. A tap on a button under the keyboard reported success", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the iOS login demo, where Log In sat under the keyboard; the app's layout was fixed then, and the Dialog Demo's pinned button is the case kept on purpose. The keyboard is the dialog case one layer over, in the same two shapes. On iOS the keyboard is an `XCUIElementTypeKeyboard` in the app's tree, and what it covers stays there, marked not visible — the field being typed into included — so a locator reso…", "gold": false}, {"id": "docs/guides/autowait.md#what-it-does-not-see", "heading": "What it does not see", "path": "docs/guides/autowait.md", "excerpt": "- **An overlay hidden from accessibility on iOS.** On a real iPhone no action checks for one: a tap under it lands on the overlay and is reported as tapped. WebDriverAgent's tree does not contain it, and its own `hittable` gets it wrong too, measured. It is uncommon — none was met in five third-party apps driven on the phone — and asking each action would cost more than the action: through the gray box, one question …", "gold": false}], "missed": false, "facts": ["Fully covered: it waits about two seconds in case the cover goes (a toast does), then refuses with failed check receivesEvents, naming the cover excerpt": "Never sleep. Every action already retries for two seconds while the screen settles, so a tap straight after a launch or another tap is fine. When something takes longer than that — a login, a network fetch — wait for the thing itself rather than for a duration: - `mobium wait \"text=Welcome back\"` — until it is on screen - `mobium wait 'text=\"Wi-Fi\"'` — quoted: the whole text, so a part of it on the screen you are lea…", "gold": false}, {"id": "docs/guides/autowait.md#5-waiting-on-purpose-mobium-wait", "heading": "5. Waiting on purpose: `mobium wait`", "path": "docs/guides/autowait.md", "excerpt": "The checks above make each action wait for its own target. For everything else — a result to arrive, a spinner to go, a state to change — say what you are waiting for, instead of sleeping: ``` $ mobium wait testid=loginError --for text --text \"Incorrect username or password.\" --exact testid=loginError says exactly \"Incorrect username or password.\" after 1.631s — @e1 ScrollView (list) ``` It returned as soon as the te…", "gold": false}, {"id": "docs/guides/autowait.md#1-waiting-for-something-to-stop-moving", "heading": "1. Waiting for something to stop moving", "path": "docs/guides/autowait.md", "excerpt": "The Motion Demo's Replay button slides a target in over two seconds. Tap the target the moment after Replay, with no sleep in between: ``` $ mobium tap testid=ignoringReplay tapped testid=ignoringReplay at (540, 1315) $ mobium tap testid=ignoringTarget tapped testid=ignoringTarget at (316, 1472) $ mobium text testid=ignoringResult Ignoring: tapped 2697ms after replay ``` | Just after Replay: the target still sliding …", "gold": false}, {"id": "CHALLENGES#118", "heading": "118. A tap inside a WebView was never checked, and went wherever the page put it", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** MobiumApp's Actionability page, the Obstruction Demo's web counterpart, built once native actions had learned to wait and to refuse. In a WebView  nine times out of nine: | Target | What the tap reached | | --- | --- | | sliding in over t…", "gold": false}, {"id": "README.md#actions-wait-and-refuse-what-they-cannot-do", "heading": "Actions wait, and refuse what they cannot do", "path": "README.md", "excerpt": "Before acting, every action waits for its target to exist, be in view, stop moving and be enabled, and scrolls to it if it is off screen. It refuses — rather than taps — a target under a dialog or the keyboard, and `type` refuses what is certainly not a text field. When the app itself has drawn a control over the target, a tap aims at a clear part of it, waits for the cover to go, or refuses and names the cover; anyt…", "gold": false}, {"id": "docs/guides/autowait.md#4-refusing-the-wrong-kind-of-target", "heading": "4. Refusing the wrong kind of target", "path": "docs/guides/autowait.md", "excerpt": "`type` and `fill` go into text fields. Anything that is certainly not one is refused before a key is sent: ``` $ mobium type testid=loginBtn hello error: testid=loginBtn failed check editable: it is a button, not a text field — app_type types into a field; to press it, use app_tap ```", "gold": false}], "missed": false, "facts": ["With --json the refusal has code element_not_reachable, and the CLI exits with status 4. ⟦element_not_reachable ; exit status (4⟧", "details.check names the failed check (receivesEvents for a cover); decide by code and details.check, never by the message text, which may change. ⟦details.check⟧"], "concern": "", "check": "Claude's reading: autowait.md section 6 shows the JSON and names exit 4; mobiumerr.ExitCode returns 4 for element_not_reachable and failedCheck puts check and reason in details. Exit 4 also covers no_such_element and ambiguous_locator, so the code field is what separates them. Verified in: internal/mobiumerr/mobiumerr.go:245, internal/agent/handlers.go:1142."}, {"id": "g032", "kind": "fact", "question": "In my Compose app the Price filter chip is off the right edg ding": "322. A chip in plain sight, a point past its row, was swiped for", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a SwiftUI checkout app written to be tested (Morpho Market, mobiumdev/morpho-market), on the iPhone 17 Pro simulator, iOS 26.5. Its size and category chips are capsules with an outline, and SwiftUI reports each one's frame a point outside its horizontal scroll view: 34 points high from y=452 in a row from y=453 to 486, and the first chip a point past the leading edge too. A target had to fit inside its …", "gold": false}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "CHALLENGES#176", "heading": "176. Every Compose icon button mapped twice", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** `mobium map` on Seal, a Jetpack Compose app from F-Droid, on the first screen — the first Compose app this project had driven. Its three icon buttons came out as six entries: \"Settings\", and \"Settings (button)\". Compose wraps an icon button in a tooltip box, long-clickable so a long press shows the tooltip, and lays it out a pixel off the button's own bounds: `[32,95][158,221]` around `[33,96][159,222]`…", "gold": false}], "missed": false, "facts": ["A scroll given a direction swipes the largest scrollable whose class says it scrolls that way; Compose reports a horizontalScroll row as HorizontalScrollView, so the chip row is swiped, not the grid. ⟦HorizontalScrollView⟧", "An up or down scroll never swipes a row hat left an app handed focus over in about 0.1s — so a back insid…"}], "retrieved": [{"id": "skills/mobile-check/SKILL.md#interruptions-and-hardware-buttons", "heading": "Interruptions and hardware buttons", "path": "skills/mobile-check/SKILL.md", "excerpt": "```sh mobium press back # primary navigation on Android; says where it went mobium press back --gesture # the swipe in from the edge; the only back on iOS mobium press home # says the launcher came forward mobium lock lock # a state, not a toggle mobium call ring # then accept, or hang mobium sms \"your code is 123456\" mobium timezone Asia/Tokyo mobium notifications # what is in the shade? mobium notifications --post …", "gold": false}, {"id": "docs/BACK.md#in-mobium", "heading": "In Mobium", "path": "docs/BACK.md", "excerpt": "Fixed on 2026-10-01, and held by `docs/checks/back.sh`, which passed on the Pixel 8 Pro, both AVDs, the simulator and the iPhone 15 Plus: - `press back` says what back did: \"it left <app>; <app> is in the foreground\", or \"<app> is still in the foreground\", and on iOS what the navigation bar says now. It waits for that outcome by its own clock — a back that left an app handed focus over in about 0.1s — so a back insid…", "gold": true}, {"id": "docs/checks/README.md#running-several-at-once", "heading": "Running several at once", "path": "docs/checks/README.md", "excerpt": "Every check sources [lib.sh](lib.sh), which keeps it from reaching into another: - **A daemon of its own** (`MOBIUM_SESSION`), stopped when the check ends. Checks once shared one: a check that ended on the `uiautomator` backend handed it to every check after, and one run's `daemon stop` ended another device's trace. A session the caller set, as a grid run's or `mobium test`'s, is kept. - **One check per device.** `ch…", "gold": false}, {"id": "docs/BACK.md#ios", "heading": "iOS", "path": "docs/BACK.md", "excerpt": "iOS has no system back. Going back is the app's: a navigation bar's back button, and, for a `UINavigationController`, a swipe. Mobium refuses `press back` there by design (it is not an event iOS sends); `press back --gesture` sends the swipe, starting in the navigation bar, since the measurements below found a swipe over a list row taken by the row ([In Mobium](#in-mobium)). | | MobiumApp | Control | | --- | --- | --…", "gold": false}], "missed": false, "facts": ["An edge swipe is back only in gesture navigation; with three-button navigation it does nothing, so press back --gesture is refused there and the back button (plain press back) is the user's back. ⟦three-button⟧", "The mode can be read with settings get secure navigation_mode (2 gestures, 0 three buttons), and mobium devices names an Android device's navigation mode. ⟦navigation_mode⟧"], "concern": "", "check": "Claude's reading: BACK.md 'MobiumApp as shipped' measured that edge swipes do nothing in three-button mode and gives navigation_mode values; 'In Mobium' says --gesture is refused on button navigation and devices names the mode. gestureBack returns unsupported unless the mode is gestures. Verified in: internal/agent/back.go:46, internal/agent/back.go:51."}, {"id": "g034", "kind": "fact", "question": "mobium contexts lists only NATIVE_APP for my app even though a screen clearly shows web content. Why can't Mobium see the WebView, and what has to change?", "tags": ["troubleshooting", "test-author"], "gold": [{"id": "README.md#hybrid-apps-and-webviews", "heading": "Hybrid apps and WebViews", "path": "README.md", "excerpt": "A hybrid app's web content is not usable through the accessibility tree, so Mobium attaches to the WebView, and switching context changes what `map` and `tap` operate on: ``` $ mobium contexts NATIVE_APP (current) WEBVIEW_com.example — Checkout https://shop.example/cart $ mobium context WEBVIEW_com.example $ mobium map @e1 Promo code (input) @e2 Apply (button) $ mobium tap @e2 tapped @e2 at (462, 397) in WEBVIEW_com.…"}], "retrieved": [{"id": "skills/mobile-check/SKILL.md#hybrid-apps-webviews", "heading": "Hybrid apps (WebViews)", "path": "skills/mobile-check/SKILL.md", "excerpt": "Web content inside an app is a separate context: ```sh mobium contexts # NATIVE_APP, WEBVIEW_com.example mobium context WEBVIEW_com.example # map and tap now work on the page mobium context NATIVE_APP # back to the native shell ``` This works on **both platforms**. Android WebViews must be debuggable (`setWebContentsDebuggingEnabled(true)`) and iOS WKWebViews must be inspectable (`webView.isInspectable = true` on iOS…", "gold": false}, {"id": "README.md#hybrid-apps-and-webviews", "heading": "Hybrid apps and WebViews", "path": "README.md", "excerpt": "A hybrid app's web content is not usable through the accessibility tree, so Mobium attaches to the WebView, and switching context changes what `map` and `tap` operate on: ``` $ mobium contexts NATIVE_APP (current) WEBVIEW_com.example — Checkout https://shop.example/cart $ mobium context WEBVIEW_com.example $ mobium map @e1 Promo code (input) @e2 Apply (button) $ mobium tap @e2 tapped @e2 at (462, 397) in WEBVIEW_com.…", "gold": true}, {"id": "docs/APP-TYPES.md#hybrid", "heading": "Hybrid", "path": "docs/APP-TYPES.md", "excerpt": "A native app with a WebView inside it. The article's point that a hybrid app is *technically a subcategory of native* — because the outermost component is native — is exactly the shape of Mobium's context model: `NATIVE_APP` is the shell, and each page is its own `WEBVIEW_<package>` context. The more useful observation is the one about **ratio**: some hybrid apps are almost entirely WebView, others expose a small one…", "gold": false}, {"id": "CHALLENGES#312", "heading": "312. `find` inside a WebView answered from the native screen", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** giving WebViews locators (ROADMAP, locators item 4) and checking them on MobiumApp's Actionability and Frames pages, each tap judged by what the page said it reached. With a WebView's context selected, every ac n", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…"}], "retrieved": [{"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": true}, {"id": "CHALLENGES#320", "heading": "320. A two-thumb slider built from ARIA was not in `map`, and one built from ranges moved the wrong thumb", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** measuring two-thumb sliders, as pages build them, on MobiumApp's Slider Demo: Price, two `<input type=\"range\">` laid over one track, the minimum kept at or below the maximum by the page; and Hours, two `role=\"slider\"` thumbs on a drawn track, moved by a finger or the arrow keys, the way component libraries build one. Hours was not in `map` at all: the list of a page's elements had no `[role=slider]`. Pr…", "gold": false}, {"id": "CHALLENGES#357", "heading": "357. A two-thumb slider: a fill that moved nothing said it moved, and a thumb at the edge closed the app", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** native two-thumb sliders (ROADMAP, \"Sliders\"), on a price range added to Morpho Market for them — Material 3's `RangeSlide r went wrong", "path": "docs/GESTURES.md", "excerpt": "All three were found by a witness, and none was visible to the tool, which reported every gesture as delivered until the last one, which reported a failure and left the device unable to accept any touch at all. **UiAutomator2 forgets a finger that pauses.** It builds each step's Android `MotionEvent` from the fingers that have an event *in that step*, and counts the fingers already down from the same events. A holdin…"}], "retrieved": [{"id": "docs/GESTURES.md#three-ways-a-second-finger-went-wrong", "heading": "Three ways a second finger went wrong", "path": "docs/GESTURES.md", "excerpt": "All three were found by a witness, and none was visible to the tool, which reported every gesture as delivered until the last one, which reported a failure and left the device unable to accept any touch at all. **UiAutomator2 forgets a finger that pauses.** It builds each step's Android `MotionEvent` from the fingers that have an event *in that step*, and counts the fingers already down from the same events. A holdin…", "gold": true}, {"id": "CHALLENGES#86", "heading": "86. On Android 16 and later, one press-tap breaks injected touch for the whole device", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the gesture check on a Pixel 8 Pro (Android 17), where press-tap failed with UiAutomator2's \"Unable to perform W3C actions\" — and then so did everything after it, plain taps included, and `adb shell input tap` too. UiAutomator2 (10.6.6, the newest release) stamps each event with the down time of the finger that produced it (`startTimestamp + event.startDelta`, the chain's own `pointerDown`). Android's c…", "gold": false}, {"id": "CHALLENGES#149", "heading": "149. `double-tap` reached a React Native control on iOS as one press", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** a person, as the control ROADMAP had asked for: Lana double-tapped MobiumApp's Press target on the iPhone 15 Plus and it counted two pres  errLateFinger in multitouch.go carries the same reason. Android 16+ is refused for a different reason (UiAutomator2's down time), in the same section's second part — not asked here. Verified in: internal/mobiumdriver/multitouch.go:181."}, {"id": "g039", "kind": "unanswerable", "question": "How do I raise Mobium's implicit wait so every tap waits up to 10 seconds for its target instead of 2?", "tags": ["how-to", "test-author"], "gold": [], "retrieved": [{"id": "skills/mobile-check/SKILL.md#waiting", "heading": "Waiting", "path": "skills/mobile-check/SKILL.md", "excerpt": "Never sleep. Every action already retries for two seconds while the screen settles, so a tap straight after a launch or another tap is fine. When something takes longer than that — a login, a network fetch — wait for the thing itself rather than for a duration: - `mobium wait \"text=Welcome back\"` — until it is on screen - `mobium wait 'text=\"Wi-Fi\"'` — quoted: the whole text, so a part of it on the screen you are lea…", "gold": false}, {"id": "skills/mobile-check/SKILL.md#acting", "heading": "Acting", "path": "skills/mobile-check/SKILL.md", "excerpt": "Every action waits, for up to two seconds, until its target is on screen, **enabled** and holding still, and refuses — with a reason and a remedy — rather than tapping something a user could not: a target under a system dialog or under the keyboard, a control that stays disabled, or a button passed to `type`. - `mobium tap @e5` — tap a ref - `mobium tap \"text=Sign In\"` — tap by locator, no map needed - `mobium tap 54…", "gold": false}, {"id": "docs/guides/autowait.md#1-waiting-for-something-to-stop-moving", "heading": "1. Waiting for something to stop moving", "path": "docs/guides/autowait.md", "excerpt": "The Motion Demo's Replay button slides a target in over two seconds. Tap the target the moment after Replay, with no sleep in between: ``` $ mobium tap testid=ignoringReplay tapped testid=ignoringReplay at (540, 1315) $ mobium tap testid=igno ded on the Login Demo: ```json { \"app\": \"dev.mobium.mobiumapp\", \"description\": \"Recorded with mobium inspect.\", \"tests\": [ { \"name\": \"recorded\", \"steps\": [ {\"tap\": \"text=Logi…", "gold": true}, {"id": "docs/ROADMAP.md#under-consideration", "heading": "Under consideration", "path": "docs/ROADMAP.md", "excerpt": "- **Locators for when there is no ref** (written down 2026-10-12). A ref from `map` lasts one map, so an agent has one and a `mobium test` file does not: a hand-written test has the flat `kind=value` locators — text, label, testid, role, class, path, narrowed by `,role=` — which match one element or are refused. That is right on a form and leaves nothing durable on a list. Every Ice Cubes post has a \"…\" (CHALLENGES 2…", "gold": false}, {"id": "CHALLENGES#314", "heading": "314. A recording wrote locators that named less than `map` had, and refs", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** writing down a recording as code (ROADMAP, #202) and reading the recorder's `target` for what it would emit. Two things, both measured after: `map` derives every native locator as the whole value and checks it names one element so (`uitree.Derive`), and the inspector rebuilt it without `Exact`. So it recorded `text=Welcome`, which \"Welcome back\" meets too: the race of CHALLENGES 233, written into a test…", "gold": false}], "missed": false, "facts": ["mobium inspect --record <file> writes the recording after every step. ⟦--record⟧", "The file is a .test.json, or a program chosen by its extension: .py, .mjs, .go, .java or .cs, the same file the download gives. ⟦.mjs ; .cs⟧"], "concern": "", "check": "Claude's reading: the --record paragraph sits at the end of inspector.md section 4, not section 5, which is why the gold is #4; the extension table in codegen.go matches the doc's five. New since the pin (#261). Verified in: cmd/mobium/inspect.go:30, cmd/mobium/inspect.go:72, internal/codegen/codegen.go:28, internal/inspect/inspect.go:57."}, {"id": "g043", "kind": "fact", "question": "My inspector recording includes a two-finger tap. What happens when I try to download it as a Go program?", "tags": ["behavior", "test-author", "new since 7b590a4"], "gold": [{"id": "docs/guides/inspector.md#5-download-it-as-code", "heading": "5. Download it as code", "path": "docs/guides/inspector.md", "excerpt": "Next to **Download**, pick the language: the test file, or a program in Python, JavaScript, Go, Java or .NET. Every step is one tool call and every client has every tool, so the program is the same steps through the client's own methods, starting from the app launched fresh. The Table Demo recording above, as Python: ```python # Recorded with mobium inspect. from mobium import start with start() as device: device.ter…"}], "retrieved": [{"id": "CHALLENGES#86", "heading": "86. On Android 16 and later, one press-tap breaks injected touch for the whole device", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** the gesture check on a Pixel 8 Pro (Android 17), where press-tap failed with UiAutomator2's \"Unable to perform W3C actions\" — and then so did everything after it, plain taps included, and `adb shell input tap` too. UiAutomator2 (10.6.6, the newest release) stamps each event with the down time of the finger that produced it (`startTimestamp + event.startDelta`, the chain's own `pointerDown`). Android's c…", "gold": false}, {"id": "CHALLENGES#84", "heading": "84. UiAutomator2 forgets a finger that pauses", "path": "docs/CHALLENGES.md", "excerpt": "**Found by:** press-tap, on the Multi-Touch pad, which said \"one finger\" for a gesture the tool reported as two. Android's own pointer-location overlay agreed — `P: 0 / 1`, against `P: 0 / 2` for a two-finger tap, its control. UiAutomator2 (10.6.6, `ActionsExecutor.executeMotionEvents`) builds each W3C step's `MotionEvent` from the fingers that have an event in that step, and counts the fingers already down from the …", "gold": false}, {"id": "docs/checks/README.m
